<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#14181d" />
  <title>TOKYO JUNGLE：地下生存戰 - 寫實猛獸多人連線版</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0d1014;
      color: #18181b;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Noto Serif TC', 'Noto Sans TC', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100%;
      max-height: 940px;
      display: flex;
      flex-direction: column;
      background: #cfd6df;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
      overflow: hidden;
      border-left: 1px solid #334155;
      border-right: 1px solid #334155;
    }

    /* 頂部寫實荒野風 HUD */
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: linear-gradient(180deg, #181c22 0%, #0f1217 100%);
      border-bottom: 2px solid #3f3f46;
      z-index: 10;
      gap: 6px;
      color: #f4f4f5;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .hp-label {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #d4d4d8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hp-bar {
      display: flex;
      gap: 2px;
      background: #090b0e;
      padding: 3px;
      border-radius: 3px;
      border: 1px solid #52525b;
    }

    .hp-unit {
      width: 8px;
      height: 11px;
      background: #27272a;
      transition: background-color 0.15s ease;
    }

    .hp-unit.active {
      background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%);
      box-shadow: 0 0 4px rgba(245, 158, 11, 0.6);
    }

    .hp-unit.danger {
      background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%);
      box-shadow: 0 0 5px rgba(239, 68, 68, 0.85);
    }

    .hud-center {
      text-align: center;
      background: #090b0e;
      padding: 2px 10px;
      border-radius: 4px;
      border: 1px solid #52525b;
      min-width: 108px;
    }

    .floor-title {
      font-size: 12px;
      color: #d97706;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .floor-num {
      font-size: 18px;
      font-weight: 900;
      font-family: Georgia, 'Times New Roman', serif;
      font-variant-numeric: tabular-nums;
      color: #fafafa;
      letter-spacing: 1px;
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 5px;
      border: 1px solid #52525b;
      background: #27272a;
      color: #f4f4f5;
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: #3f3f46;
    }

    /* 多人即時生存條 */
    .mp-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      background: #14171c;
      border-bottom: 1px solid #27272a;
      font-size: 12px;
      z-index: 9;
      gap: 6px;
      min-height: 27px;
      color: #e4e4e7;
    }

    .mp-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      color: #d4d4d8;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #52525b;
    }

    .dot.online {
      background: #f59e0b;
      box-shadow: 0 0 6px #f59e0b;
    }

    .mp-players-strip {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .mp-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 3px;
      background: #27272a;
      border: 1px solid #3f3f46;
      font-size: 12px;
      font-weight: 700;
      color: #f4f4f5;
      white-space: nowrap;
    }

    .mp-chip.dead {
      opacity: 0.4;
      text-decoration: line-through;
    }

    /* 畫布區 */
    .canvas-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background: #d8dee8;
      touch-action: none;
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 吼叫/情緒快捷列 */
    .emote-bar {
      position: absolute;
      right: 8px;
      bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 12;
    }

    .emote-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(39, 39, 42, 0.55);
      background: rgba(24, 24, 27, 0.78);
      color: #fafafa;
      font-size: 12px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .emote-btn:active {
      transform: scale(0.86);
      background: rgba(217, 119, 6, 0.85);
    }

    /* 底部手機觸控控制器 */
    .controls {
      height: 98px;
      background: linear-gradient(0deg, #090b0e 0%, #181c22 100%);
      border-top: 2px solid #3f3f46;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
      touch-action: none;
    }

    .ctrl-btn {
      position: relative;
      border-radius: 8px;
      border: 2px solid #52525b;
      background: linear-gradient(180deg, #27272a 0%, #18181b 100%);
      color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 4px 0 #09090b, inset 0 1px 0 rgba(255, 255, 255, 0.12);
      cursor: pointer;
    }

    .ctrl-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #09090b;
      border-color: #f59e0b;
      background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
      color: #fef3c7;
    }

    .ctrl-arrow {
      font-size: 22px;
      line-height: 1;
    }

    /* ============== 《TOKYO JUNGLE》蒼白迷霧寫實風選角大廳 ============== */
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, rgba(248, 250, 252, 0.96) 0%, rgba(212, 220, 232, 0.95) 60%, rgba(168, 179, 194, 0.96) 100%);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 10px;
      z-index: 20;
      overflow-y: auto;
      color: #18181b;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: auto 0;
    }

    .header-banner {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid #18181b;
      padding-bottom: 3px;
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      font-family: Georgia, 'Times New Roman', serif;
      color: #09090b;
      letter-spacing: 0.5px;
    }

    .badge {
      padding: 2px 7px;
      background: #18181b;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    /* 選中角色超大動態展示舞台 (Large Spotlight Showcase) */
    .showcase-stage {
      position: relative;
      width: 100%;
      height: 168px;
      background: radial-gradient(ellipse at 50% 55%, #ffffff 0%, #e2e8f0 65%, #cbd5e1 100%);
      border: 2px solid #18181b;
      border-radius: 8px;
      box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.14), 0 6px 18px rgba(0, 0, 0, 0.16);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      cursor: pointer;
    }

    .showcase-canvas-wrap {
      position: relative;
      width: 56%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#previewCanvas {
      width: 210px;
      height: 156px;
      display: block;
    }

    .showcase-rank-num {
      position: absolute;
      left: 6px;
      bottom: -8px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 68px;
      font-weight: 900;
      color: rgba(15, 23, 42, 0.14);
      line-height: 1;
      pointer-events: none;
    }

    .showcase-info {
      width: 44%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
      z-index: 2;
      padding-left: 6px;
      border-left: 1.5px solid rgba(24, 24, 27, 0.15);
    }

    .showcase-name {
      font-size: 19px;
      font-weight: 900;
      color: #09090b;
      line-height: 1.15;
    }

    .showcase-en {
      font-size: 12px;
      font-weight: 800;
      color: #71717a;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .stat-bars {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 6px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 800;
      color: #27272a;
    }

    .stat-track {
      flex: 1;
      height: 6px;
      background: #cbd5e1;
      border: 1px solid #475569;
      overflow: hidden;
    }

    .stat-fill {
      height: 100%;
      background: linear-gradient(90deg, #b45309 0%, #d97706 100%);
      transition: width 0.25s ease;
    }

    .showcase-desc {
      font-size: 12px;
      color: #27272a;
      font-weight: 700;
      line-height: 1.3;
      background: rgba(255, 255, 255, 0.72);
      padding: 4px 6px;
      border-left: 3px solid #b45309;
    }

    /* 兩小排選角列 (2 Rows × 6 Columns = 12隻，選中時放大凸顯！) */
    .roster-section-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 900;
      color: #27272a;
      padding: 0 2px;
    }

    .animal-grid-2rows {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(2, 62px);
      gap: 6px;
      padding: 6px 4px;
      margin: 2px 0;
    }

    .animal-cell {
      position: relative;
      background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 100%);
      border: 1.5px solid #52525b;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 3px;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s ease, border-color 0.15s ease, background 0.15s ease;
      overflow: visible;
    }

    .animal-cell canvas {
      width: 52px;
      height: 42px;
      display: block;
      pointer-events: none;
      transition: transform 0.18s ease;
    }

    .animal-cell-name {
      font-size: 12px;
      font-weight: 900;
      color: #18181b;
      line-height: 1;
      white-space: nowrap;
      transform: scale(0.92);
    }

    /* 選到時明顯變大凸起！ */
    .animal-cell.selected {
      transform: scale(1.24) translateY(-4px);
      z-index: 15;
      background: radial-gradient(circle at 50% 40%, #ffffff 0%, #fef3c7 100%);
      border: 2.5px solid #b45309;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.42), 0 0 0 2px #f59e0b;
    }

    .animal-cell.selected canvas {
      transform: scale(1.16) translateY(-2px);
    }

    .animal-cell.selected .animal-cell-name {
      color: #92400e;
      transform: scale(1);
    }

    /* 多人連線設定盒 */
    .mp-box {
      background: rgba(24, 24, 27, 0.92);
      border: 1.5px solid #18181b;
      border-radius: 8px;
      padding: 8px 10px;
      color: #f4f4f5;
      text-align: left;
    }

    .mp-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    .mp-input {
      flex: 1;
      min-width: 0;
      background: #27272a;
      border: 1px solid #52525b;
      color: #fafafa;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 800;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .mp-input:focus {
      border-color: #f59e0b;
    }

    .mp-btn {
      padding: 6px 9px;
      border-radius: 4px;
      border: 1px solid #f59e0b;
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .mp-btn.share {
      border-color: #e4e4e7;
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }

    .room-roster {
      font-size: 12px;
      color: #d4d4d8;
      padding-top: 5px;
      border-top: 1px dashed #3f3f46;
    }

    .roster-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }

    .roster-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 3px;
      background: #27272a;
      border: 1px solid #52525b;
      font-size: 12px;
      font-weight: 700;
      color: #f4f4f5;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 8px;
    }

    .primary-btn {
      width: 100%;
      padding: 11px 10px;
      border-radius: 6px;
      border: 2px solid #09090b;
      background: linear-gradient(180deg, #d97706 0%, #92400e 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 0 #09090b;
    }

    .primary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #09090b;
    }

    .secondary-btn {
      width: 100%;
      padding: 11px 10px;
      border-radius: 6px;
      border: 2px solid #09090b;
      background: #27272a;
      color: #fafafa;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #09090b;
    }

    .secondary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #09090b;
    }

    .toast {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: #18181b;
      border: 1.5px solid #f59e0b;
      color: #fafafa;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 800;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="toast" id="toast">已複製房間邀請連結！</div>

    <!-- 頂部狀態列 -->
    <div class="hud">
      <div class="hud-left">
        <div class="hp-label">
          <span id="hudAnimalLabel">孟加拉虎</span>
          <span id="hpText" style="color:#f59e0b;">12/12</span>
        </div>
        <div class="hp-bar" id="hpBar"></div>
      </div>

      <div class="hud-center">
        <div class="floor-title" id="zoneLabel">澀谷白霧豎井</div>
        <div class="floor-num" id="floorText">B0000</div>
      </div>

      <div class="hud-right">
        <button class="icon-btn" id="soundBtn" title="音效開關">音</button>
        <button class="icon-btn" id="pauseBtn" title="猛獸圖鑑與房間">獸</button>
      </div>
    </div>

    <!-- 多人連線狀態條 -->
    <div class="mp-bar">
      <div class="mp-status">
        <span class="dot" id="netDot"></span>
        <span id="roomLabel">區域: ----</span>
      </div>
      <div class="mp-players-strip" id="mpStrip"></div>
    </div>

    <!-- 遊戲畫布 -->
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="gameCanvas"></canvas>

      <!-- 野性呼喊互動鈕 -->
      <div class="emote-bar">
        <button class="emote-btn" data-emote="咆哮!">吼</button>
        <button class="emote-btn" data-emote="獵殺!">爪</button>
        <button class="emote-btn" data-emote="小心!">危</button>
        <button class="emote-btn" data-emote="霸主!">王</button>
      </div>

      <!-- 《TOKYO JUNGLE》寫實畫風選角大廳 -->
      <div class="overlay" id="overlay">
        <div class="card">
          <div class="header-banner">
            <div class="title" id="overlayTitle">TOKYO JUNGLE</div>
            <div class="badge" id="overlayBadge">SURVIVAL MULTIPLAYER</div>
          </div>

          <!-- 選中角色超大寫實動態預覽舞台 -->
          <div class="showcase-stage" id="showcaseStage" title="點擊可觸發猛獸飛撲動作">
            <div class="showcase-rank-num" id="showcaseNum">1</div>
            <div class="showcase-canvas-wrap">
              <canvas id="previewCanvas" width="420" height="312"></canvas>
            </div>
            <div class="showcase-info">
              <div class="showcase-name" id="detailTitle">孟加拉虎</div>
              <div class="showcase-en" id="detailEn">BENGAL TIGER · 1.5t</div>
              <div class="stat-bars">
                <div class="stat-row">
                  <span>噸位</span>
                  <div class="stat-track"><div class="stat-fill" id="barWeight" style="width:65%;"></div></div>
                </div>
                <div class="stat-row">
                  <span>敏捷</span>
                  <div class="stat-track"><div class="stat-fill" id="barSpeed" style="width:90%;"></div></div>
                </div>
                <div class="stat-row">
                  <span>衝撞</span>
                  <div class="stat-track"><div class="stat-fill" id="barPush" style="width:85%;"></div></div>
                </div>
              </div>
              <div class="showcase-desc" id="detailDesc">【猛虎飛撲】助跑跳離階梯時爆發水平飛撲；從空中踩中獵物可借力二度躍起！</div>
            </div>
          </div>

          <!-- 兩小排選角列 (2排 × 6格，點選時該格放大且上方舞台同步變大展示) -->
          <div class="roster-section-label">
            <span>▼ 點選物種（選中放大檢視動態細節）</span>
            <span id="bestScoreText">最高生存: B0000</span>
          </div>
          <div class="animal-grid-2rows" id="animalGrid"></div>

          <!-- 多人連線房間設定 -->
          <div class="mp-box">
            <div class="mp-row">
              <input type="text" id="nameInput" class="mp-input" maxlength="8" placeholder="生存者名稱" style="max-width:110px;" />
              <input type="text" id="roomInput" class="mp-input" maxlength="8" placeholder="房號" style="text-transform:uppercase;max-width:76px;" />
              <button class="mp-btn" id="joinRoomBtn">切換區域</button>
              <button class="mp-btn share" id="shareBtn">邀請連線</button>
            </div>

            <div class="room-roster">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span id="connStatusText">連線準備中...</span>
                <span id="playerCountLabel" style="color:#fbbf24;font-weight:800;">同場 1 獸</span>
              </div>
              <div class="roster-list" id="rosterList"></div>
            </div>
          </div>

          <div class="btn-group">
            <button class="primary-btn" id="startMpBtn">全房同步狩獵開局</button>
            <button class="secondary-btn" id="startSoloBtn">單人立即求生</button>
          </div>
        </div>
      </div>
    </div>

          desc: '【太極肉彈】遭遇其他動物碰撞時以 1.7 倍反作用力將對方彈飛；每深入 12 階自動回復 +2 HP。'

      ];

      const ANIMAL_MAP = Object.fromEntries(ANIMALS.map(a => [a.id, a]));

      const canvas = document.getElementById('gameCanvas');

      const canvasWrap = document.getElementById('canvasWrap');

      const hpBarEl = document.getElementById('hpBar');

      const floorTextEl = document.getElementById('floorText');

      const overlayBadge = document.getElementById('overlayBadge');
      const overlayTitle = document.getElementById('overlayTitle');
      const bestScoreText = document.getElementById('bestScoreText');
      const startMpBtn = document.getElementById('startMpBtn');
      const startSoloBtn = document.getElementById('startSoloBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const soundBtn = document.getElementById('soundBtn');
      const btnLeft = document.getElementById('btnLeft');
      const btnRight = document.getElementById('btnRight');

      const showcaseStage = document.getElementById('showcaseStage');
      const showcaseNum = document.getElementById('showcaseNum');
      const animalGrid = document.getElementById('animalGrid');
      const detailTitle = document.getElementById('detailTitle');
      const detailEn = document.getElementById('detailEn');
      const barWeight = document.getElementById('barWeight');
      const barSpeed = document.getElementById('barSpeed');
      const barPush = document.getElementById('barPush');
      const detailDesc = document.getElementById('detailDesc');
      const nameInput = document.getElementById('nameInput');
      const roomInput = document.getElementById('roomInput');
      const joinRoomBtn = document.getElementById('joinRoomBtn');
      const shareBtn = document.getElementById('shareBtn');
      const connStatusText = document.getElementById('connStatusText');
      const playerCountLabel = document.getElementById('playerCountLabel');
      const rosterList = document.getElementById('rosterList');
      const netDot = document.getElementById('netDot');
      const roomLabel = document.getElementById('roomLabel');
      const mpStrip = document.getElementById('mpStrip');
      const toastEl = document.getElementById('toast');

      const LOGIC_W = 380;
      let W = LOGIC_W;
      let H = 560;
      let viewScale = 1;

      const MAX_HP = 12;
      const STORAGE_KEY = 'tokyo_jungle_v3_best';
      const NAME_KEY = 'tokyo_jungle_v3_name';
      const ANIMAL_KEY = 'tokyo_jungle_v3_animal';

      const myId = 'p_' + Math.random().toString(36).slice(2, 9);
      let myName = localStorage.getItem(NAME_KEY) || ('生存者' + Math.floor(10 + Math.random() * 89));
      let myAnimalId = localStorage.getItem(ANIMAL_KEY) || 'tiger';
      if (!ANIMAL_MAP[myAnimalId]) myAnimalId = 'tiger';
      nameInput.value = myName;

      let bestFloor = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
      bestScoreText.textContent = `最高生存: B${String(bestFloor).padStart(4, '0')}`;

      // ================== 寫實油彩骨骼肌理繪圖引擎 (Painterly Wildlife Anatomy Engine) ==================
      // 專為參考圖風格打造：高反差肌肉陰影、毛皮筆觸、虎紋/象牙/羽翼/犬耳動態繪製
      function drawRealisticAnimal(targetCtx, animalId, cx, cy, scale, facing, animPhase, leapPitch = 0) {
        const ani = ANIMAL_MAP[animalId] || ANIMALS[0];
        targetCtx.save();
        targetCtx.translate(cx, cy);
        targetCtx.scale((facing || 1) * scale, scale);
        targetCtx.rotate(leapPitch);

        const stride = Math.sin(animPhase);
        const cosStride = Math.cos(animPhase);

        // 建立寫實明暗油彩漸層 (Chiaroscuro Fur Gradient)
        const bodyGrad = targetCtx.createLinearGradient(0, -14, 0, 12);
        bodyGrad.addColorStop(0, ani.cLight);
        bodyGrad.addColorStop(0.55, ani.cMid);
        bodyGrad.addColorStop(1, ani.cDark);

        // 地面投影
        targetCtx.fillStyle = 'rgba(15, 23, 42, 0.22)';
        targetCtx.beginPath();
        targetCtx.ellipse(0, 15, 16, 3.5, 0, 0, Math.PI * 2);
        targetCtx.fill();

        // 鳥類系 (丹頂鶴 Crane / 漆黑渡鴉 Crow)
        if (animalId === 'crane' || animalId === 'crow') {
          const isCrane = animalId === 'crane';
          const wingFlap = Math.sin(animPhase * 1.4) * 11;

          // 後方遠端翅膀
          targetCtx.fillStyle = isCrane ? '#94a3b8' : '#0f172a';
          targetCtx.beginPath();
          targetCtx.moveTo(-4, -2);
          targetCtx.quadraticCurveTo(-16, -18 - wingFlap * 0.7, -26, -12 - wingFlap);
          targetCtx.lineTo(-12, 3);
          targetCtx.closePath();
          targetCtx.fill();

          // 修長雙足往後延伸 (如參考圖左上飛鶴)
          targetCtx.strokeStyle = '#1e293b';
          targetCtx.lineWidth = 1.6;
          targetCtx.beginPath();
          targetCtx.moveTo(-6, 4);
          targetCtx.lineTo(-22, 11 + stride * 2);
          targetCtx.moveTo(-4, 5);
          targetCtx.lineTo(-19, 14 - stride * 2);
          targetCtx.stroke();

          // 流線鳥身
          targetCtx.fillStyle = bodyGrad;
          targetCtx.beginPath();
          targetCtx.ellipse(0, 1, 12, 6.5, -0.15, 0, Math.PI * 2);
          targetCtx.fill();

          // 修長頸部與頭部
          targetCtx.strokeStyle = isCrane ? '#1e293b' : '#09090b';
          targetCtx.lineWidth = isCrane ? 3.5 : 5;
          targetCtx.beginPath();
          targetCtx.moveTo(8, -1);
          targetCtx.quadraticCurveTo(15, -7, 20, -6);
          targetCtx.stroke();

          if (isCrane) {
            // 丹頂鶴白首與朱紅鶴頂
            targetCtx.fillStyle = '#ffffff';
            targetCtx.beginPath();
            targetCtx.arc(20, -6, 3.2, 0, Math.PI * 2);
            targetCtx.fill();
            targetCtx.fillStyle = '#dc2626';
            targetCtx.beginPath();
            targetCtx.arc(20, -8.2, 2, 0, Math.PI * 2);
            targetCtx.fill();
          }

          // 尖銳長喙
          targetCtx.fillStyle = isCrane ? '#ca8a04' : '#334155';
          targetCtx.beginPath();
          targetCtx.moveTo(22, -7.5);
          targetCtx.lineTo(31, -5.5);
          targetCtx.lineTo(22, -4.5);
          targetCtx.closePath();
          targetCtx.fill();

          // 前景主翼（帶黑色飛羽筆觸）
          const wingGrad = targetCtx.createLinearGradient(0, -18, 0, 6);
          wingGrad.addColorStop(0, isCrane ? '#ffffff' : '#475569');
          wingGrad.addColorStop(0.7, isCrane ? '#e2e8f0' : '#1e293b');
          wingGrad.addColorStop(1, '#09090b');
          targetCtx.fillStyle = wingGrad;
          targetCtx.beginPath();
          targetCtx.moveTo(2, 0);
          targetCtx.quadraticCurveTo(-6, -20 + wingFlap, -22, -16 + wingFlap);
          targetCtx.lineTo(-16, -2 + wingFlap * 0.4);
          targetCtx.lineTo(-2, 4);
          targetCtx.closePath();
          targetCtx.fill();

          targetCtx.restore();
          return;
        }

        // 巨獸系：亞洲巨象 (如參考圖正中央下方的厚重巨象)
        if (animalId === 'elephant') {
          // 後腿與前腿（粗壯柱狀肌理）
          targetCtx.fillStyle = ani.cDark;
          targetCtx.fillRect(-13 + stride * 3, 2, 6, 12);
          targetCtx.fillRect(5 - stride * 3, 2, 6, 12);

          // 龐大灰岩質感軀幹
          targetCtx.fillStyle = bodyGrad;
          targetCtx.beginPath();
          targetCtx.ellipse(-2, -2, 16, 12, 0, 0, Math.PI * 2);
          targetCtx.fill();

          // 前景雙腿
          targetCtx.fillStyle = ani.cMid;
          targetCtx.fillRect(-10 - stride * 3, 3, 6.5, 12);
          targetCtx.fillRect(8 + stride * 3, 3, 6.5, 12);

          // 皮膚皺褶筆觸
          targetCtx.strokeStyle = 'rgba(15, 23, 42, 0.35)';
          targetCtx.lineWidth = 1;
          for (let wx = -8; wx <= 4; wx += 4) {
            targetCtx.beginPath();
            targetCtx.moveTo(wx, -9);
            targetCtx.lineTo(wx - 1, 4);
            targetCtx.stroke();
          }

          // 扇形巨耳
          targetCtx.fillStyle = ani.cDark;
          targetCtx.beginPath();
          targetCtx.ellipse(6, -4, 6.5, 9.5, -0.2, 0, Math.PI * 2);
          targetCtx.fill();
          targetCtx.strokeStyle = ani.cLight;
          targetCtx.lineWidth = 1;
          targetCtx.stroke();

          // 象頭與長垂象鼻
          targetCtx.fillStyle = bodyGrad;
          targetCtx.beginPath();
          targetCtx.arc(12, -4, 8, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.strokeStyle = ani.cMid;
          targetCtx.lineWidth = 5;
          targetCtx.lineCap = 'round';
          targetCtx.beginPath();
          targetCtx.moveTo(17, -3);
          targetCtx.quadraticCurveTo(23, 5, 19, 13 + cosStride * 2);
          targetCtx.stroke();

          // 兩根巨大彎曲白象牙 (如參考圖亮白象牙)
          targetCtx.strokeStyle = '#f8fafc';
          targetCtx.lineWidth = 2.6;
          targetCtx.beginPath();
          targetCtx.moveTo(14, 0);
          targetCtx.quadraticCurveTo(22, 4, 27, -2);
          targetCtx.stroke();

          // 深邃小眼
          targetCtx.fillStyle = '#09090b';
          targetCtx.beginPath();
          targetCtx.arc(15, -5, 1.5, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.restore();
          return;
        }

        // 四足飛撲猛獸與愛玩動物通用解剖骨架 (虎、獅、狼、米格魯、博美、瞪羚、野豬、河馬、熊貓)
        const isHeavy = ani.weight >= 1.5;
        const torsoLen = isHeavy ? 15 : (animalId === 'pomeranian' ? 9.5 : 13.5);
        const torsoThick = isHeavy ? 9.5 : (animalId === 'pomeranian' ? 7.5 : 7.2);

        // 1. 動態尾巴
        targetCtx.strokeStyle = ani.cDark;
        targetCtx.lineWidth = animalId === 'pomeranian' ? 4.5 : 2.5;
        targetCtx.lineCap = 'round';
        targetCtx.beginPath();
        if (animalId === 'pomeranian') {
          // 博美蓬鬆捲尾 (如參考圖左下角博美)
          targetCtx.strokeStyle = ani.cLight;
          targetCtx.moveTo(-torsoLen + 2, -2);
          targetCtx.quadraticCurveTo(-torsoLen - 6, -12, -torsoLen + 1, -11);
        } else {
          targetCtx.moveTo(-torsoLen, -1);
          targetCtx.quadraticCurveTo(-torsoLen - 9, -5 + cosStride * 4, -torsoLen - 14, -9 - stride * 3);
        }
        targetCtx.stroke();

        // 2. 遠端前後肢 (飛撲伸展動作，如參考圖右方猛虎與灰狼)
        const legExt = stride * 7;
        targetCtx.strokeStyle = ani.cDark;
        targetCtx.lineWidth = isHeavy ? 4.5 : 3.2;
        targetCtx.beginPath();
        // 後腿蹬伸
        targetCtx.moveTo(-torsoLen + 3, 2);
        targetCtx.lineTo(-torsoLen - 4 - legExt, 11);
        // 前腿前撲
        targetCtx.moveTo(torsoLen - 3, 2);
        targetCtx.lineTo(torsoLen + 6 + legExt, 10);
        targetCtx.stroke();

        // 3. 肌肉流線軀幹 (胸腔 + 腰腹收束)
        targetCtx.fillStyle = bodyGrad;
        targetCtx.beginPath();
        targetCtx.moveTo(-torsoLen, -torsoThick * 0.7);
        targetCtx.quadraticCurveTo(0, -torsoThick * 1.15, torsoLen, -torsoThick * 0.85);
        targetCtx.quadraticCurveTo(torsoLen + 4, 0, torsoLen - 1, torsoThick * 0.85);
        targetCtx.quadraticCurveTo(0, torsoThick * 0.55, -torsoLen, torsoThick * 0.75);
        targetCtx.closePath();
        targetCtx.fill();

        // 腹部亮白/淺色高光毛皮
        targetCtx.fillStyle = ani.cBelly;
        targetCtx.beginPath();
        targetCtx.ellipse(0, torsoThick * 0.55, torsoLen * 0.7, torsoThick * 0.32, 0, 0, Math.PI);
        targetCtx.fill();

        // 4. 物種專屬軀幹斑紋 (孟加拉虎黑紋 / 大熊貓黑白肩帶 / 米格魯三色塊 / 瞪羚黑側線)
        if (animalId === 'tiger') {
          targetCtx.strokeStyle = '#140b04';
          targetCtx.lineWidth = 1.8;
          for (let tx = -torsoLen + 3; tx <= torsoLen - 3; tx += 3.6) {
            targetCtx.beginPath();
            targetCtx.moveTo(tx, -torsoThick * 0.85);
            targetCtx.lineTo(tx - 1.5, torsoThick * 0.35);
            targetCtx.stroke();
          }
        } else if (animalId === 'panda') {
          targetCtx.fillStyle = '#09090b';
          targetCtx.fillRect(2, -torsoThick * 0.85, 7, torsoThick * 1.6);
        } else if (animalId === 'beagle') {
          targetCtx.fillStyle = '#1c1917';
          targetCtx.beginPath();
          targetCtx.ellipse(-2, -2, 7, 4.5, 0, 0, Math.PI * 2);
          targetCtx.fill();
        } else if (animalId === 'gazelle') {
          targetCtx.fillStyle = '#1c1917';
          targetCtx.fillRect(-torsoLen * 0.6, 1, torsoLen * 1.2, 2.5);
        }

        // 5. 近端前後肢（帶肌肉關節）
        targetCtx.strokeStyle = animalId === 'panda' ? '#09090b' : ani.cMid;
        targetCtx.lineWidth = isHeavy ? 5 : 3.6;
        targetCtx.beginPath();
        targetCtx.moveTo(-torsoLen + 4, 2);
        targetCtx.lineTo(-torsoLen - 2 + legExt, 12);
        targetCtx.moveTo(torsoLen - 2, 2);
        targetCtx.lineTo(torsoLen + 7 - legExt, 11);
        targetCtx.stroke();

        // 6. 頸部、獅鬃與頭顱
        if (animalId === 'lion') {
          // 雄獅濃密深棕鬃毛
          targetCtx.fillStyle = '#451a03';
          targetCtx.beginPath();
          targetCtx.ellipse(torsoLen - 1, -2, 9, 10, 0.2, 0, Math.PI * 2);
          targetCtx.fill();
        } else if (animalId === 'pomeranian') {
          // 博美犬超蓬鬆胸毛領
          targetCtx.fillStyle = ani.cLight;
          targetCtx.beginPath();
          targetCtx.arc(torsoLen - 2, -1, 8.5, 0, Math.PI * 2);
          targetCtx.fill();
        }

        // 頭顱與吻部
        targetCtx.fillStyle = bodyGrad;
        targetCtx.beginPath();
        targetCtx.ellipse(torsoLen + 4, -4, 6.5, 5.5, -0.1, 0, Math.PI * 2);
        targetCtx.fill();

        // 張口咆哮或吻部細節 (如參考圖張口露齒的猛虎、雄獅與灰狼)
        if (animalId === 'tiger' || animalId === 'lion' || animalId === 'wolf' || animalId === 'hippo') {
          // 上顎與張開的下顎
          targetCtx.fillStyle = ani.cLight;
          targetCtx.fillRect(torsoLen + 7, -7, 6.5, 4);
          targetCtx.fillStyle = '#450a0a';
          targetCtx.beginPath();
          targetCtx.moveTo(torsoLen + 7, -3);
          targetCtx.lineTo(torsoLen + 13, -2);
          targetCtx.lineTo(torsoLen + 11, 2.5);
          targetCtx.lineTo(torsoLen + 6, 1);
          targetCtx.closePath();
          targetCtx.fill();
          // 銳利白牙

          targetCtx.fillRect(torsoLen + 11.5, -3.5, 1.5, 2.5);
          targetCtx.fillRect(torsoLen + 10.5, 0, 1.5, 2.2);

          targetCtx.lineWidth = 2.2;
          targetCtx.beginPath();
          targetCtx.moveTo(torsoLen + 9, -1);
          targetCtx.lineTo(torsoLen + 14, -6);
          targetCtx.stroke();
        } else if (animalId === 'beagle') {

          targetCtx.fillRect(torsoLen + 8, -5, 4.5, 4);
          targetCtx.fillStyle = '#7c2d12';

          targetCtx.ellipse(torsoLen + 2, 0, 3.5, 7, 0.35, 0, Math.PI * 2);
          targetCtx.fill();
        } else if (animalId === 'gazelle') {

          targetCtx.lineWidth = 2;
          targetCtx.beginPath();

          targetCtx.beginPath();
          targetCtx.moveTo(torsoLen + 1, -8);

        targetCtx.beginPath();
        targetCtx.arc(torsoLen + 6.5, -5.5, 1.4, 0, Math.PI * 2);

        targetCtx.fillStyle = '#09090b';

        // 頂部冷白背光輪廓線 (Rim Light，致敬參考圖強烈的頂光立體感)
        targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.55)';

      }

      // ================== 建立兩小排 (2×6) 選角網格 + 選中放大預覽 ==================

      function renderSelectScreenPortraits(now) {

        // 1. 繪製兩小排 12 格角色圖示

      nameInput.addEventListener('change', () => {

      const hpUnits = [];
