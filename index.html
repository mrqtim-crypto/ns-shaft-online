      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2200);
      }

      // Seeded PRNG (Mulberry32)
      let rngState = 987654321;
      function seedRandom(seed) {
        rngState = seed >>> 0;
      }
      function nextRandom() {
        let t = (rngState += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      // 合成音效系統
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSound(type, weight = 1) {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'land') {
          osc.type = 'triangle';
          const baseFreq = Math.max(95, 270 - weight * 62);
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.28, now + 0.07);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'stomp') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(92, now);
          osc.frequency.linearRampToValueAtTime(40, now + 0.22);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
          if (navigator.vibrate) navigator.vibrate(45);
        } else if (type === 'spring') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.setValueAtTime(420, now + 0.05);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.15);
          gain.gain.setValueAtTime(0.13, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'bump') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(290, now + 0.08);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'hurt') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(165, now);
          osc.frequency.linearRampToValueAtTime(60, now + 0.24);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.24);
          if (navigator.vibrate) navigator.vibrate(80);
        } else if (type === 'shock') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.setValueAtTime(180, now + 0.04);
          osc.frequency.setValueAtTime(640, now + 0.08);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.14);
        } else if (type === 'supply') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.06);
          osc.frequency.setValueAtTime(783.99, now + 0.12);
          osc.frequency.setValueAtTime(1046.5, now + 0.18);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.start(now);
          osc.stop(now + 0.32);
        } else if (type === 'gameover') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(70, now + 0.45);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        }
      }

      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? '音' : '靜';
      });

      function resizeCanvas() {
        const rect = canvasWrap.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        viewScale = (rect.width || 380) / LOGIC_W;
        W = LOGIC_W;
        H = (rect.height || 540) / viewScale;
        canvas.width = (rect.width || 380) * dpr;
        canvas.height = (rect.height || 540) * dpr;
        ctx.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // 濃霧與塵埃粒子
      const mistClouds = Array.from({ length: 14 }, () => ({
        x: Math.random() * LOGIC_W,
        y: Math.random() * 600,
        r: 45 + Math.random() * 65,
        vy: -14 - Math.random() * 18,
        vx: (Math.random() - 0.5) * 12,
        alpha: 0.12 + Math.random() * 0.18
      }));

      let state = 'MENU';
      let hp = MAX_HP;
      let floor = 0;
      let scrollDistance = 0;
      let scrollSpeed = 112;
      let nextSpawnWorldY = 0;
      let shakeTime = 0;
      let wallOffset = 0;
      let conveyorAnim = 0;
      let currentSeed = Date.now();

      const player = {
        x: 180,
        y: 120,
        w: 30,
        h: 28,
        vx: 0,
        vy: 0,
        pushVx: 0,
        baseSpeed: 225,
        onPlatform: null,
        facing: 1,
        walkFrame: 0,
        runTime: 0,
        canDoubleJump: true,
        stunTimer: 0,
        adrenalineTimer: 0,
        invulnerable: 0
      };

      let platforms = [];
      let particles = [];
      let popups = [];
      let shockwaves = [];

      const peers = new Map();

      // ============== MQTT 多人連線系統 ==============
      const urlParams = new URLSearchParams(window.location.search);
      let currentRoom = (urlParams.get('room') || '8888').toUpperCase().slice(0, 8);
      roomInput.value = currentRoom;
      roomLabel.textContent = `區域: ${currentRoom}`;

      let mqttClient = null;
      let currentTopic = '';
      const BROKERS = [
        'wss://broker.emqx.io:8084/mqtt',
        'wss://broker.hivemq.com:8884/mqtt'
      ];
      let brokerIdx = 0;

      function getTopic(room) {
        return `tokyo-jungle-v3/room/${room}`;
      }

      function connectMultiplayer() {
        if (typeof mqtt === 'undefined') {
          connStatusText.textContent = '離線單機模式';
          return;
        }
        const url = BROKERS[brokerIdx % BROKERS.length];
        connStatusText.textContent = '正在連線東京伺服器...';
        netDot.classList.remove('online');

        if (mqttClient) {
          try { mqttClient.end(true); } catch (_) {}
        }

        mqttClient = mqtt.connect(url, {
          clientId: 'tkjg_' + myId + '_' + Math.floor(Math.random() * 999),
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 3000
        });

        mqttClient.on('connect', () => {
          netDot.classList.add('online');
          connStatusText.textContent = `已連線 (區域 ${currentRoom})`;
          subscribeRoom(currentRoom);
          broadcastHeartbeat();
        });

        mqttClient.on('error', () => { brokerIdx++; });
        mqttClient.on('offline', () => {
          netDot.classList.remove('online');
          connStatusText.textContent = '重新連線中...';
        });

        mqttClient.on('message', (topic, payload) => {
          if (topic !== currentTopic) return;
          try {
            const msg = JSON.parse(payload.toString());
            if (!msg || msg.id === myId) return;
            handleNetworkMessage(msg);
          } catch (_) {}
        });
      }

      function subscribeRoom(newRoom) {
        const cleanRoom = (newRoom || '8888').trim().toUpperCase().slice(0, 8) || '8888';
        if (mqttClient && currentTopic) {
          try { mqttClient.unsubscribe(currentTopic); } catch (_) {}
        }
        currentRoom = cleanRoom;
        roomInput.value = currentRoom;
        roomLabel.textContent = `區域: ${currentRoom}`;
        currentTopic = getTopic(currentRoom);
        peers.clear();
        renderRoster();

        if (mqttClient && mqttClient.connected) {
          mqttClient.subscribe(currentTopic, { qos: 0 });
          connStatusText.textContent = `已連線 (區域 ${currentRoom})`;
          broadcastHeartbeat();
        }
      }

      function publishMsg(data) {
        if (!mqttClient || !mqttClient.connected || !currentTopic) return;
        data.id = myId;
        try {
          mqttClient.publish(currentTopic, JSON.stringify(data), { qos: 0 });
        } catch (_) {}
      }

      function broadcastHeartbeat() {
        publishMsg({
          t: 'hb',
          name: myName,
          ani: myAnimalId,
          floor,
          hp,
          alive: state === 'PLAYING' && hp > 0
        });
      }

      function broadcastPos() {
        if (state !== 'PLAYING') return;
        publishMsg({
          t: 'pos',
          name: myName,
          ani: myAnimalId,
          x: Math.round(player.x),
          wy: Math.round(player.y + scrollDistance),
          vx: Math.round(player.vx),
          vy: Math.round(player.vy),
          f: player.facing,
          hp,
          fl: floor,
          alive: hp > 0
        });
      }

      function handleNetworkMessage(msg) {
        const now = performance.now();
        let p = peers.get(msg.id);
        if (!p) {
          p = {
            id: msg.id,
            name: msg.name || '生存者',
            animalId: ANIMAL_MAP[msg.ani] ? msg.ani : 'tiger',
            x: LOGIC_W / 2,
            worldY: 200,
            vx: 0,
            vy: 0,
            facing: 1,
            hp: MAX_HP,
            floor: 1,
            alive: false,
            lastSeen: now
          };
          peers.set(msg.id, p);
          renderRoster();
        }

        p.lastSeen = now;
        if (msg.name) p.name = msg.name;
        if (msg.ani && ANIMAL_MAP[msg.ani]) p.animalId = msg.ani;

        if (msg.t === 'hb') {
          p.floor = msg.floor || p.floor;
          p.hp = msg.hp !== undefined ? msg.hp : p.hp;
          p.alive = !!msg.alive;
          renderRoster();
        } else if (msg.t === 'pos') {
          p.x = msg.x;
          p.worldY = msg.wy;
          p.vx = msg.vx || 0;
          p.vy = msg.vy || 0;
          p.facing = msg.f || 1;
          p.hp = msg.hp;
          p.floor = msg.fl;
          p.alive = !!msg.alive;
        } else if (msg.t === 'start') {
          showToast(`${p.name} 發起了全房同步狩獵！`);
          startGame(msg.seed, false);
        } else if (msg.t === 'stomp') {
          const myWorldY = player.y + scrollDistance;
          if (Math.abs(myWorldY - msg.wy) < 30 && Math.abs(player.x - msg.x) < 110) {
            player.onPlatform = null;
            player.vy = -275;
            player.pushVx = (player.x >= msg.x ? 1 : -1) * 195;
            shakeTime = 0.25;
            playSound('stomp');
            addPopup(player.x + 15, player.y, '巨象震波！', '#b45309');
          }
        } else if (msg.t === 'emote') {
          addPopup(p.x + 15, p.worldY - scrollDistance - 16, msg.emoji, '#18181b');
        } else if (msg.t === 'dead') {
          p.alive = false;
          p.hp = 0;
          p.floor = msg.fl || p.floor;
          const ani = ANIMAL_MAP[p.animalId] || ANIMALS[0];
          addPopup(LOGIC_W / 2, 86, `${ani.name} (${p.name}) 於 B${p.floor} 倒下`, '#991b1b');
          renderRoster();
        }
      }

      setInterval(() => {
        const now = performance.now();
        let changed = false;
        for (const [id, p] of peers.entries()) {
          if (now - p.lastSeen > 8000) {
            peers.delete(id);
            changed = true;
          }
        }
        if (changed) renderRoster();
        broadcastHeartbeat();
        renderMpStrip();
      }, 1500);

      setInterval(() => {
        if (state === 'PLAYING') broadcastPos();
      }, 60);

      function renderRoster() {
        playerCountLabel.textContent = `同場 ${1 + peers.size} 獸`;
        rosterList.innerHTML = '';
        const myAni = ANIMAL_MAP[myAnimalId] || ANIMALS[0];
        const meTag = document.createElement('div');
        meTag.className = 'roster-tag';
        meTag.innerHTML = `<span style="color:#fbbf24;">[${myAni.name}]</span><span>${escapeHtml(myName)}</span>`;
        rosterList.appendChild(meTag);

        for (const p of peers.values()) {
          const ani = ANIMAL_MAP[p.animalId] || ANIMALS[0];
          const tag = document.createElement('div');
          tag.className = 'roster-tag';
          tag.innerHTML = `<span style="color:#a1a1aa;">[${ani.name}]</span><span>${escapeHtml(p.name)}</span>`;
          rosterList.appendChild(tag);
        }
        renderMpStrip();
      }

      function renderMpStrip() {
        const myAni = ANIMAL_MAP[myAnimalId] || ANIMALS[0];
        const list = [
          { name: myName, aniName: myAni.name, floor, alive: state === 'PLAYING' && hp > 0 },
          ...Array.from(peers.values()).map(p => ({
            name: p.name,
            aniName: (ANIMAL_MAP[p.animalId] || ANIMALS[0]).name,
            floor: p.floor,
            alive: p.alive
          }))
        ];
        list.sort((a, b) => b.floor - a.floor);

        mpStrip.innerHTML = list.map(u => {
          const deadClass = (!u.alive && u.floor > 0 && state === 'PLAYING') ? ' dead' : '';
          return `<div class="mp-chip${deadClass}">
            <span style="color:#fbbf24;">${u.aniName.slice(0, 2)}</span>
            <span>${escapeHtml(u.name.slice(0, 4))}</span>
            <span style="color:#f59e0b;">B${u.floor || 0}</span>
          </div>`;
        }).join('');
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      joinRoomBtn.addEventListener('click', () => {
        myName = nameInput.value.trim() || myName;
        localStorage.setItem(NAME_KEY, myName);
        subscribeRoom(roomInput.value);
        showToast(`已切換至區域 ${currentRoom}`);
      });

      shareBtn.addEventListener('click', async () => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(currentRoom)}`;
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'TOKYO JUNGLE：地下生存多人連線',
              text: `快選一隻猛獸加入區域【${currentRoom}】，一起來東京叢林下樓梯生存戰！`,
              url: shareUrl
            });
            return;
          } catch (_) {}
        }
        try {
          await navigator.clipboard.writeText(shareUrl);
          showToast(`已複製區域【${currentRoom}】邀請連結！`);
        } catch (_) {
          prompt('請複製連結分享給好友：', shareUrl);
        }
      });

      document.querySelectorAll('.emote-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const emoji = btn.getAttribute('data-emote');
          addPopup(player.x + player.w / 2, player.y - 12, emoji, '#78350f');
          publishMsg({ t: 'emote', emoji });
        });
      });

      // ============== 操控輸入 ==============
      const input = { left: false, right: false };

      function updateBtnVisuals() {
        btnLeft.classList.toggle('pressed', input.left);
        btnRight.classList.toggle('pressed', input.right);
      }

      const activeTouches = new Map();

      function recomputeTouchInput() {
        let l = false;
        let r = false;
        for (const dir of activeTouches.values()) {
          if (dir === 'left') l = true;
          if (dir === 'right') r = true;
        }
        input.left = l;
        input.right = r;
        updateBtnVisuals();
      }

      function bindTouchArea(el, fixedDir = null) {
        el.addEventListener('touchstart', (e) => {
          if (state !== 'PLAYING') return;
          if (e.target.closest('.emote-btn')) return;
          e.preventDefault();
          initAudio();
          const rect = canvasWrap.getBoundingClientRect();
          for (const t of e.changedTouches) {
            const dir = fixedDir || (t.clientX < rect.left + rect.width / 2 ? 'left' : 'right');
            activeTouches.set(t.identifier, dir);
          }
          recomputeTouchInput();
        }, { passive: false });

        el.addEventListener('touchmove', (e) => {
          if (state !== 'PLAYING' || fixedDir) return;
          e.preventDefault();
          const rect = canvasWrap.getBoundingClientRect();
          for (const t of e.changedTouches) {
            const dir = t.clientX < rect.left + rect.width / 2 ? 'left' : 'right';
            activeTouches.set(t.identifier, dir);
          }
          recomputeTouchInput();
        }, { passive: false });

        const endHandler = (e) => {
          for (const t of e.changedTouches) {
            activeTouches.delete(t.identifier);
          }
          recomputeTouchInput();
        };
        el.addEventListener('touchend', endHandler);
        el.addEventListener('touchcancel', endHandler);
      }

      bindTouchArea(btnLeft, 'left');
      bindTouchArea(btnRight, 'right');
      bindTouchArea(canvas);

      function bindMouseBtn(btn, dir) {
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault();
          initAudio();
          input[dir] = true;
          updateBtnVisuals();
        });
        window.addEventListener('mouseup', () => {
          input.left = false;
          input.right = false;
          updateBtnVisuals();
        });
      }
      bindMouseBtn(btnLeft, 'left');
      bindMouseBtn(btnRight, 'right');

      window.addEventListener('keydown', (e) => {
        if (document.activeElement === nameInput || document.activeElement === roomInput) return;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          input.left = true;
          updateBtnVisuals();
        } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          input.right = true;
          updateBtnVisuals();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          input.left = false;
          updateBtnVisuals();
        } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          input.right = false;
          updateBtnVisuals();
        }
      });

      function formatFloor(n) {
        return 'B' + String(n).padStart(4, '0');
      }

      function updateHUD() {
        hpTextEl.textContent = `${hp}/${MAX_HP}`;
        hpUnits.forEach((unit, idx) => {
          unit.className = 'hp-unit';
          if (idx < hp) {
            unit.classList.add(hp <= 4 ? 'danger' : 'active');
          }
        });
        floorTextEl.textContent = formatFloor(floor);
        if (floor < 30) {
          zoneLabel.textContent = '澀谷白霧豎井';
        } else if (floor < 60) {
          zoneLabel.textContent = '廢棄地下鐵道';
        } else {
          zoneLabel.textContent = '地底深淵斷層';
        }
      }

      function addPopup(x, y, text, color) {
        popups.push({ x, y, text, color, life: 0.9, maxLife: 0.9 });
      }

      function spawnParticles(x, y, color, count = 8) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = 40 + Math.random() * 115;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - 35,
            size: 2 + Math.random() * 3.5,
            color,
            life: 0.35 + Math.random() * 0.25
          });
        }
      }

      // ============== 10 種《東京叢林》廢墟階梯生成器 ==============
      let spawnedCount = 0;

      function pickPlatformType(approxFloor, indexCount) {
        if (indexCount > 0 && indexCount % 15 === 0) return 'supply';

        const barbedWeight = Math.min(20, 8 + approxFloor * 0.16);
        const woodWeight = 13;
        const seesawWeight = 14;
        const taxiWeight = 11;
        const mossWeight = 11;
        const conveyorWeight = 12;
        const electricWeight = approxFloor >= 12 ? 9 : 0;
        const slantedWeight = approxFloor >= 18 ? 9 : 0;
        const steelWeight = Math.max(22, 100 - (barbedWeight + woodWeight + seesawWeight + taxiWeight + mossWeight + conveyorWeight + electricWeight + slantedWeight));

        const total = steelWeight + barbedWeight + woodWeight + seesawWeight + taxiWeight + mossWeight + conveyorWeight + electricWeight + slantedWeight;
        let r = nextRandom() * total;

        if ((r -= steelWeight) < 0) return 'steel';
        if ((r -= seesawWeight) < 0) return 'seesaw';
        if ((r -= woodWeight) < 0) return 'wood';
        if ((r -= taxiWeight) < 0) return 'taxi';
        if ((r -= mossWeight) < 0) return 'moss';
        if ((r -= conveyorWeight) < 0) return nextRandom() < 0.5 ? 'conveyor_l' : 'conveyor_r';
        if ((r -= barbedWeight) < 0) return 'barbed';
        if ((r -= electricWeight) < 0) return 'electric';
        return nextRandom() < 0.5 ? 'slanted_l' : 'slanted_r';
      }

      function createPlatformAtWorldY(worldY, forceSteel = false) {
        const margin = 18;
        const pw = 96;
        const x = margin + nextRandom() * (LOGIC_W - margin * 2 - pw);
        const approxFloor = Math.max(1, Math.floor(worldY / 260));
        spawnedCount++;
        const type = forceSteel ? 'steel' : pickPlatformType(approxFloor, spawnedCount);

        let baseTilt = 0;
        if (type === 'slanted_l') baseTilt = -0.18;
        if (type === 'slanted_r') baseTilt = 0.18;

        return {
          x,
          worldY,
          y: worldY - scrollDistance,
          w: pw,
          h: 14,
          type,
          touched: false,
          broken: false,
          breakTimer: 0,
          overloadTimer: 0,
          totalLoad: 0,
          springCompress: 0,
          sagY: 0,
          sagVy: 0,
          tilt: baseTilt,
          baseTilt,
          crateIntact: type === 'supply'
        };
      }

      function startGame(seed = Date.now(), broadcastToRoom = false) {
        initAudio();
        resizeCanvas();
        myName = nameInput.value.trim() || myName;
        localStorage.setItem(NAME_KEY, myName);
        if (roomInput.value.trim().toUpperCase() !== currentRoom) {
          subscribeRoom(roomInput.value);
        }

        currentSeed = seed >>> 0;
        seedRandom(currentSeed);
        spawnedCount = 0;

        if (broadcastToRoom) {
          publishMsg({
            t: 'start',
            seed: currentSeed
          });
        }

        hp = MAX_HP;
        floor = 1;
        scrollDistance = 0;
        scrollSpeed = 112;
        shakeTime = 0;
        platforms = [];
        particles = [];
        popups = [];
        shockwaves = [];
        activeTouches.clear();
        input.left = false;
        input.right = false;
        updateBtnVisuals();

        const startPlat = createPlatformAtWorldY(210, true);
        startPlat.x = LOGIC_W / 2 - startPlat.w / 2;
        startPlat.touched = true;
        platforms.push(startPlat);

        nextSpawnWorldY = 210 + 76;
        while (nextSpawnWorldY < H + 120) {
          platforms.push(createPlatformAtWorldY(nextSpawnWorldY, nextSpawnWorldY < 370));
          nextSpawnWorldY += 76;
        }

        player.x = startPlat.x + startPlat.w / 2 - player.w / 2;
        player.y = startPlat.y - player.h;
        player.vx = 0;
        player.vy = 0;
        player.pushVx = 0;
        player.onPlatform = startPlat;
        player.runTime = 0;
        player.canDoubleJump = true;
        player.stunTimer = 0;
        player.adrenalineTimer = 0;
        player.invulnerable = 0;

        updateAnimalSelectionUI();
        updateHUD();
        state = 'PLAYING';
        overlay.classList.add('hidden');
        broadcastHeartbeat();
        broadcastPos();
      }

      pauseBtn.addEventListener('click', () => {
        overlay.classList.toggle('hidden');
      });

      startMpBtn.addEventListener('click', () => startGame(Date.now(), true));
      startSoloBtn.addEventListener('click', () => startGame(Date.now(), false));

      function hurtPlayer(amount, x, y, label = '') {
        if (player.invulnerable > 0) return;
        hp = Math.max(0, hp - amount);
        player.invulnerable = 0.55;
        shakeTime = 0.25;
        playSound('hurt');
        addPopup(x, y, `${label}-${amount} HP`, '#991b1b');
        spawnParticles(x, y, '#991b1b', 14);
        updateHUD();
        if (hp <= 0) {
          triggerGameOver('在東京地下叢林力竭倒下！');
        }
      }

      function healPlayer(amount, x, y, customLabel = '') {
        if (hp < MAX_HP) {
          hp = Math.min(MAX_HP, hp + amount);
          addPopup(x, y, customLabel || `+${amount} HP`, '#15803d');
          updateHUD();
        } else if (customLabel) {
          addPopup(x, y, customLabel, '#b45309');
        }
      }

      function triggerGameOver(reason) {
        state = 'GAMEOVER';
        playSound('gameover');
        publishMsg({ t: 'dead', fl: floor });
        broadcastHeartbeat();

        if (floor > bestFloor) {
          bestFloor = floor;
          localStorage.setItem(STORAGE_KEY, String(bestFloor));
          bestScoreText.textContent = `最高生存: B${String(bestFloor).padStart(4, '0')}`;
        }

        const ani = ANIMAL_MAP[myAnimalId] || ANIMALS[0];
        overlayBadge.textContent = `RECORD: B${floor}`;
        overlayTitle.textContent = `${ani.name} 生存終止`;
        overlay.classList.remove('hidden');
        renderMpStrip();
      }

      function handleLanding(plat, impactVy) {
        const ani = ANIMAL_MAP[myAnimalId] || ANIMALS[0];
        player.onPlatform = plat;
        player.y = plat.y + plat.sagY - player.h;
        player.vy = 0;
        player.canDoubleJump = true;

        const cx = player.x + player.w / 2;
        const cy = player.y;

        plat.sagVy = Math.min(180, (45 + impactVy * 0.14) * ani.weight);

        // 巨象 / 河馬 落地重踏震波
        if (ani.weight >= 2.0 && impactVy > 260) {
          shakeTime = 0.2;
          playSound('stomp');
          shockwaves.push({ x: cx, y: plat.y, r: 8, maxR: 98, life: 0.35 });
          publishMsg({ t: 'stomp', x: Math.round(cx), wy: Math.round(plat.worldY) });
          if (ani.id === 'elephant') {
            addPopup(cx, cy - 14, '末日重踏！', '#18181b');
          }
        }

        if (plat.type === 'supply' && plat.crateIntact) {
          plat.crateIntact = false;
          plat.touched = true;
          healPlayer(4, cx, cy - 10, '獵物補給 +4 HP!');
          player.adrenalineTimer = 3.5;
          playSound('supply');
          spawnParticles(cx, plat.y, '#d97706', 16);
          return;
        }

        if (plat.type === 'barbed') {
          if (!plat.touched) {
            plat.touched = true;
            let dmg = 5;
            if (ani.id === 'lion') dmg = 3; // 雄獅鬃毛減傷
            else if (ani.weight >= 2.1) dmg = 4;
            hurtPlayer(dmg, cx, cy, '鐵絲網 ');
          }
        } else if (plat.type === 'taxi') {
          if (!plat.touched) {
            plat.touched = true;
            healPlayer(1, cx, cy, '+1 HP');
          }
          plat.springCompress = 1;
          player.onPlatform = null;
          const weightFactor = Math.max(0.72, Math.min(1.16, 1.06 / Math.sqrt(ani.weight)));
          player.vy = -410 * weightFactor;
          playSound('spring');
          spawnParticles(cx, plat.y, '#b45309', 10);
        } else {
          if (!plat.touched) {
            plat.touched = true;
            let bonus = 1;
            let label = '+1 HP';
            if (ani.id === 'beagle' && Math.random() < 0.3) {
              bonus = 2;
              label = '嗅覺本能 +2 HP';
            }
            healPlayer(bonus, cx, cy, label);
            playSound('land', ani.weight);
            spawnParticles(cx, plat.y, '#52525b', 5);
          }
        }
      }

      function update(dt) {
        if (previewLeapImpulse > 0) {
          previewLeapImpulse = Math.max(0, previewLeapImpulse - dt * 2.2);
        }

        for (const mc of mistClouds) {
          mc.y += mc.vy * dt;
          mc.x += mc.vx * dt;
          if (mc.y < -60) { mc.y = H + 60; mc.x = Math.random() * LOGIC_W; }
          if (mc.x < -60) mc.x = LOGIC_W + 60;
          if (mc.x > LOGIC_W + 60) mc.x = -60;
        }

        if (state !== 'PLAYING') return;

        const ani = ANIMAL_MAP[myAnimalId] || ANIMALS[0];

        scrollSpeed = Math.min(242, 112 + floor * 1.32);
        const dy = scrollSpeed * dt;

        scrollDistance += dy;
        wallOffset = (wallOffset + dy) % 36;
        conveyorAnim = (conveyorAnim + dt * 45) % 16;

        const newFloor = 1 + Math.floor(scrollDistance / 260);
        if (newFloor > floor) {
          floor = newFloor;
          if (ani.id === 'panda' && floor % 12 === 0) {
            healPlayer(2, player.x + 15, player.y, '竹葉回復 +2 HP');
          } else if (floor % 10 === 0) {
            addPopup(LOGIC_W / 2, 65, `深入地下 ${floor} 階`, '#18181b');
          }
          updateHUD();
        }

        if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);
        if (player.invulnerable > 0) player.invulnerable = Math.max(0, player.invulnerable - dt);
        if (player.stunTimer > 0) player.stunTimer = Math.max(0, player.stunTimer - dt);
        if (player.adrenalineTimer > 0) player.adrenalineTimer = Math.max(0, player.adrenalineTimer - dt);

        while (nextSpawnWorldY < scrollDistance + H + 80) {
          platforms.push(createPlatformAtWorldY(nextSpawnWorldY, false));
          nextSpawnWorldY += 76;
        }

        const electricCycle = (Date.now() % 1800) < 480;

        for (let i = platforms.length - 1; i >= 0; i--) {
          const p = platforms[i];

          p.sagVy += (-p.sagY * 160 - p.sagVy * 12) * dt;
          p.sagY = Math.max(-4, Math.min(14, p.sagY + p.sagVy * dt));

          if (p.springCompress > 0) {
            p.springCompress = Math.max(0, p.springCompress - dt * 5);
          }

          let load = 0;
          let torque = 0;
          const pCenter = p.x + p.w / 2;

          if (player.onPlatform === p) {
            load += ani.weight;
            const offset = ((player.x + player.w / 2) - pCenter) / (p.w / 2);
            torque += offset * ani.weight;
          }

          for (const rp of peers.values()) {
            if (!rp.alive) continue;
            const rpAni = ANIMAL_MAP[rp.animalId] || ANIMALS[0];
            const onThisPlat = Math.abs((rp.worldY + 28) - p.worldY) < 18 &&
                               (rp.x + 24 > p.x) && (rp.x + 4 < p.x + p.w);
            if (onThisPlat) {
              load += rpAni.weight;
              const offset = ((rp.x + 15) - pCenter) / (p.w / 2);
              torque += offset * rpAni.weight;
            }
          }

          p.totalLoad = load;

          const tiltSensitivity = p.type === 'seesaw' ? 0.24 : (p.type === 'slanted_l' || p.type === 'slanted_r' ? 0.05 : 0.085);
          const targetTilt = Math.max(-0.42, Math.min(0.42, p.baseTilt + torque * tiltSensitivity));
          p.tilt += (targetTilt - p.tilt) * Math.min(1, dt * 10);

          // 腐朽木板：渡鴉不觸發斷裂，博美減緩斷裂
          if (p.type === 'wood' && p.touched && !p.broken && ani.id !== 'crow') {
            const weightRate = ani.id === 'pomeranian' ? 0.42 : Math.max(0.45, Math.max(load, ani.weight));
            p.breakTimer += dt * weightRate;
            if (p.breakTimer >= 0.42) {
              p.broken = true;
              spawnParticles(p.x + p.w / 2, p.y, '#78350f', 12);
              if (player.onPlatform === p) player.onPlatform = null;
            }
          }

          if (p.type === 'steel' && load > 2.75 && !p.broken) {
            p.overloadTimer += dt;
            if (p.overloadTimer >= 1.0) {
              p.broken = true;
              shakeTime = 0.2;
              playSound('stomp');
              spawnParticles(p.x + p.w / 2, p.y, '#9a3412', 16);
              addPopup(p.x + p.w / 2, p.y, '超載崩塌！', '#9a3412');
              if (player.onPlatform === p) player.onPlatform = null;
            }
          } else {
            p.overloadTimer = Math.max(0, p.overloadTimer - dt);
          }

          if (p.broken) {
            p.worldY += 310 * dt;
          }
          p.y = p.worldY - scrollDistance;

          if (p.y < -50) {
            platforms.splice(i, 1);
          }
        }

        // 水平移動與動物專長
        let moveDir = 0;
        if (player.stunTimer <= 0) {
          if (input.left) moveDir -= 1;
          if (input.right) moveDir += 1;
        }

        if (moveDir !== 0 && moveDir === player.facing) {
          player.runTime += dt;
        } else {
          player.runTime = 0;
        }

        let speedMultiplier = ani.speedMul;
        let boarCharging = false;
        if (ani.id === 'boar' && player.runTime > 0.32) {
          speedMultiplier *= 1.32;
          boarCharging = true;
          if (Math.random() < 0.35) {
            spawnParticles(player.x + 15, player.y + 24, '#78350f', 1);
          }
        }
        if (player.adrenalineTimer > 0) {
          speedMultiplier *= 1.25;
        }

        const targetVx = moveDir * player.baseSpeed * speedMultiplier;
        const onMoss = player.onPlatform && player.onPlatform.type === 'moss' && ani.id !== 'hippo';
        const accel = onMoss ? 4.2 : 18.0;
        player.vx += (targetVx - player.vx) * Math.min(1, accel * dt);

        player.pushVx *= Math.pow(0.005 / Math.sqrt(ani.weight), dt);

        if (moveDir !== 0) {
          player.facing = moveDir;
          player.walkFrame += dt * 15 * speedMultiplier;
        } else {
          player.walkFrame += dt * 3;
        }

        let totalVx = player.vx + player.pushVx;

        if (player.onPlatform) {
          const p = player.onPlatform;
          const convFactor = ani.id === 'hippo' ? 0.2 : (1 / Math.pow(ani.weight, 0.35));
          if (p.type === 'conveyor_l') totalVx -= 125 * convFactor;
          if (p.type === 'conveyor_r') totalVx += 125 * convFactor;

          if (ani.id !== 'hippo' && ani.id !== 'wolf') {
            const slideMul = onMoss ? 410 : 275;
            totalVx += Math.sin(p.tilt) * slideMul;
          }

          if (p.type === 'electric' && electricCycle && player.invulnerable <= 0) {
            hurtPlayer(3, player.x + 15, player.y, '觸電 ');
            playSound('shock');
            if (ani.id !== 'hippo') {
              player.stunTimer = 0.42;
            }
          }
        }

        // 多人猛獸碰撞與孟加拉虎踩躍 / 熊貓太極反彈
        const myWorldY = player.y + scrollDistance;
        for (const rp of peers.values()) {
          if (!rp.alive) continue;
          const rpAni = ANIMAL_MAP[rp.animalId] || ANIMALS[0];
          const dx = (player.x + player.w / 2) - (rp.x + 15);
          const dyWorld = myWorldY - rp.worldY;

          if (Math.abs(dx) < 25 && Math.abs(dyWorld) < 26) {
            if (ani.id === 'tiger' && dyWorld < -8 && player.vy > 0) {
              player.onPlatform = null;
              player.vy = -315;
              playSound('spring');
              addPopup(player.x + 15, player.y, '猛虎踩躍！', '#b45309');
              continue;
            }

            const pushSign = dx >= 0 ? 1 : -1;
            let incomingForce = 215 * (rpAni.pushMul / Math.pow(ani.weight, 0.65));
            if (rpAni.id === 'panda') {
              incomingForce *= 1.65;
              addPopup(player.x + 15, player.y, '太極彈飛！', '#18181b');
            }
            if (boarCharging) incomingForce *= 0.4;
            player.pushVx = pushSign * incomingForce;
            playSound('bump');
            spawnParticles(player.x + 15, player.y + 15, '#78350f', 5);
          }
        }

        player.x += totalVx * dt;

        // 左右牆壁邊界（瞪羚貼牆二段跳）
        const wallWidth = 13;
        if (player.x <= wallWidth) {
          player.x = wallWidth;
          if (ani.id === 'gazelle' && !player.onPlatform && player.vy > 40 && player.canDoubleJump) {
            player.canDoubleJump = false;
            player.vy = -295;
            player.pushVx = 165;
            playSound('spring');
            addPopup(player.x + 15, player.y, '羚羊蹬牆跳！', '#18181b');
          }
        }
        if (player.x + player.w >= LOGIC_W - wallWidth) {
          player.x = LOGIC_W - wallWidth - player.w;
          if (ani.id === 'gazelle' && !player.onPlatform && player.vy > 40 && player.canDoubleJump) {
            player.canDoubleJump = false;
            player.vy = -295;
            player.pushVx = -165;
            playSound('spring');
            addPopup(player.x + 15, player.y, '羚羊蹬牆跳！', '#18181b');
          }
        }

        const prevFootY = player.y + player.h;

        if (player.onPlatform) {
          const p = player.onPlatform;
          const relX = (player.x + player.w / 2) - (p.x + p.w / 2);
          const tiltOffsetY = Math.sin(p.tilt) * relX;
          player.y = p.y + p.sagY + tiltOffsetY - player.h;

          const overlap = (player.x + player.w - 4 > p.x) && (player.x + 4 < p.x + p.w);
          if (!overlap || p.broken) {
            player.onPlatform = null;
            if (ani.id === 'tiger' && moveDir !== 0 && !p.broken) {
              player.pushVx = moveDir * 145;
              player.vy = -125;
            } else {
              player.vy = 0;
            }
          }
        }

        if (!player.onPlatform) {
          const isGlider = ani.id === 'crane' || ani.id === 'crow';
          const gravity = (isGlider && player.vy > 0) ? 560 : 980;
          const maxFall = isGlider ? 330 : 580;
          player.vy = Math.min(maxFall, player.vy + gravity * dt);

          if (ani.id === 'gazelle' && player.canDoubleJump && player.vy > 210 && (input.left || input.right)) {
            player.canDoubleJump = false;
            player.vy = -270;
            playSound('spring');
            spawnParticles(player.x + 15, player.y + 26, '#ffffff', 6);
            addPopup(player.x + 15, player.y, '羚羊二段躍！', '#18181b');
          }

          player.y += (player.vy * dt) - dy;
          const newFootY = player.y + player.h;

          if (player.vy >= 0) {
            for (const p of platforms) {
              if (p.broken) continue;
              const horizOverlap = (player.x + player.w - 4 > p.x) && (player.x + 4 < p.x + p.w);
              const relX = (player.x + player.w / 2) - (p.x + p.w / 2);
              const surfY = p.y + p.sagY + Math.sin(p.tilt) * relX;
              if (horizOverlap && prevFootY <= surfY + 14 && newFootY >= surfY - 2) {
                handleLanding(p, player.vy);
                break;
              }
            }
          }
        }

        const ceilingSpikeH = 22;
        if (player.y <= ceilingSpikeH) {
          const dmg = (ani.id === 'lion' || ani.weight >= 2.1) ? 3 : 5;
          hurtPlayer(dmg, player.x + player.w / 2, ceilingSpikeH + 10, '頂部鋼筋 ');
          player.onPlatform = null;
          player.y = ceilingSpikeH + 5;
          player.vy = 190;
        }

        if (player.y > H + 35) {
          hp = 0;
          updateHUD();
          triggerGameOver('墜入東京地下深淵！');
        }

        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.r += (sw.maxR - sw.r) * 10 * dt;
          sw.life -= dt;
          if (sw.life <= 0) shockwaves.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.vy += 300 * dt;
          pt.life -= dt;
          if (pt.life <= 0) particles.splice(i, 1);
        }

        for (let i = popups.length - 1; i >= 0; i--) {
          const pp = popups[i];
          pp.y -= 36 * dt;
          pp.life -= dt;
          if (pp.life <= 0) popups.splice(i, 1);
        }
      }

      // ================== 致敬參考圖的「蒼白迷霧 × 高反差廢墟」背景渲染 ==================
      function drawAtmosphericBackground() {
        // 參考圖標誌性的明亮冷白迷霧漸層背景，襯托深色寫實猛獸剪影與毛皮肌理
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        if (floor < 30) {
          grad.addColorStop(0, '#eef2f6');
          grad.addColorStop(0.55, '#d5dde7');
          grad.addColorStop(1, '#b8c4d4');
        } else if (floor < 60) {
          grad.addColorStop(0, '#dbe4ee');
          grad.addColorStop(0.55, '#b8c7d9');
          grad.addColorStop(1, '#94a8be');
        } else {
          grad.addColorStop(0, '#e5dcd8');
          grad.addColorStop(0.55, '#cbbab2');
          grad.addColorStop(1, '#a68d82');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, LOGIC_W, H);

        // 遠景模糊廢墟鋼骨橋墩剪影
        const bgScroll = (scrollDistance * 0.3) % 190;
        for (let y = -bgScroll; y < H + 190; y += 190) {
          ctx.fillStyle = 'rgba(71, 85, 105, 0.12)';
          ctx.fillRect(14, y, LOGIC_W - 28, 16);
          ctx.beginPath();
          ctx.moveTo(14, y + 16);
          ctx.lineTo(65, y + 75);
          ctx.lineTo(14, y + 75);
          ctx.moveTo(LOGIC_W - 14, y + 16);
          ctx.lineTo(LOGIC_W - 65, y + 75);
          ctx.lineTo(LOGIC_W - 14, y + 75);
          ctx.fill();
        }

        // 經典《TOKYO JUNGLE》襯線體巨型樓層浮水印 (如參考圖左下角的黑色巨型數字 "1")
        ctx.save();
        ctx.fillStyle = 'rgba(15, 23, 42, 0.08)';
        ctx.font = '900 105px Georgia, "Times New Roman", serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(floor), LOGIC_W / 2, H * 0.48);
        ctx.restore();

        // 流動白霧層
        for (const mc of mistClouds) {
          const mGrad = ctx.createRadialGradient(mc.x, mc.y, 4, mc.x, mc.y, mc.r);
          mGrad.addColorStop(0, `rgba(255, 255, 255, ${mc.alpha})`);
          mGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = mGrad;
          ctx.beginPath();
          ctx.arc(mc.x, mc.y, mc.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 兩側深色斑駁水泥岩壁與枯藤
        const wallW = 13;
        ctx.fillStyle = '#27272a';
        ctx.fillRect(0, 0, wallW, H);
        ctx.fillRect(LOGIC_W - wallW, 0, wallW, H);

        for (let y = -wallOffset; y < H; y += 20) {
          ctx.strokeStyle = '#18181b';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(1, y, wallW - 2, 20);
          ctx.strokeRect(LOGIC_W - wallW + 1, y, wallW - 2, 20);
        }
      }

      function drawCeilingSpikes() {
        ctx.fillStyle = '#18181b';
        ctx.fillRect(0, 0, LOGIC_W, 7);

        const spikeW = 18;
        const spikeH = 22;
        for (let x = 12; x < LOGIC_W - 12; x += spikeW) {
          const grad = ctx.createLinearGradient(x, 6, x + spikeW, spikeH);
          grad.addColorStop(0, '#27272a');
          grad.addColorStop(0.6, '#52525b');
          grad.addColorStop(1, '#7f1d1d');
          ctx.fillStyle = grad;

          ctx.beginPath();
          ctx.moveTo(x, 6);
          ctx.lineTo(x + spikeW / 2, spikeH);
          ctx.lineTo(x + spikeW, 6);
          ctx.closePath();
          ctx.fill();
        }
      }

      function drawPlatforms() {
        const electricCycle = (Date.now() % 1800) < 480;

        for (const p of platforms) {
          if (p.y < -35 || p.y > H + 35) continue;
          ctx.save();

          const cx = p.x + p.w / 2;
          const cy = p.y + p.sagY + p.h / 2;

          if (p.type === 'seesaw') {
            ctx.strokeStyle = '#3f3f46';
            ctx.lineWidth = 2;
            ctx.setLineDash([3, 2]);
            ctx.beginPath();
            ctx.moveTo(cx, cy - 26);
            ctx.lineTo(cx, cy);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          ctx.translate(cx, cy);
          ctx.rotate(p.tilt);

          const hw = p.w / 2;
          const hh = p.h / 2;

          // 階梯底部投影
          ctx.fillStyle = 'rgba(15, 23, 42, 0.18)';
          ctx.fillRect(-hw + 2, hh, p.w, 4);

          if (p.type === 'steel') {
            const overloadShake = p.overloadTimer > 0 ? (Math.random() - 0.5) * 4 : 0;
            ctx.fillStyle = p.overloadTimer > 0 ? '#7c2d12' : '#27272a';
            ctx.fillRect(-hw + overloadShake, -hh, p.w, p.h);
            ctx.fillStyle = p.overloadTimer > 0 ? '#ea580c' : '#52525b';
            ctx.fillRect(-hw + overloadShake, -hh, p.w, 3);
            ctx.fillRect(-hw + overloadShake, hh - 3, p.w, 3);
            ctx.fillStyle = '#78350f';
            for (let rx = -hw + 8; rx < hw - 6; rx += 16) {
              ctx.fillRect(rx + overloadShake, -2, 6, 4);
            }
          } else if (p.type === 'seesaw') {
            ctx.fillStyle = '#18181b';
            ctx.fillRect(-hw, -hh, p.w, p.h);
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 2;
            ctx.strokeRect(-hw, -hh, p.w, p.h);
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.type === 'wood') {
            const shakeX = p.touched && !p.broken ? (Math.random() - 0.5) * 4 : 0;
            ctx.fillStyle = '#5c2808';
            ctx.fillRect(-hw + shakeX, -hh, p.w, p.h);
            ctx.fillStyle = '#92400e';
            ctx.fillRect(-hw + shakeX, -hh, p.w, 3);
            ctx.strokeStyle = '#1c0a00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-12 + shakeX, -hh);
            ctx.lineTo(-4 + shakeX, hh);
            ctx.moveTo(15 + shakeX, -hh);
            ctx.lineTo(8 + shakeX, hh);
            ctx.stroke();
          } else if (p.type === 'taxi') {
            const comp = p.springCompress * 5;
            ctx.fillStyle = '#14532d';
            ctx.beginPath();
            ctx.roundRect(-hw, -hh + comp, p.w, p.h, 5);
            ctx.fill();
            ctx.fillStyle = '#d97706';
            ctx.fillRect(-hw + 4, -2 + comp, p.w - 8, 4);
            ctx.fillStyle = '#fef08a';
            ctx.fillRect(-10, -hh - 5 + comp, 20, 5);
          } else if (p.type === 'moss') {
            ctx.fillStyle = '#3f3f46';
            ctx.fillRect(-hw, -hh, p.w, p.h);
            ctx.fillStyle = '#3f6212';
            ctx.fillRect(-hw, -hh, p.w, 5);
          } else if (p.type === 'conveyor_l' || p.type === 'conveyor_r') {
            ctx.fillStyle = '#18181b';
            ctx.beginPath();
            ctx.roundRect(-hw, -hh, p.w, p.h, 6);
            ctx.fill();
            ctx.strokeStyle = '#b45309';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;
            const dir = p.type === 'conveyor_r' ? 1 : -1;
            const shift = dir * (conveyorAnim - 8);
            for (let ax = -hw + 12; ax < hw - 10; ax += 16) {
              const drawX = ax + shift * 0.5;
              ctx.beginPath();
              ctx.moveTo(drawX - 3 * dir, -4);
              ctx.lineTo(drawX + 3 * dir, 0);
              ctx.lineTo(drawX - 3 * dir, 4);
              ctx.stroke();
            }
          } else if (p.type === 'barbed') {
            ctx.fillStyle = '#271206';
            ctx.fillRect(-hw, -hh + 4, p.w, p.h - 4);
            ctx.strokeStyle = '#3f3f46';
            ctx.lineWidth = 1.6;
            for (let sx = -hw + 4; sx < hw - 6; sx += 10) {
              ctx.beginPath();
              ctx.moveTo(sx, -hh + 4);
              ctx.lineTo(sx + 5, -hh - 6);
              ctx.lineTo(sx + 10, -hh + 4);
              ctx.stroke();
            }
          } else if (p.type === 'electric') {
            ctx.fillStyle = electricCycle ? '#0369a1' : '#1e293b';
            ctx.fillRect(-hw, -hh, p.w, p.h);
            if (electricCycle) {
              ctx.strokeStyle = '#38bdf8';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(-hw, -hh - 3);
              for (let ex = -hw + 12; ex <= hw; ex += 12) {
                ctx.lineTo(ex, -hh - 2 + (Math.random() - 0.5) * 10);
              }
              ctx.stroke();
            }
          } else if (p.type === 'slanted_l' || p.type === 'slanted_r') {
            ctx.fillStyle = '#27272a';
            ctx.fillRect(-hw, -hh, p.w, p.h);
            ctx.fillStyle = '#b45309';
            ctx.fillRect(-hw, -hh, p.w, 3);
          } else if (p.type === 'supply') {
            ctx.fillStyle = '#365314';
            ctx.fillRect(-hw, -hh, p.w, p.h);
            if (p.crateIntact) {
              ctx.fillStyle = '#92400e';
              ctx.fillRect(-13, -hh - 16, 26, 16);
              ctx.strokeStyle = '#fef3c7';
              ctx.lineWidth = 1.5;
              ctx.strokeRect(-13, -hh - 16, 26, 16);
            }
          }

          ctx.restore();
        }
      }

      function drawInGameAnimal(x, y, facing, walkFrame, animalId, name, hpVal, alpha = 1, isLocal = false, vy = 0) {
        const ani = ANIMAL_MAP[animalId] || ANIMALS[0];
        ctx.save();
        ctx.globalAlpha = alpha;

        const cx = x + 15;
        const cy = y + 14;

        // 頭頂名稱與血量條
        ctx.font = '900 11px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = isLocal ? '#78350f' : '#27272a';
        ctx.fillText(name, cx, y - 11);

        const barW = 26;
        ctx.fillStyle = 'rgba(24, 24, 27, 0.85)';
        ctx.fillRect(cx - barW / 2, y - 7, barW, 3.5);
        ctx.fillStyle = hpVal > 4 ? '#d97706' : '#dc2626';
        ctx.fillRect(cx - barW / 2, y - 7, Math.max(0, (hpVal / MAX_HP) * barW), 3.5);

        const sizeScale = Math.max(0.86, Math.min(1.25, 0.82 + ani.weight * 0.17));
        const pitch = Math.max(-0.32, Math.min(0.32, vy * 0.0006));
        drawRealisticAnimal(ctx, animalId, cx, cy, sizeScale, facing, walkFrame, pitch);

        ctx.restore();
      }

      function drawRemotePlayers() {
        for (const rp of peers.values()) {
          if (!rp.alive) continue;
          const screenY = rp.worldY - scrollDistance;
          const ani = ANIMAL_MAP[rp.animalId] || ANIMALS[0];

          if (screenY > -40 && screenY < H + 40) {
            drawInGameAnimal(rp.x, screenY, rp.facing, Date.now() * 0.012, rp.animalId, rp.name, rp.hp, 0.88, false, rp.vy);
          } else {
            ctx.save();
            const clampedY = Math.max(30, Math.min(H - 22, screenY));
            const cx = Math.max(40, Math.min(LOGIC_W - 40, rp.x + 15));
            ctx.fillStyle = '#18181b';
            ctx.font = '900 11px system-ui, sans-serif';
            ctx.textAlign = 'center';
            const arrow = screenY < 0 ? '▲' : '▼';
            ctx.fillText(`${arrow} [${ani.name}] ${rp.name} (B${rp.floor})`, cx, clampedY);
            ctx.restore();
          }
        }
      }

      function drawEffects() {
        for (const sw of shockwaves) {
          ctx.save();
          ctx.strokeStyle = `rgba(180, 83, 9, ${sw.life * 2.5})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(sw.x, sw.y, sw.r, sw.r * 0.35, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        for (const pt of particles) {
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = Math.max(0, pt.life * 2);
          ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
        }
        ctx.globalAlpha = 1;

        for (const pp of popups) {
          ctx.save();
          ctx.font = '900 13px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.globalAlpha = Math.max(0, pp.life / pp.maxLife);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(pp.text, pp.x + 1, pp.y + 1);
          ctx.fillStyle = pp.color;
          ctx.fillText(pp.text, pp.x, pp.y);
          ctx.restore();
        }
      }

      function render(now) {
        renderSelectScreenPortraits(now);

        ctx.save();
        if (shakeTime > 0) {
          const dx = (Math.random() - 0.5) * 9;
          const dy = (Math.random() - 0.5) * 9;
          ctx.translate(dx, dy);
        }

        drawAtmosphericBackground();
        drawPlatforms();
        drawRemotePlayers();

        if (!(player.invulnerable > 0 && Math.floor(player.invulnerable * 20) % 2 === 0)) {
          drawInGameAnimal(
            player.x,
            player.y,
            player.facing,
            player.walkFrame,
            myAnimalId,
            myName,
            hp,
            1,
            true,
            player.vy
          );
        }

        drawCeilingSpikes();
        drawEffects();

        ctx.restore();
      }

      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        render(now);
        requestAnimationFrame(loop);
      }

      updateHUD();
      renderRoster();
      connectMultiplayer();
      requestAnimationFrame(loop);
    })();
  </script>
