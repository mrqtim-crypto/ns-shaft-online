<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#070a0e" />
  <title>TOKYO SHAFT：東京地下叢林 - 12動物多人連線版</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #05070a;
      color: #f1f5f9;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Noto Sans TC', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100%;
      max-height: 940px;
      display: flex;
      flex-direction: column;
      background: #0b0f14;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
      overflow: hidden;
      border-left: 1px solid #1e293b;
      border-right: 1px solid #1e293b;
    }

    /* 東京叢林廢墟風頂部 HUD */
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 11px;
      background: linear-gradient(180deg, #141c24 0%, #090d12 100%);
      border-bottom: 2px solid #263238;
      z-index: 10;
      gap: 6px;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .hp-label {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hp-bar {
      display: flex;
      gap: 2px;
      background: #05070a;
      padding: 3px;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    .hp-unit {
      width: 8px;
      height: 12px;
      border-radius: 1px;
      background: #1e293b;
      transition: background-color 0.15s ease;
    }

    .hp-unit.active {
      background: #84cc16;
      box-shadow: 0 0 5px rgba(132, 204, 22, 0.65);
    }

    .hp-unit.danger {
      background: #ef4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.85);
    }

    .hud-center {
      text-align: center;
      background: #06090d;
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      min-width: 106px;
      position: relative;
    }

    .floor-title {
      font-size: 12px;
      color: #a3e635;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .floor-num {
      font-size: 18px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(163, 230, 53, 0.45);
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #16202a;
      color: #f8fafc;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: #263238;
    }

    /* 多人即時生存條 */
    .mp-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      background: #080c11;
      border-bottom: 1px solid #1e293b;
      font-size: 12px;
      z-index: 9;
      gap: 6px;
      min-height: 28px;
    }

    .mp-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      color: #cbd5e1;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }

    .dot.online {
      background: #84cc16;
      box-shadow: 0 0 6px #84cc16;
    }

    .mp-players-strip {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .mp-chip {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #141c24;
      border: 1px solid #334155;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .mp-chip.dead {
      opacity: 0.4;
      text-decoration: line-through;
    }

    /* 畫布區 */
    .canvas-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background: #070a0e;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 表情快捷列 */
    .emote-bar {
      position: absolute;
      right: 8px;
      bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 12;
    }

    .emote-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(163, 230, 53, 0.35);
      background: rgba(9, 13, 18, 0.8);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .emote-btn:active {
      transform: scale(0.86);
      background: rgba(132, 204, 22, 0.35);
    }

    /* 底部手機觸控控制器 */
    .controls {
      height: 104px;
      background: linear-gradient(0deg, #05070a 0%, #0f161e 100%);
      border-top: 2px solid #1e293b;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 9px 14px calc(9px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
      touch-action: none;
    }

    .ctrl-btn {
      position: relative;
      border-radius: 12px;
      border: 2px solid #334155;
      background: linear-gradient(180deg, #1b2632 0%, #0d131a 100%);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 900;
      box-shadow: 0 5px 0 #040608, inset 0 1px 0 rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }

    .ctrl-btn.pressed {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #040608;
      border-color: #a3e635;
      background: linear-gradient(180deg, #3f6212 0%, #1a2e05 100%);
      color: #ecfccb;
    }

    .ctrl-arrow {
      font-size: 24px;
      line-height: 1;
    }

    /* 大廳與選角覆蓋層 */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 12, 0.9);
      backdrop-filter: blur(7px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 12px;
      z-index: 20;
      overflow-y: auto;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(180deg, #131b24 0%, #0c1117 100%);
      border: 2px solid #2e3d4f;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      margin: auto 0;
    }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 4px;
      background: rgba(132, 204, 22, 0.18);
      border: 1px solid rgba(163, 230, 53, 0.4);
      color: #a3e635;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 3px;
      letter-spacing: 1px;
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      color: #f8fafc;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    /* 12 動物選角網格 */
    .animal-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .animal-cell {
      background: #090d12;
      border: 1.5px solid #263238;
      border-radius: 8px;
      padding: 5px 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: transform 0.1s, border-color 0.1s, background 0.1s;
    }

    .animal-cell.selected {
      border-color: #a3e635;
      background: rgba(63, 98, 18, 0.35);
      box-shadow: 0 0 10px rgba(163, 230, 53, 0.3);
      transform: scale(1.03);
    }

    .animal-emoji {
      font-size: 20px;
      line-height: 1.1;
    }

    .animal-name {
      font-size: 12px;
      font-weight: 800;
      color: #e2e8f0;
      white-space: nowrap;
    }

    .animal-wt {
      font-size: 12px;
      color: #a3e635;
      font-weight: 700;
    }

    /* 動物能力說明卡 */
    .animal-detail {
      background: #080b10;
      border: 1px solid #334155;
      border-left: 4px solid #a3e635;
      border-radius: 8px;
      padding: 7px 10px;
      text-align: left;
      margin-bottom: 8px;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
      font-size: 13px;
      font-weight: 900;
      color: #f8fafc;
    }

    .detail-stats {
      font-size: 12px;
      color: #facc15;
      font-weight: 800;
    }

    .detail-desc {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.35;
    }

    /* 多人連線設定盒 */
    .mp-box {
      background: #080b10;
      border: 1px solid #263238;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      text-align: left;
    }

    .mp-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    .mp-input {
      flex: 1;
      min-width: 0;
      background: #141c24;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .mp-input:focus {
      border-color: #a3e635;
    }

    .mp-btn {
      padding: 6px 9px;
      border-radius: 6px;
      border: 1px solid #a3e635;
      background: rgba(132, 204, 22, 0.15);
      color: #a3e635;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .mp-btn.share {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }

    .room-roster {
      font-size: 12px;
      color: #cbd5e1;
      padding-top: 5px;
      border-top: 1px dashed #263238;
    }

    .roster-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }

    .roster-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 4px;
      background: #141c24;
      border: 1px solid #334155;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 8px;
    }

    .primary-btn {
      width: 100%;
      padding: 11px 10px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(180deg, #84cc16 0%, #4d7c0f 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #365314;
    }

    .primary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #365314;
    }

    .secondary-btn {
      width: 100%;
      padding: 11px 10px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #16202a;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .toast {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(9, 13, 18, 0.95);
      border: 1px solid #a3e635;
      color: #f8fafc;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="toast" id="toast">已複製房間連結！</div>

    <!-- 頂部狀態列 -->
    <div class="hud">
      <div class="hud-left">
        <div class="hp-label">
          <span id="hudAnimalLabel">🐕 博美犬</span>
          <span id="hpText" style="color:#a3e635;">12/12</span>
        </div>
        <div class="hp-bar" id="hpBar"></div>
      </div>

      <div class="hud-center">
        <div class="floor-title" id="zoneLabel">澀谷廢棄地鐵</div>
        <div class="floor-num" id="floorText">B0000</div>
      </div>

      <div class="hud-right">
        <button class="icon-btn" id="soundBtn" title="音效開關">🔊</button>
        <button class="icon-btn" id="pauseBtn" title="選擇動物與房間">🐾</button>
      </div>
    </div>

    <!-- 多人連線狀態條 -->
    <div class="mp-bar">
      <div class="mp-status">
        <span class="dot" id="netDot"></span>
        <span id="roomLabel">房號: ----</span>
      </div>
      <div class="mp-players-strip" id="mpStrip"></div>
    </div>

    <!-- 遊戲畫布 -->
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="gameCanvas"></canvas>

      <!-- 即時表情互動按鈕 -->
      <div class="emote-bar">
        <button class="emote-btn" data-emote="🔥">🔥</button>
        <button class="emote-btn" data-emote="🐾">🐾</button>
        <button class="emote-btn" data-emote="⚡">⚡</button>
        <button class="emote-btn" data-emote="👑">👑</button>
      </div>

      <!-- 大廳與 12 動物選擇面板 -->
      <div class="overlay" id="overlay">
        <div class="card">
          <div class="badge" id="overlayBadge">TOKYO JUNGLE SURVIVAL</div>
          <div class="title" id="overlayTitle">東京地下叢林 Online</div>
          <div class="subtitle" id="overlaySub">選擇你的野生動物！不同體重將壓斜階梯、引發震波或超載崩塌。</div>

          <!-- 12 種動物圖鑑選單 -->
          <div class="animal-grid" id="animalGrid"></div>

          <!-- 當前選中動物專長說明 -->
          <div class="animal-detail">
            <div class="detail-header">
              <span id="detailTitle">🐕 博美犬 (Pomeranian)</span>
              <span class="detail-stats" id="detailStats">體重 0.5t | 速度 ★★★★ | 推力 ★☆</span>
            </div>
            <div class="detail-desc" id="detailDesc">【求生寵兒】體積靈巧；首次踩踏階梯有 25% 機率額外多回 +1 HP，踩腐朽木板不易斷裂。</div>
          </div>

          <!-- 多人連線房間設定 -->
          <div class="mp-box">
            <div class="mp-row">
              <input type="text" id="nameInput" class="mp-input" maxlength="8" placeholder="暱稱" style="max-width:105px;" />
              <input type="text" id="roomInput" class="mp-input" maxlength="8" placeholder="房號" style="text-transform:uppercase;max-width:75px;" />
              <button class="mp-btn" id="joinRoomBtn">進房</button>
              <button class="mp-btn share" id="shareBtn">🔗 邀好友</button>
            </div>

            <div class="room-roster">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span id="connStatusText">🟢 連線準備中...</span>
                <span id="bestScoreText" style="color:#facc15;font-weight:800;">最高紀錄: B0000</span>
              </div>
              <div class="roster-list" id="rosterList"></div>
            </div>
          </div>

          <div class="btn-group">
            <button class="primary-btn" id="startMpBtn">🚀 號召全房同步開局</button>
            <button class="secondary-btn" id="startSoloBtn">🎯 單人立即求生</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 手機雙拇指大按鍵 -->
    <div class="controls">
      <button class="ctrl-btn" id="btnLeft" aria-label="向左移動">
        <span class="ctrl-arrow">◀</span>
        <span>左撲</span>
      </button>
      <button class="ctrl-btn" id="btnRight" aria-label="向右移動">
        <span>右撲</span>
        <span class="ctrl-arrow">▶</span>
      </button>
    </div>
  </div>

  <script>
    (() => {
      // ================== 12 種《東京叢林》動物定義 ==================
      const ANIMALS = [
        {
          id: 'pomeranian', name: '博美犬', emoji: '🐕',
          weight: 0.5, speedMul: 1.16, pushMul: 0.65,
          furPrimary: '#f5d0a9', furSecondary: '#ffffff', eyeColor: '#1e1b18',
          statsText: '體重 0.5x | 速度 ★★★★ | 推力 ★☆',
          desc: '【求生寵兒】《東京叢林》看板犬！首次踩踏階梯有 30% 機率額外多回 +1 HP，體輕不易壓斷木板。'
        },
        {
          id: 'cat', name: '三花街貓', emoji: '🐱',
          weight: 0.6, speedMul: 1.35, pushMul: 0.75,
          furPrimary: '#fb923c', furSecondary: '#fef3c7', eyeColor: '#a3e635',
          statsText: '體重 0.6x | 速度 ★★★★★ | 推力 ★★',
          desc: '【九命輕功】全場移動速度最快！踩在「腐朽神社木板」上時，木板斷裂時間延緩 2 倍。'
        },
        {
          id: 'chick', name: '小黃雞', emoji: '🐤',
          weight: 0.4, speedMul: 1.06, pushMul: 0.5,
          furPrimary: '#facc15', furSecondary: '#fef08a', eyeColor: '#0f172a',
          statsText: '體重 0.4x | 滯空 ★★★★★ | 推力 ★',
          desc: '【絨毛傘降】全場最輕！拍翅滑翔使下墜速度減緩 40%，擁有超長空中找路時間。'
        },
        {
          id: 'rabbit', name: '穴兔', emoji: '🐰',
          weight: 0.65, speedMul: 1.18, pushMul: 0.75,
          furPrimary: '#cbd5e1', furSecondary: '#f8fafc', eyeColor: '#ef4444',
          statsText: '體重 0.65x | 二段跳 ★★★★★ | 推力 ★★',
          desc: '【蹬牆二段跳】失足離開階梯或貼近兩側牆壁時，可自動觸發一次「空中救命二段跳」！'
        },
        {
          id: 'leopard', name: '黑斑花豹', emoji: '🐆',
          weight: 1.1, speedMul: 1.26, pushMul: 1.15,
          furPrimary: '#eab308', furSecondary: '#713f12', eyeColor: '#bef264',
          statsText: '體重 1.1x | 撲擊 ★★★★★ | 推力 ★★★',
          desc: '【獵食撲擊】助跑跳離階梯時獲得額外水平衝刺；從上方踩中其他動物可借力往上跳！'
        },
        {
          id: 'frog', name: '巨型牛蛙', emoji: '🐸',
          weight: 0.85, speedMul: 1.08, pushMul: 0.95,
          furPrimary: '#4d7c0f', furSecondary: '#a3e635', eyeColor: '#fde047',
          statsText: '體重 0.85x | 防滑 ★★★★★ | 推力 ★★★',
          desc: '【濕滑吸盤】完全免疫「青苔斷橋」打滑與「傾斜階梯」下滑，輸送帶推力減少 70%。'
        },
        {
          id: 'deer', name: '梅花鹿', emoji: '🦌',
          weight: 1.2, speedMul: 1.14, pushMul: 1.05,

      // Seeded PRNG (Mulberry32)
      let rngState = 987654321;
      function seedRandom(seed) {
        rngState = seed >>> 0;
      }
      function nextRandom() {
        let t = (rngState += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      // 合成音效系統 (Web Audio API)
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSound(type, weight = 1) {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'land') {
          osc.type = 'triangle';
          const baseFreq = Math.max(110, 280 - weight * 65);
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.3, now + 0.07);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'stomp') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(95, now);
          osc.frequency.linearRampToValueAtTime(42, now + 0.22);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
          if (navigator.vibrate) navigator.vibrate(45);
        } else if (type === 'spring') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.setValueAtTime(420, now + 0.05);
          osc.frequency.exponentialRampToValueAtTime(680, now + 0.16);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'bump') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.09);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.start(now);
          osc.stop(now + 0.09);
          if (navigator.vibrate) navigator.vibrate(25);
        } else if (type === 'hurt') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(165, now);
          osc.frequency.linearRampToValueAtTime(65, now + 0.24);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.24);
          if (navigator.vibrate) navigator.vibrate(80);
        } else if (type === 'shock') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.setValueAtTime(180, now + 0.04);
          osc.frequency.setValueAtTime(640, now + 0.08);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.14);
        } else if (type === 'supply') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.06);
          osc.frequency.setValueAtTime(783.99, now + 0.12);
          osc.frequency.setValueAtTime(1046.5, now + 0.18);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.start(now);
          osc.stop(now + 0.32);
        } else if (type === 'gameover') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.linearRampToValueAtTime(75, now + 0.45);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        }
      }

      function resizeCanvas() {
        const rect = canvasWrap.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        viewScale = (rect.width || 380) / LOGIC_W;
        W = LOGIC_W;

        canvas.width = (rect.width || 380) * dpr;
        canvas.height = (rect.height || 540) * dpr;
        ctx.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas);

      let platforms = [];

      // ============== MQTT 多人連線系統 ==============
      const urlParams = new URLSearchParams(window.location.search);
      let currentRoom = (urlParams.get('room') || '8888').toUpperCase().slice(0, 8);
      roomInput.value = currentRoom;
      roomLabel.textContent = `房號: ${currentRoom}`;

      let mqttClient = null;
      let currentTopic = '';
      const BROKERS = [
        'wss://broker.emqx.io:8084/mqtt',
        'wss://broker.hivemq.com:8884/mqtt'
      ];
      let brokerIdx = 0;

      function getTopic(room) {
        return `tokyo-shaft-v2/room/${room}`;
      }

      function connectMultiplayer() {
        if (typeof mqtt === 'undefined') {
          connStatusText.textContent = '⚠️ 離線單機模式';
          return;
        }
        const url = BROKERS[brokerIdx % BROKERS.length];
        connStatusText.textContent = '🟡 連線東京地下伺服器...';
        netDot.classList.remove('online');

        if (mqttClient) {
          try { mqttClient.end(true); } catch (_) {}
        }

        mqttClient = mqtt.connect(url, {
          clientId: 'tkshaft_' + myId + '_' + Math.floor(Math.random() * 999),
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 3000
        });

        mqttClient.on('connect', () => {
          netDot.classList.add('online');
          connStatusText.textContent = `🟢 已連線 (房號 ${currentRoom})`;
          subscribeRoom(currentRoom);
          broadcastHeartbeat();
        });

        mqttClient.on('error', () => { brokerIdx++; });
        mqttClient.on('offline', () => {
          netDot.classList.remove('online');
          connStatusText.textContent = '🟠 重新連線中...';
        });

        mqttClient.on('message', (topic, payload) => {
          if (topic !== currentTopic) return;
          try {
            const msg = JSON.parse(payload.toString());
            if (!msg || msg.id === myId) return;
            handleNetworkMessage(msg);
          } catch (_) {}
        });
      }

      function subscribeRoom(newRoom) {
        const cleanRoom = (newRoom || '8888').trim().toUpperCase().slice(0, 8) || '8888';
        if (mqttClient && currentTopic) {
          try { mqttClient.unsubscribe(currentTopic); } catch (_) {}
        }
        currentRoom = cleanRoom;
        roomInput.value = currentRoom;
        roomLabel.textContent = `房號: ${currentRoom}`;
        currentTopic = getTopic(currentRoom);
        peers.clear();
        renderRoster();

        if (mqttClient && mqttClient.connected) {
          mqttClient.subscribe(currentTopic, { qos: 0 });
          connStatusText.textContent = `🟢 已連線 (房號 ${currentRoom})`;
          broadcastHeartbeat();
        }
      }

      function publishMsg(data) {
        if (!mqttClient || !mqttClient.connected || !currentTopic) return;
        data.id = myId;
        try {
          mqttClient.publish(currentTopic, JSON.stringify(data), { qos: 0 });
        } catch (_) {}
      }

      function broadcastHeartbeat() {
        publishMsg({
          t: 'hb',
          name: myName,
          ani: myAnimalId,
          floor,
          hp,
          alive: state === 'PLAYING' && hp > 0
        });
      }

      function broadcastPos() {
        if (state !== 'PLAYING') return;
        publishMsg({
          t: 'pos',
          name: myName,
          ani: myAnimalId,
          x: Math.round(player.x),
          wy: Math.round(player.y + scrollDistance),
          vx: Math.round(player.vx),
          vy: Math.round(player.vy),
          f: player.facing,
          hp,
          fl: floor,
          alive: hp > 0
        });
      }

      function handleNetworkMessage(msg) {
        const now = performance.now();
        let p = peers.get(msg.id);
        if (!p) {
          p = {
            id: msg.id,
            name: msg.name || '野獸',
            animalId: ANIMAL_MAP[msg.ani] ? msg.ani : 'pomeranian',
            x: LOGIC_W / 2,
            worldY: 200,
            vx: 0,
            vy: 0,
            facing: 1,
            hp: MAX_HP,
            floor: 1,
            alive: false,
            lastSeen: now
          };
          peers.set(msg.id, p);
          renderRoster();
        }

        p.lastSeen = now;
        if (msg.name) p.name = msg.name;
        if (msg.ani && ANIMAL_MAP[msg.ani]) p.animalId = msg.ani;

        if (msg.t === 'hb') {
          p.floor = msg.floor || p.floor;
          p.hp = msg.hp !== undefined ? msg.hp : p.hp;
          p.alive = !!msg.alive;
          renderRoster();
        } else if (msg.t === 'pos') {
          p.x = msg.x;
          p.worldY = msg.wy;
          p.vx = msg.vx || 0;
          p.vy = msg.vy || 0;
          p.facing = msg.f || 1;
          p.hp = msg.hp;
          p.floor = msg.fl;
          p.alive = !!msg.alive;
        } else if (msg.t === 'start') {
          showToast(`🚀 ${p.name} 號召了全房同步開局！`);
          startGame(msg.seed, false);
        } else if (msg.t === 'stomp') {
          // 遠端巨象或河馬釋放震波
          const myWorldY = player.y + scrollDistance;
          if (Math.abs(myWorldY - msg.wy) < 30 && Math.abs(player.x - msg.x) < 110) {
            player.onPlatform = null;
            player.vy = -270;
            player.pushVx = (player.x >= msg.x ? 1 : -1) * 190;
            shakeTime = 0.25;
            playSound('stomp');
            addPopup(player.x + 14, player.y, '💥 巨象震波！', '#facc15');
          }
        } else if (msg.t === 'emote') {
          addPopup(p.x + 14, p.worldY - scrollDistance - 16, msg.emoji, '#ffffff');
        } else if (msg.t === 'dead') {
          p.alive = false;
          p.hp = 0;
          p.floor = msg.fl || p.floor;
          const ani = ANIMAL_MAP[p.animalId] || ANIMALS[0];
          addPopup(LOGIC_W / 2, 86, `💀 ${ani.emoji}${p.name} 在 B${p.floor} 倒下！`, '#f87171');
          renderRoster();
        }
      }

      setInterval(() => {
        const now = performance.now();
        let changed = false;
        for (const [id, p] of peers.entries()) {
          if (now - p.lastSeen > 8000) {
            peers.delete(id);
            changed = true;
          }
        }
        if (changed) renderRoster();
        broadcastHeartbeat();
        renderMpStrip();
      }, 1500);

      setInterval(() => {
        if (state === 'PLAYING') broadcastPos();
      }, 60);

      function renderRoster() {
        rosterList.innerHTML = '';
        const myAni = ANIMAL_MAP[myAnimalId];
        const meTag = document.createElement('div');
        meTag.className = 'roster-tag';
        meTag.innerHTML = `<span>${myAni.emoji}</span><span>${escapeHtml(myName)} (${myAni.weight}t)</span>`;
        rosterList.appendChild(meTag);

        for (const p of peers.values()) {
          const ani = ANIMAL_MAP[p.animalId] || ANIMALS[0];
          const tag = document.createElement('div');
          tag.className = 'roster-tag';
          tag.innerHTML = `<span>${ani.emoji}</span><span>${escapeHtml(p.name)} (${ani.weight}t)</span>`;
          rosterList.appendChild(tag);
        }
        renderMpStrip();
      }

      function renderMpStrip() {
        const myAni = ANIMAL_MAP[myAnimalId];
        const list = [
          { name: myName, emoji: myAni.emoji, floor, alive: state === 'PLAYING' && hp > 0 },
          ...Array.from(peers.values()).map(p => ({
            name: p.name,
            emoji: (ANIMAL_MAP[p.animalId] || ANIMALS[0]).emoji,
            floor: p.floor,
            alive: p.alive
          }))
        ];
        list.sort((a, b) => b.floor - a.floor);

        mpStrip.innerHTML = list.map(u => {
          const deadClass = (!u.alive && u.floor > 0 && state === 'PLAYING') ? ' dead' : '';
          return `<div class="mp-chip${deadClass}">
            <span>${u.emoji}</span>
            <span>${escapeHtml(u.name.slice(0, 4))}</span>
            <span style="color:#a3e635;">B${u.floor || 0}</span>
          </div>`;
        }).join('');
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      joinRoomBtn.addEventListener('click', () => {
        myName = nameInput.value.trim() || myName;
        localStorage.setItem(NAME_KEY, myName);
        subscribeRoom(roomInput.value);
        showToast(`已進入房間 ${currentRoom}`);
      });

      shareBtn.addEventListener('click', async () => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(currentRoom)}`;
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'TOKYO SHAFT：東京地下叢林 多人連線',
              text: `快選一隻動物加入房間【${currentRoom}】，一起來東京地下叢林下樓梯大亂鬥！`,
              url: shareUrl
            });
            return;
          } catch (_) {}
        }
        try {
          await navigator.clipboard.writeText(shareUrl);
          showToast(`已複製房間【${currentRoom}】邀請連結！`);
        } catch (_) {
          prompt('請複製連結分享給好友：', shareUrl);
        }
      });

      document.querySelectorAll('.emote-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const emoji = btn.getAttribute('data-emote');
          addPopup(player.x + player.w / 2, player.y - 12, emoji, '#ffffff');
          publishMsg({ t: 'emote', emoji });
        });
      });

      // ============== 操控輸入 ==============
      const input = { left: false, right: false };

      function updateBtnVisuals() {
        btnLeft.classList.toggle('pressed', input.left);
        btnRight.classList.toggle('pressed', input.right);
      }

      const activeTouches = new Map();

      function recomputeTouchInput() {
        let l = false;
        let r = false;
        for (const dir of activeTouches.values()) {
          if (dir === 'left') l = true;
          if (dir === 'right') r = true;
        }
        input.left = l;
        input.right = r;
        updateBtnVisuals();
      }

      function bindTouchArea(el, fixedDir = null) {
        el.addEventListener('touchstart', (e) => {
          if (state !== 'PLAYING') return;
          if (e.target.closest('.emote-btn')) return;
          e.preventDefault();
          initAudio();
          const rect = canvasWrap.getBoundingClientRect();
          for (const t of e.changedTouches) {
            const dir = fixedDir || (t.clientX < rect.left + rect.width / 2 ? 'left' : 'right');
            activeTouches.set(t.identifier, dir);
          }
          recomputeTouchInput();
        }, { passive: false });

        el.addEventListener('touchmove', (e) => {
          if (state !== 'PLAYING' || fixedDir) return;
          e.preventDefault();
          const rect = canvasWrap.getBoundingClientRect();
          for (const t of e.changedTouches) {
            const dir = t.clientX < rect.left + rect.width / 2 ? 'left' : 'right';
            activeTouches.set(t.identifier, dir);
          }
          recomputeTouchInput();
        }, { passive: false });

        const endHandler = (e) => {
          for (const t of e.changedTouches) {
            activeTouches.delete(t.identifier);
          }
          recomputeTouchInput();
        };
        el.addEventListener('touchend', endHandler);
        el.addEventListener('touchcancel', endHandler);
      }

      bindTouchArea(btnLeft, 'left');
      bindTouchArea(btnRight, 'right');
      bindTouchArea(canvas);

      function bindMouseBtn(btn, dir) {
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault();
          initAudio();
          input[dir] = true;
          updateBtnVisuals();
        });
        window.addEventListener('mouseup', () => {
          input.left = false;
          input.right = false;
          updateBtnVisuals();
        });
      }
      bindMouseBtn(btnLeft, 'left');
      bindMouseBtn(btnRight, 'right');

      window.addEventListener('keydown', (e) => {
        if (document.activeElement === nameInput || document.activeElement === roomInput) return;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          input.left = true;
          updateBtnVisuals();
        } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          input.right = true;
          updateBtnVisuals();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          input.left = false;
          updateBtnVisuals();
        } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          input.right = false;
          updateBtnVisuals();
        }
      });

      function formatFloor(n) {
        return 'B' + String(n).padStart(4, '0');
      }

      function updateHUD() {
        hpTextEl.textContent = `${hp}/${MAX_HP}`;
        hpUnits.forEach((unit, idx) => {
          unit.className = 'hp-unit';
          if (idx < hp) {
            unit.classList.add(hp <= 4 ? 'danger' : 'active');
          }
        });
        floorTextEl.textContent = formatFloor(floor);
        if (floor < 30) {
          zoneLabel.textContent = '澀谷廢棄地鐵';
          zoneLabel.style.color = '#a3e635';
        } else if (floor < 60) {
          zoneLabel.textContent = '地下高壓電網';
          zoneLabel.style.color = '#38bdf8';
        } else {
          zoneLabel.textContent = '深淵地熱核心';
          zoneLabel.style.color = '#f87171';
        }
      }

      function addPopup(x, y, text, color) {
        popups.push({ x, y, text, color, life: 0.9, maxLife: 0.9 });
      }

      function spawnParticles(x, y, color, count = 8) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = 40 + Math.random() * 115;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - 35,
            size: 2 + Math.random() * 3.5,
            color,
            life: 0.35 + Math.random() * 0.25
          });
        }
      }

      // ============== 10 種《東京叢林》廢墟階梯生成器 ==============
      function pickPlatformType(approxFloor, indexCount) {
        // 每 16 個階梯固定出一個東京空投補給箱
        if (indexCount > 0 && indexCount % 16 === 0) return 'supply';

        const barbedWeight = Math.min(20, 8 + approxFloor * 0.16);
        const woodWeight = 13;
        const seesawWeight = 14;
        const taxiWeight = 11;
        const mossWeight = 11;
        const conveyorWeight = 12;
        const electricWeight = approxFloor >= 12 ? 9 : 0;
        const slantedWeight = approxFloor >= 18 ? 9 : 0;
        const steelWeight = Math.max(22, 100 - (barbedWeight + woodWeight + seesawWeight + taxiWeight + mossWeight + conveyorWeight + electricWeight + slantedWeight));

        const total = steelWeight + barbedWeight + woodWeight + seesawWeight + taxiWeight + mossWeight + conveyorWeight + electricWeight + slantedWeight;
        let r = nextRandom() * total;

        if ((r -= steelWeight) < 0) return 'steel';
        if ((r -= seesawWeight) < 0) return 'seesaw';
        if ((r -= woodWeight) < 0) return 'wood';
        if ((r -= taxiWeight) < 0) return 'taxi';
        if ((r -= mossWeight) < 0) return 'moss';
        if ((r -= conveyorWeight) < 0) return nextRandom() < 0.5 ? 'conveyor_l' : 'conveyor_r';
        if ((r -= barbedWeight) < 0) return 'barbed';
        if ((r -= electricWeight) < 0) return 'electric';
        return nextRandom() < 0.5 ? 'slanted_l' : 'slanted_r';
      }

      let spawnedCount = 0;

      function createPlatformAtWorldY(worldY, forceSteel = false) {
        const margin = 18;
        const pw = 96;
        const x = margin + nextRandom() * (LOGIC_W - margin * 2 - pw);
        const approxFloor = Math.max(1, Math.floor(worldY / 260));
        spawnedCount++;
        const type = forceSteel ? 'steel' : pickPlatformType(approxFloor, spawnedCount);

        let baseTilt = 0;
        if (type === 'slanted_l') baseTilt = -0.18;
        if (type === 'slanted_r') baseTilt = 0.18;

        return {
          x,
          worldY,
          y: worldY - scrollDistance,
          w: pw,
          h: 14,
          type,
          touched: false,
          broken: false,
          breakTimer: 0,
          overloadTimer: 0,
          totalLoad: 0,
          springCompress: 0,
          sagY: 0,
          sagVy: 0,
          tilt: baseTilt,
          baseTilt,
          crateIntact: type === 'supply'
        };
      }

      function startGame(seed = Date.now(), broadcastToRoom = false) {
        initAudio();
        resizeCanvas();
        myName = nameInput.value.trim() || myName;
        localStorage.setItem(NAME_KEY, myName);
        if (roomInput.value.trim().toUpperCase() !== currentRoom) {
          subscribeRoom(roomInput.value);
        }

        currentSeed = seed >>> 0;
        seedRandom(currentSeed);
        spawnedCount = 0;

        if (broadcastToRoom) {
          publishMsg({
            t: 'start',
            seed: currentSeed
          });
        }

        hp = MAX_HP;
        floor = 1;
        scrollDistance = 0;
        scrollSpeed = 112;
        shakeTime = 0;
        platforms = [];
        particles = [];
        popups = [];
        shockwaves = [];
        activeTouches.clear();
        input.left = false;
        input.right = false;
        updateBtnVisuals();

        const startPlat = createPlatformAtWorldY(210, true);
        startPlat.x = LOGIC_W / 2 - startPlat.w / 2;
        startPlat.touched = true;
        platforms.push(startPlat);

        nextSpawnWorldY = 210 + 76;
        while (nextSpawnWorldY < H + 120) {
          platforms.push(createPlatformAtWorldY(nextSpawnWorldY, nextSpawnWorldY < 370));
          nextSpawnWorldY += 76;
        }

        player.x = startPlat.x + startPlat.w / 2 - player.w / 2;
        player.y = startPlat.y - player.h;
        player.vx = 0;
        player.vy = 0;
        player.pushVx = 0;
        player.onPlatform = startPlat;
        player.runTime = 0;
        player.canDoubleJump = true;
        player.stunTimer = 0;
        player.adrenalineTimer = 0;
        player.invulnerable = 0;

        updateAnimalDetail();
        updateHUD();
        state = 'PLAYING';
        overlay.classList.add('hidden');
        broadcastHeartbeat();
        broadcastPos();
      }

      pauseBtn.addEventListener('click', () => {
        overlay.classList.toggle('hidden');
      });

      startMpBtn.addEventListener('click', () => startGame(Date.now(), true));
      startSoloBtn.addEventListener('click', () => startGame(Date.now(), false));

      function hurtPlayer(amount, x, y, label = '') {
        if (player.invulnerable > 0) return;
        hp = Math.max(0, hp - amount);
        player.invulnerable = 0.55;
        shakeTime = 0.25;
        playSound('hurt');
        addPopup(x, y, `${label}-${amount} HP`, '#ef4444');
        spawnParticles(x, y, '#ef4444', 14);
        updateHUD();
        if (hp <= 0) {
          triggerGameOver('在東京地下叢林力竭倒下！');
        }
      }

      function healPlayer(amount, x, y, customLabel = '') {
        if (hp < MAX_HP) {
          hp = Math.min(MAX_HP, hp + amount);
          addPopup(x, y, customLabel || `+${amount} HP`, '#a3e635');
          updateHUD();
        } else if (customLabel) {
          addPopup(x, y, customLabel, '#facc15');
        }
      }

      function triggerGameOver(reason) {
        state = 'GAMEOVER';
        playSound('gameover');
        publishMsg({ t: 'dead', fl: floor });
        broadcastHeartbeat();

        if (floor > bestFloor) {
          bestFloor = floor;
          localStorage.setItem(STORAGE_KEY, String(bestFloor));
          bestScoreText.textContent = `最高紀錄: B${String(bestFloor).padStart(4, '0')}`;
        }

        const ani = ANIMAL_MAP[myAnimalId];
        overlayBadge.textContent = `SURVIVAL RECORD: B${floor}`;
        overlayTitle.textContent = `${ani.emoji} ${ani.name} 生存結束`;
        overlaySub.textContent = `${reason} 隨時可換一隻動物或號召全房再次開局！`;
        overlay.classList.remove('hidden');
        renderMpStrip();
      }

      function handleLanding(plat, impactVy) {
        const ani = ANIMAL_MAP[myAnimalId];
        player.onPlatform = plat;
        player.y = plat.y + plat.sagY - player.h;
        player.vy = 0;
        player.canDoubleJump = true;

        const cx = player.x + player.w / 2;
        const cy = player.y;

        // 階梯重量下沉物理反饋 (體重 × 衝擊速度)
        plat.sagVy = Math.min(180, (45 + impactVy * 0.14) * ani.weight);

        // 亞洲巨象 / 巨型河馬 高處重踏震波！
        if (ani.weight >= 2.0 && impactVy > 260) {
          shakeTime = 0.2;
          playSound('stomp');
          shockwaves.push({ x: cx, y: plat.y, r: 8, maxR: 95, life: 0.35 });
          publishMsg({ t: 'stomp', x: Math.round(cx), wy: Math.round(plat.worldY) });
          if (ani.id === 'elephant') {
            addPopup(cx, cy - 14, '🐘 末日重踏！', '#f8fafc');
          }
        }

        // 空投補給箱特殊獎勵
        if (plat.type === 'supply' && plat.crateIntact) {
          plat.crateIntact = false;
          plat.touched = true;
          healPlayer(4, cx, cy - 10, '🥩 空投補給 +4 HP!');
          player.adrenalineTimer = 3.5;
          playSound('supply');
          spawnParticles(cx, plat.y, '#facc15', 16);
          return;
        }

        if (plat.type === 'barbed') {
          if (!plat.touched) {
            plat.touched = true;
            let dmg = 5;
            if (ani.id === 'croc') dmg = 2; // 灣鱷裝甲鱗片減半
            else if (ani.weight >= 2.1) dmg = 4; // 河馬/巨象厚皮
            hurtPlayer(dmg, cx, cy, '🩸 鐵絲網 ');
          }
        } else if (plat.type === 'taxi') {
          if (!plat.touched) {
            plat.touched = true;
            const healAmt = ani.id === 'deer' ? 2 : 1;
            healPlayer(healAmt, cx, cy, ani.id === 'deer' ? '🦌 森林跳躍 +2 HP' : '+1 HP');
          }
          plat.springCompress = 1;
          player.onPlatform = null;
          // 體重影響彈跳高度，梅花鹿精準受控
          const weightFactor = ani.id === 'deer' ? 0.86 : Math.max(0.72, Math.min(1.18, 1.08 / Math.sqrt(ani.weight)));
          player.vy = -415 * weightFactor;
          playSound('spring');
          spawnParticles(cx, plat.y, '#facc15', 10);
        } else {
          if (!plat.touched) {
            plat.touched = true;
            let bonus = 1;
            let label = '+1 HP';
            if (ani.id === 'pomeranian' && Math.random() < 0.3) {
              bonus = 2;
              label = '🐕 寵兒 +2 HP';
            }
            healPlayer(bonus, cx, cy, label);
            playSound('land', ani.weight);
            spawnParticles(cx, plat.y, '#a3e635', 5);
          }
        }
      }

      function update(dt) {
        // 更新背景漂浮孢子
        for (const sp of spores) {
          sp.y += sp.vy * dt;
          sp.x += sp.vx * dt;
          if (sp.y < 0) { sp.y = H; sp.x = Math.random() * LOGIC_W; }
          if (sp.x < 0) sp.x = LOGIC_W;
          if (sp.x > LOGIC_W) sp.x = 0;
        }

        if (state !== 'PLAYING') return;

        const ani = ANIMAL_MAP[myAnimalId];

        scrollSpeed = Math.min(242, 112 + floor * 1.32);
        const dy = scrollSpeed * dt;

        scrollDistance += dy;
        wallOffset = (wallOffset + dy) % 36;
        conveyorAnim = (conveyorAnim + dt * 45) % 16;

        const newFloor = 1 + Math.floor(scrollDistance / 260);
        if (newFloor > floor) {
          floor = newFloor;
          // 野生大熊貓每 12 階自動啃竹葉回血
          if (ani.id === 'panda' && floor % 12 === 0) {
            healPlayer(2, player.x + 14, player.y, '🎍 竹葉 +2 HP');
          } else if (floor % 10 === 0) {
            addPopup(LOGIC_W / 2, 65, `🐾 深入地下 ${floor} 階！`, '#a3e635');
          }
          updateHUD();
        }

        if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);
        if (player.invulnerable > 0) player.invulnerable = Math.max(0, player.invulnerable - dt);
        if (player.stunTimer > 0) player.stunTimer = Math.max(0, player.stunTimer - dt);
        if (player.adrenalineTimer > 0) player.adrenalineTimer = Math.max(0, player.adrenalineTimer - dt);

        while (nextSpawnWorldY < scrollDistance + H + 80) {
          platforms.push(createPlatformAtWorldY(nextSpawnWorldY, false));
          nextSpawnWorldY += 76;
        }

        // ============== 更新所有階梯的重量物理 (下沉、翹翹板傾斜、超載崩塌) ==============
        const electricCycle = (Date.now() % 1800) < 480; // 漏電週期

        for (let i = platforms.length - 1; i >= 0; i--) {
          const p = platforms[i];

          // 彈簧下沉阻尼物理
          p.sagVy += (-p.sagY * 160 - p.sagVy * 12) * dt;
          p.sagY = Math.max(-4, Math.min(14, p.sagY + p.sagVy * dt));

          if (p.springCompress > 0) {
            p.springCompress = Math.max(0, p.springCompress - dt * 5);
          }

          // 計算站在這塊階梯上的所有動物總重量與偏心力矩
          let load = 0;
          let torque = 0;
          const pCenter = p.x + p.w / 2;

          if (player.onPlatform === p) {
            load += ani.weight;
            const offset = ((player.x + player.w / 2) - pCenter) / (p.w / 2);
            torque += offset * ani.weight;
          }

          for (const rp of peers.values()) {
            if (!rp.alive) continue;
            const rpAni = ANIMAL_MAP[rp.animalId] || ANIMALS[0];
            const onThisPlat = Math.abs((rp.worldY + 30) - p.worldY) < 18 &&
                               (rp.x + 24 > p.x) && (rp.x + 4 < p.x + p.w);
            if (onThisPlat) {
              load += rpAni.weight;
              const offset = ((rp.x + 14) - pCenter) / (p.w / 2);
              torque += offset * rpAni.weight;
            }
          }

          p.totalLoad = load;

          // 力矩傾斜角度計算（懸吊招牌 seesaw 最敏感，一般階梯也會因大象偏心而微傾）
          const tiltSensitivity = p.type === 'seesaw' ? 0.24 : (p.type === 'slanted_l' || p.type === 'slanted_r' ? 0.05 : 0.085);
          const targetTilt = Math.max(-0.42, Math.min(0.42, p.baseTilt + torque * tiltSensitivity));
          p.tilt += (targetTilt - p.tilt) * Math.min(1, dt * 10);

          // 腐朽神社木板：斷裂時間與體重成反比！
          if (p.type === 'wood' && p.touched && !p.broken) {
            const weightRate = ani.id === 'cat' ? 0.45 : Math.max(0.45, Math.max(load, ani.weight));
            p.breakTimer += dt * weightRate;
            if (p.breakTimer >= 0.42) {
              p.broken = true;
              spawnParticles(p.x + p.w / 2, p.y, '#d97706', 12);
              if (player.onPlatform === p) player.onPlatform = null;
            }
          }

          // 多人超載崩塌：一般鋼樑若同時承載 > 2.75t 持續 1.0 秒則超載折斷
          if (p.type === 'steel' && load > 2.75 && !p.broken) {
            p.overloadTimer += dt;
            if (p.overloadTimer >= 1.0) {
              p.broken = true;
              shakeTime = 0.2;
              playSound('stomp');
              spawnParticles(p.x + p.w / 2, p.y, '#f97316', 16);
              addPopup(p.x + p.w / 2, p.y, '⚠️ 超載崩塌！', '#f97316');
              if (player.onPlatform === p) player.onPlatform = null;
            }
          } else {
            p.overloadTimer = Math.max(0, p.overloadTimer - dt);
          }

          if (p.broken) {
            p.worldY += 310 * dt;
          }
          p.y = p.worldY - scrollDistance;

          if (p.y < -50) {
            platforms.splice(i, 1);
          }
        }

        // ============== 玩家水平移動、動物專長與斜坡物理 ==============
        let moveDir = 0;
        if (player.stunTimer <= 0) {
          if (input.left) moveDir -= 1;
          if (input.right) moveDir += 1;
        }

        if (moveDir !== 0 && moveDir === player.facing) {
          player.runTime += dt;
        } else {
          player.runTime = 0;
        }

        // 荒原野豬暴衝加成 & 空投腎上腺素加成
        let speedMultiplier = ani.speedMul;
        let boarCharging = false;
        if (ani.id === 'boar' && player.runTime > 0.32) {
          speedMultiplier *= 1.32;
          boarCharging = true;
          if (Math.random() < 0.35) {
            spawnParticles(player.x + 14, player.y + 26, '#f87171', 1);
          }
        }
        if (player.adrenalineTimer > 0) {
          speedMultiplier *= 1.25;
        }

        const targetVx = moveDir * player.baseSpeed * speedMultiplier;

        // 青苔水泥斷橋低摩擦慣性 vs 一般地面
        const onMoss = player.onPlatform && player.onPlatform.type === 'moss' && ani.id !== 'frog' && ani.id !== 'croc';
        const accel = onMoss ? 4.2 : 18.0;
        player.vx += (targetVx - player.vx) * Math.min(1, accel * dt);

        // 推擠速度衰減（體重越重越快穩住）
        player.pushVx *= Math.pow(0.005 / Math.sqrt(ani.weight), dt);

        if (moveDir !== 0) {
          player.facing = moveDir;
          player.walkFrame += dt * 15 * speedMultiplier;
        } else {
          player.walkFrame = 0;
        }

        let totalVx = player.vx + player.pushVx;

        if (player.onPlatform) {
          const p = player.onPlatform;

          // 電動步道輸送帶推力（牛蛙減少 70%，重型動物慣性抗推）
          const convFactor = ani.id === 'frog' ? 0.3 : (1 / Math.pow(ani.weight, 0.35));
          if (p.type === 'conveyor_l') totalVx -= 125 * convFactor;
          if (p.type === 'conveyor_r') totalVx += 125 * convFactor;

          // 斜坡重力下滑分力（灣鱷與牛蛙抓地不滑，小黃雞輕巧不易滑）
          if (ani.id !== 'croc' && ani.id !== 'frog') {
            const slideMul = onMoss ? 420 : (ani.id === 'chick' ? 140 : 280);
            totalVx += Math.sin(p.tilt) * slideMul;
          }

          // 漏電變電箱觸電判定
          if (p.type === 'electric' && electricCycle && player.invulnerable <= 0) {
            hurtPlayer(3, player.x + 14, player.y, '⚡ 觸電 ');
            playSound('shock');
            if (ani.id !== 'hippo') {
              player.stunTimer = 0.42;
            }
          }
        }

        // ============== 多人動物噸位碰撞推擠 & 花豹踩頭 / 熊貓反彈 ==============
        const myWorldY = player.y + scrollDistance;
        for (const rp of peers.values()) {
          if (!rp.alive) continue;
          const rpAni = ANIMAL_MAP[rp.animalId] || ANIMALS[0];
          const dx = (player.x + player.w / 2) - (rp.x + 14);
          const dyWorld = myWorldY - rp.worldY;

          if (Math.abs(dx) < 24 && Math.abs(dyWorld) < 26) {
            // 若我是花豹且從上方落下踩中對方頭頂
            if (ani.id === 'leopard' && dyWorld < -8 && player.vy > 0) {
              player.onPlatform = null;
              player.vy = -310;
              playSound('spring');
              addPopup(player.x + 14, player.y, '🐆 獵食踩躍！', '#facc15');
              continue;
            }

            // 計算雙方推擠倍率：對方推力 × (若對方是熊貓或我是野豬暴衝) / 我的體重抗性
            const pushSign = dx >= 0 ? 1 : -1;
            let incomingForce = 210 * (rpAni.pushMul / Math.pow(ani.weight, 0.65));
            if (rpAni.id === 'panda') {
              incomingForce *= 1.65;
              addPopup(player.x + 14, player.y, '🐼 太極彈飛！', '#f8fafc');
            }
            if (boarCharging) {
              incomingForce *= 0.4; // 野豬暴衝時自身極難被推退
            }
            player.pushVx = pushSign * incomingForce;
            playSound('bump');
            spawnParticles(player.x + 14, player.y + 15, '#a3e635', 5);
          }
        }

        player.x += totalVx * dt;

        // 左右牆壁邊界（穴兔貼牆可觸發蹬牆跳）
        const wallWidth = 12;
        if (player.x <= wallWidth) {
          player.x = wallWidth;
          if (ani.id === 'rabbit' && !player.onPlatform && player.vy > 40 && player.canDoubleJump) {
            player.canDoubleJump = false;
            player.vy = -290;
            player.pushVx = 160;
            playSound('spring');
            addPopup(player.x + 14, player.y, '🐰 蹬牆跳！', '#f8fafc');
          }
        }
        if (player.x + player.w >= LOGIC_W - wallWidth) {
          player.x = LOGIC_W - wallWidth - player.w;
          if (ani.id === 'rabbit' && !player.onPlatform && player.vy > 40 && player.canDoubleJump) {
            player.canDoubleJump = false;
            player.vy = -290;
            player.pushVx = -160;
            playSound('spring');
            addPopup(player.x + 14, player.y, '🐰 蹬牆跳！', '#f8fafc');
          }
        }

        // ============== 垂直移動與階梯碰撞 ==============
        const prevFootY = player.y + player.h;

        if (player.onPlatform) {
          const p = player.onPlatform;
          // 計算傾斜階梯在玩家 X 位置的實際高度
          const relX = (player.x + player.w / 2) - (p.x + p.w / 2);
          const tiltOffsetY = Math.sin(p.tilt) * relX;
          player.y = p.y + p.sagY + tiltOffsetY - player.h;

          const overlap = (player.x + player.w - 4 > p.x) && (player.x + 4 < p.x + p.w);
          if (!overlap || p.broken) {
            player.onPlatform = null;
            // 黑斑花豹助跑跳離階梯時獲得水平撲擊加速
            if (ani.id === 'leopard' && moveDir !== 0 && !p.broken) {
              player.pushVx = moveDir * 135;
              player.vy = -115;
            } else {
              player.vy = 0;
            }
          }
        }

        if (!player.onPlatform) {
          // 小黃雞拍翅滑翔重力減緩 40%
          const gravity = (ani.id === 'chick' && player.vy > 0) ? 580 : 980;
          const maxFall = (ani.id === 'chick') ? 340 : 580;
          player.vy = Math.min(maxFall, player.vy + gravity * dt);

          // 穴兔失足二段跳救命機制（掉出階梯且下墜速度剛開始時，若按住方向鍵自動觸發一次小躍起）
          if (ani.id === 'rabbit' && player.canDoubleJump && player.vy > 210 && (input.left || input.right)) {
            player.canDoubleJump = false;
            player.vy = -265;
            playSound('spring');
            spawnParticles(player.x + 14, player.y + 28, '#f8fafc', 6);
            addPopup(player.x + 14, player.y, '🐰 二段跳！', '#f8fafc');
          }

          player.y += (player.vy * dt) - dy;
          const newFootY = player.y + player.h;

          if (player.vy >= 0) {
            for (const p of platforms) {
              if (p.broken) continue;
              const horizOverlap = (player.x + player.w - 4 > p.x) && (player.x + 4 < p.x + p.w);
              const relX = (player.x + player.w / 2) - (p.x + p.w / 2);
              const surfY = p.y + p.sagY + Math.sin(p.tilt) * relX;
              if (horizOverlap && prevFootY <= surfY + 14 && newFootY >= surfY - 2) {
                handleLanding(p, player.vy);
                break;
              }
            }
          }
        }

        // 頂部廢墟鋼筋鑽頭碰撞 (高度 22px)
        const ceilingSpikeH = 22;
        if (player.y <= ceilingSpikeH) {
          const dmg = ani.weight >= 2.1 ? 4 : 5;
          hurtPlayer(dmg, player.x + player.w / 2, ceilingSpikeH + 10, '⚙️ 頂部鋼筋 ');
          player.onPlatform = null;
          player.y = ceilingSpikeH + 5;
          player.vy = 190;
        }

        if (player.y > H + 35) {
          hp = 0;
          updateHUD();
          triggerGameOver('墜入東京地底無底深淵！');
        }

        // 更新震波、粒子與浮動文字
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.r += (sw.maxR - sw.r) * 10 * dt;
          sw.life -= dt;
          if (sw.life <= 0) shockwaves.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.vy += 300 * dt;
          pt.life -= dt;
          if (pt.life <= 0) particles.splice(i, 1);
        }

        for (let i = popups.length - 1; i >= 0; i--) {
          const pp = popups[i];
          pp.y -= 36 * dt;
          pp.life -= dt;
          if (pp.life <= 0) popups.splice(i, 1);
        }
      }

      // ================== 《東京叢林》末日廢墟美術渲染系統 ==================
      function drawTokyoJungleBackground() {
        // 隨深度變換環境色調
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        if (floor < 30) {
          grad.addColorStop(0, '#070b0e');
          grad.addColorStop(1, '#101b16');
        } else if (floor < 60) {
          grad.addColorStop(0, '#060b14');
          grad.addColorStop(1, '#0c1f24');
        } else {
          grad.addColorStop(0, '#130707');
          grad.addColorStop(1, '#230d08');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, LOGIC_W, H);

        // 頂部探照燈體積光束 (Volumetric Light Shafts)
        ctx.save();
        const beamGrad = ctx.createLinearGradient(LOGIC_W * 0.5, 0, LOGIC_W * 0.5, H * 0.75);
        beamGrad.addColorStop(0, 'rgba(163, 230, 53, 0.08)');
        beamGrad.addColorStop(1, 'rgba(163, 230, 53, 0)');
        ctx.fillStyle = beamGrad;
        ctx.beginPath();
        ctx.moveTo(LOGIC_W * 0.25, 0);
        ctx.lineTo(LOGIC_W * 0.75, 0);
        ctx.lineTo(LOGIC_W * 0.95, H * 0.75);
        ctx.lineTo(LOGIC_W * 0.05, H * 0.75);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 遠景廢棄地鐵拱門與鋼骨剪影
        const bgScroll = (scrollDistance * 0.35) % 180;
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.45)';
        ctx.lineWidth = 3;
        for (let y = -bgScroll; y < H + 180; y += 180) {
          // 橫向廢墟鋼架
          ctx.fillStyle = 'rgba(15, 23, 30, 0.55)';
          ctx.fillRect(14, y, LOGIC_W - 28, 12);

          // 閃爍殘破霓虹招牌 (SHIBUYA / 非常口)
          const flicker = Math.sin(Date.now() * 0.01 + y) > -0.6 ? 0.22 : 0.05;
          ctx.save();
          ctx.strokeStyle = `rgba(132, 204, 22, ${flicker})`;
          ctx.fillStyle = `rgba(132, 204, 22, ${flicker})`;
          ctx.lineWidth = 1.5;
          ctx.strokeRect(LOGIC_W / 2 - 58, y + 36, 116, 26);
          ctx.font = '900 11px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('SHIBUYA UNDERGROUND', LOGIC_W / 2, y + 53);
          ctx.restore();
        }

        // 巨型地下樓層噴漆字樣
        ctx.save();
        ctx.fillStyle = 'rgba(148, 163, 184, 0.08)';
        ctx.font = '900 74px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(formatFloor(floor), LOGIC_W / 2, H * 0.46);
        ctx.restore();

        // 漂浮森林孢子微粒
        for (const sp of spores) {
          ctx.fillStyle = floor >= 60 ? `rgba(251, 146, 60, ${sp.alpha})` : `rgba(190, 242, 100, ${sp.alpha})`;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 兩側水泥斷垣與攀附野生藤蔓
        const wallW = 13;
        ctx.fillStyle = '#141c24';
        ctx.fillRect(0, 0, wallW, H);
        ctx.fillRect(LOGIC_W - wallW, 0, wallW, H);

        for (let y = -wallOffset; y < H; y += 18) {
          ctx.strokeStyle = '#263238';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(1, y, wallW - 2, 18);
          ctx.strokeRect(LOGIC_W - wallW + 1, y, wallW - 2, 18);

          // 野生藤蔓與青苔叢
          ctx.fillStyle = '#365314';
          ctx.beginPath();
          ctx.arc(wallW, y + 9, 4 + Math.sin(y * 0.1) * 2, 0, Math.PI * 2);
          ctx.arc(LOGIC_W - wallW, y + 9, 4 + Math.cos(y * 0.1) * 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawCeilingSpikes() {
        // 廢墟隧道頂部生鏽鋼樑與旋轉鑽頭尖刺
        ctx.fillStyle = '#1c1917';
        ctx.fillRect(0, 0, LOGIC_W, 8);

        const spikeW = 18;
        const spikeH = 22;
        for (let x = 12; x < LOGIC_W - 12; x += spikeW) {
          const grad = ctx.createLinearGradient(x, 6, x + spikeW, spikeH);
          grad.addColorStop(0, '#57534e');
          grad.addColorStop(0.6, '#a8a29e');
          grad.addColorStop(1, '#991b1b');
          ctx.fillStyle = grad;

          ctx.beginPath();
          ctx.moveTo(x, 6);
          ctx.lineTo(x + spikeW / 2, spikeH);
          ctx.lineTo(x + spikeW, 6);
          ctx.closePath();
          ctx.fill();
        }
      }

      // ================== 繪製 10 種《東京叢林》廢墟階梯（含重量傾斜與下沉） ==================
      function drawPlatforms() {
        const electricCycle = (Date.now() % 1800) < 480;

        for (const p of platforms) {
          if (p.y < -35 || p.y > H + 35) continue;
          ctx.save();

          const cx = p.x + p.w / 2;
          const cy = p.y + p.sagY + p.h / 2;

          // 如果是懸吊招牌，畫出上方懸吊鐵鍊
          if (p.type === 'seesaw') {
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.setLineDash([3, 2]);
            ctx.beginPath();
            ctx.moveTo(cx, cy - 26);
            ctx.lineTo(cx, cy);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          ctx.translate(cx, cy);
          ctx.rotate(p.tilt);

          const hw = p.w / 2;
          const hh = p.h / 2;

          if (p.type === 'steel') {
            // 🔩 生鏽 H 型鋼樑（超載時閃紅光抖動）
            const overloadShake = p.overloadTimer > 0 ? (Math.random() - 0.5) * 4 : 0;
            ctx.fillStyle = p.overloadTimer > 0 ? '#7c2d12' : '#334155';
            ctx.fillRect(-hw + overloadShake, -hh, p.w, p.h);
            ctx.fillStyle = p.overloadTimer > 0 ? '#f97316' : '#64748b';
            ctx.fillRect(-hw + overloadShake, -hh, p.w, 3);
            ctx.fillRect(-hw + overloadShake, hh - 3, p.w, 3);
            // 鋼樑鉚釘與鐵鏽斑塊
            ctx.fillStyle = '#9a3412';
            for (let rx = -hw + 8; rx < hw - 6; rx += 16) {
              ctx.fillRect(rx + overloadShake, -2, 6, 4);
            }
          } else if (p.type === 'seesaw') {
            // ⚖️ 懸吊搖晃澀谷霓虹招牌
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-hw, -hh, p.w, p.h);
            ctx.strokeStyle = '#a3e635';
            ctx.lineWidth = 2;
            ctx.strokeRect(-hw, -hh, p.w, p.h);
            // 中央軸心
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.type === 'wood') {
            // 🪵 腐朽神社木板
            const shakeX = p.touched && !p.broken ? (Math.random() - 0.5) * 4 : 0;
            ctx.fillStyle = '#78350f';
            ctx.fillRect(-hw + shakeX, -hh, p.w, p.h);
            ctx.fillStyle = '#92400e';
            ctx.fillRect(-hw + shakeX, -hh, p.w, 3);
            // 斷裂木紋
            ctx.strokeStyle = '#271206';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-12 + shakeX, -hh);
            ctx.lineTo(-4 + shakeX, hh);
            ctx.moveTo(15 + shakeX, -hh);
            ctx.lineTo(8 + shakeX, hh);
            ctx.stroke();
          } else if (p.type === 'taxi') {
            // 🚗 報廢東京計程車頂
            const comp = p.springCompress * 5;
            ctx.fillStyle = '#15803d';
            ctx.beginPath();
            ctx.roundRect(-hw, -hh + comp, p.w, p.h, 5);
            ctx.fill();
            // 計程車頂燈與黃色條紋
            ctx.fillStyle = '#facc15';
            ctx.fillRect(-hw + 4, -2 + comp, p.w - 8, 4);
            ctx.fillStyle = '#fef08a';
            ctx.fillRect(-10, -hh - 5 + comp, 20, 5);
          } else if (p.type === 'moss') {
            // 🌿 青苔水泥斷橋
            ctx.fillStyle = '#475569';
            ctx.fillRect(-hw, -hh, p.w, p.h);
            ctx.fillStyle = '#65a30d';
            ctx.fillRect(-hw, -hh, p.w, 5);
            for (let mx = -hw + 6; mx < hw - 6; mx += 12) {
              ctx.beginPath();
              ctx.arc(mx, -hh + 4, 4, 0, Math.PI * 2);
              ctx.fill();
            }
          } else if (p.type === 'conveyor_l' || p.type === 'conveyor_r') {
            // 🚇 廢棄電動步道
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.roundRect(-hw, -hh, p.w, p.h, 6);
            ctx.fill();
            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2;
            const dir = p.type === 'conveyor_r' ? 1 : -1;
            const shift = dir * (conveyorAnim - 8);
            for (let ax = -hw + 12; ax < hw - 10; ax += 16) {
              const drawX = ax + shift * 0.5;
              ctx.beginPath();
              ctx.moveTo(drawX - 3 * dir, -4);
              ctx.lineTo(drawX + 3 * dir, 0);
              ctx.lineTo(drawX - 3 * dir, 4);
              ctx.stroke();
            }
          } else if (p.type === 'barbed') {
            // 🩸 帶刺鐵絲網路障
            ctx.fillStyle = '#451a03';
            ctx.fillRect(-hw, -hh + 4, p.w, p.h - 4);
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1.5;
            for (let sx = -hw + 4; sx < hw - 6; sx += 10) {
              ctx.beginPath();
              ctx.moveTo(sx, -hh + 4);
              ctx.lineTo(sx + 5, -hh - 6);
              ctx.lineTo(sx + 10, -hh + 4);
              ctx.stroke();
            }
          } else if (p.type === 'electric') {
            // ⚡ 漏電變電箱平台
            ctx.fillStyle = electricCycle ? '#0284c7' : '#1e293b';
            ctx.fillRect(-hw, -hh, p.w, p.h);
            ctx.strokeStyle = electricCycle ? '#e0f2fe' : '#38bdf8';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-hw, -hh, p.w, p.h);

            if (electricCycle) {
              ctx.strokeStyle = '#7dd3fc';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(-hw, -hh - 3);
              for (let ex = -hw + 12; ex <= hw; ex += 12) {
                ctx.lineTo(ex, -hh - 2 + (Math.random() - 0.5) * 10);
              }
              ctx.stroke();
            }
          } else if (p.type === 'slanted_l' || p.type === 'slanted_r') {
            // 🛢️ 傾斜毒液鐵桶架
            ctx.fillStyle = '#3f3f46';
            ctx.fillRect(-hw, -hh, p.w, p.h);
            ctx.fillStyle = '#a3e635';
            ctx.fillRect(-hw, -hh, p.w, 3);
          } else if (p.type === 'supply') {
            // 🥩 東京空投補給箱平台
            ctx.fillStyle = '#365314';
            ctx.fillRect(-hw, -hh, p.w, p.h);
            if (p.crateIntact) {
              ctx.fillStyle = '#eab308';
              ctx.fillRect(-14, -hh - 18, 28, 18);
              ctx.strokeStyle = '#713f12';
              ctx.lineWidth = 2;
              ctx.strokeRect(-14, -hh - 18, 28, 18);
              ctx.fillStyle = '#713f12';
              ctx.font = '900 11px system-ui';
              ctx.textAlign = 'center';
              ctx.fillText('🥩', 0, -hh - 5);
            }
          }

          ctx.restore();
        }
      }

      // ================== 12 種動物寫實剪影與皮毛特徵繪製 ==================
      function drawAnimalCharacter(x, y, facing, walkFrame, animalId, name, hpVal, alpha = 1, isLocal = false, isAdrenaline = false) {
        const ani = ANIMAL_MAP[animalId] || ANIMALS[0];
        ctx.save();
        ctx.globalAlpha = alpha;

        const w = 28;
        const h = 30;
        const cx = x + w / 2;
        const cy = y + h / 2;

        // 頭頂名稱與體重標籤
        ctx.font = '800 11px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = isLocal ? '#a3e635' : '#e2e8f0';
        ctx.fillText(`${name}`, cx, y - 10);

        // 頭頂迷你血條
        const barW = 26;
        ctx.fillStyle = 'rgba(5, 7, 10, 0.85)';
        ctx.fillRect(cx - barW / 2, y - 6, barW, 3.5);
        ctx.fillStyle = hpVal > 4 ? '#84cc16' : '#ef4444';
        ctx.fillRect(cx - barW / 2, y - 6, Math.max(0, (hpVal / MAX_HP) * barW), 3.5);

        ctx.translate(cx, cy);
        ctx.scale(facing || 1, 1);

        // 體型縮放（根據動物體重呈現視覺大小差異！）
        const sizeScale = Math.max(0.84, Math.min(1.26, 0.8 + ani.weight * 0.18));
        ctx.scale(sizeScale, sizeScale);

        if (isAdrenaline) {
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 12;
        }

        const swing = Math.sin(walkFrame || 0) * 3.5;

        // 四肢奔跑動態
        ctx.fillStyle = ani.furSecondary;
        ctx.fillRect(-9 + swing, 8, 4, 6);
        ctx.fillRect(-3 - swing, 8, 4, 6);
        ctx.fillStyle = ani.furPrimary;
        ctx.fillRect(3 + swing, 8, 4, 6);
        ctx.fillRect(7 - swing, 8, 4, 6);

        // 身體軀幹（背光輪廓與皮毛色）
        ctx.fillStyle = ani.furPrimary;
        ctx.beginPath();
        ctx.roundRect(-11, -3, 21, 13, 6);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // 依據不同動物繪製專屬部位（耳朵、角、象鼻、斑紋、尾巴）
        if (animalId === 'elephant') {
          // 巨象：大耳、長鼻、白色象牙
          ctx.fillStyle = ani.furPrimary;
          ctx.beginPath();
          ctx.arc(7, -5, 8, 0, Math.PI * 2);
          ctx.fill();
          // 象耳
          ctx.fillStyle = '#64748b';
          ctx.beginPath();
          ctx.ellipse(2, -4, 5, 7, -0.2, 0, Math.PI * 2);
          ctx.fill();
          // 象鼻與象牙
          ctx.strokeStyle = ani.furPrimary;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(13, -4);
          ctx.quadraticCurveTo(19, 2, 15, 7);
          ctx.stroke();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(11, -1);
          ctx.lineTo(17, -3);
          ctx.stroke();
        } else if (animalId === 'deer') {
          // 梅花鹿：修長頸部與分叉鹿角 + 白色梅花斑點
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-6, 1, 2, 2);
          ctx.fillRect(-1, 3, 2, 2);
          ctx.fillStyle = ani.furPrimary;
          ctx.beginPath();
          ctx.roundRect(4, -10, 9, 9, 4);
          ctx.fill();
          // 鹿角
          ctx.strokeStyle = '#fef3c7';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(7, -10);
          ctx.lineTo(5, -17);
          ctx.moveTo(6, -14);
          ctx.lineTo(10, -16);
          ctx.stroke();
        } else if (animalId === 'rabbit') {
          // 穴兔：長耳朵與圓白尾
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-12, 3, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = ani.furPrimary;
          ctx.beginPath();
          ctx.arc(6, -5, 6.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(4, -14, 2.5, 6, -0.25, 0, Math.PI * 2);
          ctx.ellipse(8, -14, 2.5, 6, -0.1, 0, Math.PI * 2);
          ctx.fill();
        } else if (animalId === 'boar') {
          // 荒原野豬：背鬃與上彎白色獠牙
          ctx.fillStyle = ani.furPrimary;
          ctx.beginPath();
          ctx.roundRect(3, -7, 11, 11, 4);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(12, 1);
          ctx.lineTo(16, -4);
          ctx.stroke();
        } else if (animalId === 'panda') {
          // 大熊貓：黑白拼接、黑眼圈與圓耳
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(-2, -3, 7, 12);
          ctx.beginPath();
          ctx.arc(4, -11, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.arc(7, -5, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(10, -5, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (animalId === 'croc') {
          // 灣鱷：修長鋸齒背甲與長顎
          ctx.fillStyle = ani.furPrimary;
          ctx.fillRect(4, -5, 14, 7);
          ctx.fillStyle = '#f8fafc';
          ctx.fillRect(8, 1, 8, 2);
          ctx.fillStyle = ani.furSecondary;
          for (let sx = -10; sx <= 2; sx += 4) {
            ctx.fillRect(sx, -6, 3, 3);
          }
        } else {
          // 博美犬、街貓、小雞、花豹、牛蛙、河馬頭部與耳朵/尾巴
          ctx.fillStyle = ani.furPrimary;
          ctx.beginPath();
          ctx.arc(7, -5, 7, 0, Math.PI * 2);
          ctx.fill();

          if (animalId === 'cat' || animalId === 'pomeranian') {
            // 尖耳與翹尾
            ctx.beginPath();
            ctx.moveTo(3, -10);
            ctx.lineTo(5, -15);
            ctx.lineTo(8, -11);
            ctx.moveTo(8, -11);
            ctx.lineTo(11, -15);
            ctx.lineTo(12, -9);
            ctx.fill();

            ctx.strokeStyle = ani.furPrimary;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-10, 0);
            ctx.quadraticCurveTo(-16, -6, -13, -12);
            ctx.stroke();
          } else if (animalId === 'leopard') {
            // 花豹黑斑與長尾
            ctx.fillStyle = '#422006';
            ctx.fillRect(-6, 0, 3, 3);
            ctx.fillRect(0, 2, 3, 3);
            ctx.strokeStyle = ani.furPrimary;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-10, 1);
            ctx.quadraticCurveTo(-17, -3, -15, -9);
            ctx.stroke();
          } else if (animalId === 'chick') {
            // 小黃雞橘色鳥喙
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.moveTo(13, -6);
            ctx.lineTo(18, -4);
            ctx.lineTo(13, -2);
            ctx.fill();
          }
        }

        // 野生發光眼睛
        ctx.fillStyle = ani.eyeColor;
        ctx.beginPath();
        ctx.arc(10, -6, 1.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawRemotePlayers() {
        for (const rp of peers.values()) {
          if (!rp.alive) continue;
          const screenY = rp.worldY - scrollDistance;
          const ani = ANIMAL_MAP[rp.animalId] || ANIMALS[0];

          if (screenY > -40 && screenY < H + 40) {
            drawAnimalCharacter(rp.x, screenY, rp.facing, Date.now() * 0.012, rp.animalId, rp.name, rp.hp, 0.88, false, false);
          } else {
            ctx.save();
            const clampedY = Math.max(30, Math.min(H - 22, screenY));
            const cx = Math.max(35, Math.min(LOGIC_W - 35, rp.x + 14));
            ctx.fillStyle = '#a3e635';
            ctx.font = '800 11px system-ui, sans-serif';
            ctx.textAlign = 'center';
            const arrow = screenY < 0 ? '▲' : '▼';
            ctx.fillText(`${arrow} ${ani.emoji}${rp.name} (B${rp.floor})`, cx, clampedY);
            ctx.restore();
          }
        }
      }

      function drawEffects() {
        // 震波圓環
        for (const sw of shockwaves) {
          ctx.save();
          ctx.strokeStyle = `rgba(250, 204, 21, ${sw.life * 2.5})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(sw.x, sw.y, sw.r, sw.r * 0.35, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        for (const pt of particles) {
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = Math.max(0, pt.life * 2);
          ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
        }
        ctx.globalAlpha = 1;

        for (const pp of popups) {
          ctx.save();
          ctx.font = '900 13px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.globalAlpha = Math.max(0, pp.life / pp.maxLife);
          ctx.fillStyle = '#000000';
          ctx.fillText(pp.text, pp.x + 1, pp.y + 1);
          ctx.fillStyle = pp.color;
          ctx.fillText(pp.text, pp.x, pp.y);
          ctx.restore();
        }
      }

      function render() {
        ctx.save();
        if (shakeTime > 0) {
          const dx = (Math.random() - 0.5) * 9;
          const dy = (Math.random() - 0.5) * 9;
          ctx.translate(dx, dy);
        }

        drawTokyoJungleBackground();
        drawPlatforms();
        drawRemotePlayers();

        if (!(player.invulnerable > 0 && Math.floor(player.invulnerable * 20) % 2 === 0)) {
          drawAnimalCharacter(
            player.x,
            player.y,
            player.facing,
            player.walkFrame,
            myAnimalId,
            myName,
            hp,
            1,
            true,
            player.adrenalineTimer > 0
          );
        }

        drawCeilingSpikes();
        drawEffects();

        ctx.restore();
      }

      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      updateHUD();
      renderRoster();
      connectMultiplayer();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
