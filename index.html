<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#14181d" />
  <title>TOKYO JUNGLE × 台灣原生猛獸：18動物多人連線版</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0d1014;
      color: #18181b;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Noto Serif TC', 'Noto Sans TC', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100%;
      max-height: 940px;
      display: flex;
      flex-direction: column;
      background: #cfd6df;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
      overflow: hidden;
      border-left: 1px solid #334155;
      border-right: 1px solid #334155;
    }

    /* 頂部寫實荒野風 HUD */
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: linear-gradient(180deg, #181c22 0%, #0f1217 100%);
      border-bottom: 2px solid #3f3f46;
      z-index: 10;
      gap: 6px;
      color: #f4f4f5;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .hp-label {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #d4d4d8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hp-bar {
      display: flex;
      gap: 2px;
      background: #090b0e;
      padding: 3px;
      border-radius: 3px;
      border: 1px solid #52525b;
    }

    .hp-unit {
      width: 8px;
      height: 11px;
      background: #27272a;
      transition: background-color 0.15s ease;
    }

    .hp-unit.active {
      background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%);
      box-shadow: 0 0 4px rgba(245, 158, 11, 0.6);
    }

    .hp-unit.danger {
      background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%);
      box-shadow: 0 0 5px rgba(239, 68, 68, 0.85);
    }

    .hud-center {
      text-align: center;
      background: #090b0e;
      padding: 2px 10px;
      border-radius: 4px;
      border: 1px solid #52525b;
      min-width: 108px;
    }

    .floor-title {
      font-size: 12px;
      color: #d97706;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .floor-num {
      font-size: 18px;
      font-weight: 900;
      font-family: Georgia, 'Times New Roman', serif;
      font-variant-numeric: tabular-nums;
      color: #fafafa;
      letter-spacing: 1px;
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 5px;
      border: 1px solid #52525b;
      background: #27272a;
      color: #f4f4f5;
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: #3f3f46;
    }

    /* 多人即時生存條 */
    .mp-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      background: #14171c;
      border-bottom: 1px solid #27272a;
      font-size: 12px;
      z-index: 9;
      gap: 6px;
      min-height: 27px;
      color: #e4e4e7;
    }

    .mp-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      color: #d4d4d8;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #52525b;
    }

    .dot.online {
      background: #f59e0b;
      box-shadow: 0 0 6px #f59e0b;
    }

    .mp-players-strip {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .mp-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 3px;
      background: #27272a;
      border: 1px solid #3f3f46;
      font-size: 12px;
      font-weight: 700;
      color: #f4f4f5;
      white-space: nowrap;
    }

    .mp-chip.dead {
      opacity: 0.4;
      text-decoration: line-through;
    }

    /* 畫布區 */
    .canvas-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background: #d8dee8;
      touch-action: none;
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 野性呼喊快捷列 */
    .emote-bar {
      position: absolute;
      right: 8px;
      bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 12;
    }

    .emote-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(39, 39, 42, 0.55);
      background: rgba(24, 24, 27, 0.78);
      color: #fafafa;
      font-size: 12px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .emote-btn:active {
      transform: scale(0.86);
      background: rgba(217, 119, 6, 0.85);
    }

    /* 底部手機觸控控制器 */
    .controls {
      height: 96px;
      background: linear-gradient(0deg, #090b0e 0%, #181c22 100%);
      border-top: 2px solid #3f3f46;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
      touch-action: none;
    }

    .ctrl-btn {
      position: relative;
      border-radius: 8px;
      border: 2px solid #52525b;
      background: linear-gradient(180deg, #27272a 0%, #18181b 100%);
      color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 4px 0 #09090b, inset 0 1px 0 rgba(255, 255, 255, 0.12);
      cursor: pointer;
    }

    .ctrl-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #09090b;
      border-color: #f59e0b;
      background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
      color: #fef3c7;
    }

    .ctrl-arrow {
      font-size: 22px;
      line-height: 1;
    }

    /* ============== 《TOKYO JUNGLE》蒼白迷霧寫實風 18 動物選角大廳 ============== */
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, rgba(248, 250, 252, 0.96) 0%, rgba(212, 220, 232, 0.96) 60%, rgba(168, 179, 194, 0.97) 100%);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 7px 10px;
      z-index: 20;
      overflow-y: auto;
      color: #18181b;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 416px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: auto 0;
    }

    .header-banner {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid #18181b;
      padding-bottom: 3px;
    }

    .title {
      font-size: 20px;
      font-weight: 900;
      font-family: Georgia, 'Times New Roman', serif;
      color: #09090b;
      letter-spacing: 0.5px;
    }

    .badge {
      padding: 2px 7px;
      background: #18181b;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    /* 選中角色超大動態展示舞台 (Large Spotlight Showcase) */
    .showcase-stage {
      position: relative;
      width: 100%;
      height: 162px;
      background: radial-gradient(ellipse at 45% 55%, #ffffff 0%, #e2e8f0 65%, #cbd5e1 100%);
      border: 2px solid #18181b;
      border-radius: 8px;
      box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.14), 0 6px 16px rgba(0, 0, 0, 0.16);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      cursor: pointer;
    }

    .showcase-canvas-wrap {
      position: relative;
      width: 54%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#previewCanvas {
      width: 205px;
      height: 152px;
      display: block;
    }

    .showcase-rank-num {
      position: absolute;
      left: 6px;
      bottom: -8px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 64px;
      font-weight: 900;
      color: rgba(15, 23, 42, 0.13);
      line-height: 1;
      pointer-events: none;
    }

    .posture-pill {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(9, 9, 11, 0.84);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 3px;
      pointer-events: none;
    }

    .tw-pill {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #15803d;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 3px;
      pointer-events: none;
    }

    .showcase-info {
      width: 46%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
      z-index: 2;
      padding-left: 8px;
      border-left: 1.5px solid rgba(24, 24, 27, 0.15);
    }

    .showcase-name {
      font-size: 18px;
      font-weight: 900;
      color: #09090b;
      line-height: 1.15;
    }

    .showcase-en {
      font-size: 12px;
      font-weight: 800;
      color: #52525b;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-bars {
      display: flex;
      flex-direction: column;
      gap: 2.5px;
      margin-bottom: 5px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 800;
      color: #27272a;
    }

    .stat-track {
      flex: 1;
      height: 6px;
      background: #cbd5e1;
      border: 1px solid #475569;
      overflow: hidden;
    }

    .stat-fill {
      height: 100%;
      background: linear-gradient(90deg, #b45309 0%, #d97706 100%);
      transition: width 0.25s ease;
    }

    .showcase-desc {
      font-size: 12px;
      color: #18181b;
      font-weight: 700;
      line-height: 1.28;
      background: rgba(255, 255, 255, 0.78);
      padding: 4px 6px;
      border-left: 3px solid #b45309;
    }

    /* 兩小排 18 動物橫向滑動/換頁選角列 (2 Rows × 9 Columns，選中時放大凸起！) */
    .roster-section-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 900;
      color: #27272a;
      padding: 0 2px;
    }

    .animal-grid-scroll-wrap {
      position: relative;
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      padding: 9px 6px;
      margin: -3px 0;
      scrollbar-width: thin;
      scrollbar-color: #78350f #cbd5e1;
      -webkit-overflow-scrolling: touch;
    }

    .animal-grid-2rows {
      display: grid;
      grid-template-rows: repeat(2, 60px);
      grid-auto-flow: column;
      grid-auto-columns: 64px;
      gap: 6px;
      width: max-content;
    }

    .animal-cell {
      position: relative;
      background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 100%);
      border: 1.5px solid #52525b;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 3px;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s ease, border-color 0.15s ease, background 0.15s ease;
      overflow: visible;
    }

    .animal-cell canvas {
      width: 52px;
      height: 40px;
      display: block;
      pointer-events: none;
      transition: transform 0.18s ease;
    }

    .animal-cell-tw {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #15803d;
      box-shadow: 0 0 3px rgba(21, 128, 61, 0.8);
    }

    .animal-cell-name {
      font-size: 12px;
      font-weight: 900;
      color: #18181b;
      line-height: 1;
      white-space: nowrap;
      transform: scale(0.88);
    }

    /* 選到時明顯變大凸起！ */
    .animal-cell.selected {
      transform: scale(1.24) translateY(-3px);
      z-index: 15;
      background: radial-gradient(circle at 50% 40%, #ffffff 0%, #fef3c7 100%);
      border: 2.5px solid #b45309;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45), 0 0 0 2px #f59e0b;
    }

    .animal-cell.selected canvas {
      transform: scale(1.16) translateY(-2px);
    }

    .animal-cell.selected .animal-cell-name {
      color: #92400e;
      transform: scale(0.96);
    }

    /* 多人連線設定盒 */
    .mp-box {
      background: rgba(24, 24, 27, 0.92);
      border: 1.5px solid #18181b;
      border-radius: 8px;
      padding: 7px 10px;
      color: #f4f4f5;
      text-align: left;
    }

    .mp-row {
      display: flex;
      gap: 6px;
      margin-bottom: 5px;
      align-items: center;
    }

    .mp-input {
      flex: 1;
      min-width: 0;
      background: #27272a;
      border: 1px solid #52525b;
      color: #fafafa;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 800;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .mp-input:focus {
      border-color: #f59e0b;
    }

    .mp-btn {
      padding: 5px 9px;
      border-radius: 4px;
      border: 1px solid #f59e0b;
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .mp-btn.share {
      border-color: #e4e4e7;
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }

    .room-roster {
      font-size: 12px;
      color: #d4d4d8;
      padding-top: 4px;
      border-top: 1px dashed #3f3f46;
    }

    .roster-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 3px;
    }

    .roster-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border-radius: 3px;
      background: #27272a;
      border: 1px solid #52525b;
      font-size: 12px;
      font-weight: 700;
      color: #f4f4f5;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 8px;
    }

    .primary-btn {
      width: 100%;
      padding: 10px 10px;
      border-radius: 6px;
      border: 2px solid #09090b;
      background: linear-gradient(180deg, #d97706 0%, #92400e 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 0 #09090b;
    }

    .primary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #09090b;
    }

    .secondary-btn {
      width: 100%;
      padding: 10px 10px;
      border-radius: 6px;
      border: 2px solid #09090b;
      background: #27272a;
      color: #fafafa;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #09090b;
    }

    .secondary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #09090b;
    }

    .toast {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: #18181b;
      border: 1.5px solid #f59e0b;
      color: #fafafa;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 800;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="toast" id="toast">已複製房間邀請連結！</div>

    <!-- 頂部狀態列 -->
    <div class="hud">
      <div class="hud-left">
        <div class="hp-label">
          <span id="hudAnimalLabel">台灣黑熊</span>
          <span id="hpText" style="color:#f59e0b;">12/12</span>
        </div>
        <div class="hp-bar" id="hpBar"></div>
      </div>

      <div class="hud-center">
        <div class="floor-title" id="zoneLabel">澀谷白霧豎井</div>
        <div class="floor-num" id="floorText">B0000</div>
      </div>

      <div class="hud-right">
        <button class="icon-btn" id="soundBtn" title="音效開關">音</button>
        <button class="icon-btn" id="pauseBtn" title="18猛獸圖鑑與房間">獸</button>
      </div>
    </div>

    <!-- 多人連線狀態條 -->
    <div class="mp-bar">
      <div class="mp-status">
        <span class="dot" id="netDot"></span>
        <span id="roomLabel">區域: ----</span>
      </div>
      <div class="mp-players-strip" id="mpStrip"></div>
    </div>

    <!-- 遊戲畫布 -->
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="gameCanvas"></canvas>

      <!-- 野性呼喊互動鈕 -->
      <div class="emote-bar">
        <button class="emote-btn" data-emote="咆哮!">吼</button>
        <button class="emote-btn" data-emote="獵殺!">爪</button>
        <button class="emote-btn" data-emote="小心!">危</button>
        <button class="emote-btn" data-emote="霸主!">王</button>
      </div>

      <!-- 《TOKYO JUNGLE》18 種寫實動物選角大廳 -->
      <div class="overlay" id="overlay">
        <div class="card">
          <div class="header-banner">
            <div class="title" id="overlayTitle">TOKYO JUNGLE · 18 猛獸</div>
            <div class="badge" id="overlayBadge">含 9 大台灣原生特有種</div>
          </div>

          <!-- 選中角色超大寫實動態預覽舞台 -->
          <div class="showcase-stage" id="showcaseStage" title="點擊可觸發猛獸招牌動作">
            <div class="showcase-rank-num" id="showcaseNum">01</div>
            <div class="showcase-canvas-wrap">
              <div class="posture-pill" id="posturePill">雙足直立咆哮站姿</div>
              <div class="tw-pill" id="twPill">台灣特有</div>
              <canvas id="previewCanvas" width="410" height="304"></canvas>
            </div>
            <div class="showcase-info">
              <div class="showcase-name" id="detailTitle">台灣黑熊</div>
              <div class="showcase-en" id="detailEn">FORMOSAN BEAR · 1.85t (1.28x)</div>
              <div class="stat-bars">
                <div class="stat-row">
                  <span>噸位</span>
                  <div class="stat-track"><div class="stat-fill" id="barWeight" style="width:80%;"></div></div>
                </div>
                <div class="stat-row">
                  <span>敏捷</span>
                  <div class="stat-track"><div class="stat-fill" id="barSpeed" style="width:76%;"></div></div>
                </div>
                <div class="stat-row">
                  <span>衝撞</span>
                  <div class="stat-track"><div class="stat-fill" id="barPush" style="width:92%;"></div></div>
                </div>
              </div>
              <div class="showcase-desc" id="detailDesc">【月牙霸體】雙足直立揮掌推力 1.75x；體力低於 4 格時激發狂暴加速與抗撞！</div>
            </div>
          </div>

          <!-- 兩小排選角列 (2排 × 9格 = 18隻，左右滑動點選，選中時放大凸起！) -->

      // ================== 5 大真實解剖姿態與體型比例繪製引擎 ==================
      function drawAuthenticAnimal(targetCtx, animalId, cx, cy, baseScale, facing, phase, leapPitch = 0) {
        const ani = ANIMAL_MAP[animalId] || ANIMALS[0];
        targetCtx.save();
        targetCtx.translate(cx, cy);
        const s = baseScale * ani.sizeScale;
        targetCtx.scale((facing || 1) * s, s);
        targetCtx.rotate(leapPitch);

        const stride = Math.sin(phase);
        const cosStride = Math.cos(phase);

        const bodyGrad = targetCtx.createLinearGradient(0, -18, 0, 14);
        bodyGrad.addColorStop(0, ani.cLight);
        bodyGrad.addColorStop(0.55, ani.cMid);
        bodyGrad.addColorStop(1, ani.cDark);

        // 地面真實投影
        targetCtx.fillStyle = 'rgba(15, 23, 42, 0.22)';
        targetCtx.beginPath();
        targetCtx.ellipse(0, 15, ani.posture === 'colossal' ? 18 : 13, 3.2, 0, 0, Math.PI * 2);
        targetCtx.fill();

        // ------------------------------------------------------------------
        // 姿態 1：雙足直立熊科站姿 (台灣黑熊 / 野生大熊貓)
        // ------------------------------------------------------------------
        if (ani.posture === 'bipedal_bear') {
          const isPanda = ani.id === 'panda';
          const sway = Math.sin(phase * 0.8) * 1.5;

          targetCtx.fillStyle = '#09090b';
          targetCtx.beginPath();
          targetCtx.roundRect(-8 + stride * 2, 4, 6.2, 11.5, 3);
          targetCtx.roundRect(2 - stride * 2, 4, 6.2, 11.5, 3);
          targetCtx.fill();

          targetCtx.fillStyle = isPanda ? '#f8fafc' : bodyGrad;
          targetCtx.beginPath();
          targetCtx.ellipse(0, -3 + sway * 0.3, 10, 13, -0.1, 0, Math.PI * 2);
          targetCtx.fill();

          if (isPanda) {
            targetCtx.fillStyle = '#09090b';
            targetCtx.beginPath();
            targetCtx.ellipse(1, -8, 9.6, 5.2, -0.1, 0, Math.PI * 2);
            targetCtx.fill();
          } else {
            // 台灣黑熊招牌：胸前清晰白色 V 字型月牙斑紋
            targetCtx.strokeStyle = '#ffffff';
            targetCtx.lineWidth = 2.6;
            targetCtx.lineCap = 'round';
            targetCtx.beginPath();
            targetCtx.moveTo(-2, -9);
            targetCtx.lineTo(3, -4);
            targetCtx.lineTo(7, -9);
            targetCtx.stroke();
          }

          // 張開揮擊的雙前臂與熊掌
          targetCtx.strokeStyle = '#09090b';
          targetCtx.lineWidth = 5.2;
          targetCtx.lineCap = 'round';
          targetCtx.beginPath();
          targetCtx.moveTo(-6, -8);
          targetCtx.quadraticCurveTo(-13, -12 + stride * 3, -10, -17 + stride * 3);
          targetCtx.moveTo(6, -7);
          targetCtx.quadraticCurveTo(14, -9 - stride * 3, 16, -13 - stride * 3);
          targetCtx.stroke();

          targetCtx.strokeStyle = '#e2e8f0';
          targetCtx.lineWidth = 1.1;
          targetCtx.beginPath();
          targetCtx.moveTo(16, -14 - stride * 3); targetCtx.lineTo(19, -13 - stride * 3);
          targetCtx.moveTo(16, -12 - stride * 3); targetCtx.lineTo(19, -11 - stride * 3);
          targetCtx.stroke();

          targetCtx.fillStyle = '#09090b';
          targetCtx.beginPath();
          targetCtx.arc(-4, -21, 3.2, 0, Math.PI * 2);
          targetCtx.arc(5, -21, 3.2, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.fillStyle = isPanda ? '#ffffff' : bodyGrad;
          targetCtx.beginPath();
          targetCtx.arc(1, -15.5, 7.2, 0, Math.PI * 2);
          targetCtx.fill();

          if (isPanda) {
            targetCtx.fillStyle = '#09090b';
            targetCtx.beginPath();
            targetCtx.ellipse(4.5, -16, 2.5, 1.9, 0.3, 0, Math.PI * 2);
            targetCtx.fill();
            targetCtx.fillStyle = '#ffffff';
            targetCtx.beginPath();
            targetCtx.arc(5, -16.3, 0.8, 0, Math.PI * 2);
            targetCtx.fill();
          } else {
            targetCtx.fillStyle = '#78350f';
            targetCtx.beginPath();
            targetCtx.ellipse(6.2, -14, 3.8, 2.8, 0, 0, Math.PI * 2);
            targetCtx.fill();
            targetCtx.fillStyle = '#991b1b';
            targetCtx.fillRect(5.8, -13, 3.8, 1.8);
            targetCtx.fillStyle = '#fef08a';
            targetCtx.beginPath();
            targetCtx.arc(4, -17, 1.2, 0, Math.PI * 2);
            targetCtx.fill();
          }

          targetCtx.restore();
          return;

          const flap = Math.sin(phase * 1.4) * 10.5;

          targetCtx.fillStyle = ani.cDark;
          targetCtx.beginPath();
          targetCtx.moveTo(-2, -3);
          targetCtx.quadraticCurveTo(-12, -19 - flap * 0.6, -23, -14 - flap);
          targetCtx.lineTo(-10, 2);
          targetCtx.closePath();
          targetCtx.fill();

          if (ani.id === 'tw_magpie') {
            const wave = Math.sin(phase * 1.2) * 4.5;
            targetCtx.strokeStyle = '#1d4ed8';
            targetCtx.lineWidth = 3.8;
            targetCtx.beginPath();
            targetCtx.moveTo(-9, 1);
            targetCtx.quadraticCurveTo(-23, 4 + wave * 0.5, -36, 1 + wave);
            targetCtx.stroke();
            targetCtx.strokeStyle = '#ffffff';
            targetCtx.lineWidth = 4;
            targetCtx.setLineDash([4, 4]);
            targetCtx.beginPath();
            targetCtx.moveTo(-17, 2 + wave * 0.3);
            targetCtx.lineTo(-36, 1 + wave);
            targetCtx.stroke();
            targetCtx.setLineDash([]);
          } else if (ani.id === 'tw_pheasant') {
            targetCtx.strokeStyle = '#1e293b';
            targetCtx.lineWidth = 4.2;
            targetCtx.beginPath();
            targetCtx.moveTo(-9, 1);
            targetCtx.lineTo(-30, -3 + stride * 3);
            targetCtx.stroke();
            targetCtx.strokeStyle = '#e2e8f0';
            targetCtx.lineWidth = 4.2;
            targetCtx.setLineDash([2, 3]);
            targetCtx.beginPath();
            targetCtx.moveTo(-12, 0);
            targetCtx.lineTo(-30, -3 + stride * 3);
            targetCtx.stroke();
            targetCtx.setLineDash([]);
          } else {
            targetCtx.strokeStyle = '#1e293b';
            targetCtx.lineWidth = 1.5;
            targetCtx.beginPath();
            targetCtx.moveTo(-7, 3); targetCtx.lineTo(-23, 10 + stride * 2);
            targetCtx.moveTo(-5, 4); targetCtx.lineTo(-20, 13 - stride * 2);
            targetCtx.stroke();
          }

          targetCtx.fillStyle = bodyGrad;
          targetCtx.beginPath();
          targetCtx.ellipse(0, 0, 10.5, 5.8, -0.15, 0, Math.PI * 2);
          targetCtx.fill();

          if (ani.id === 'crane') {
            targetCtx.strokeStyle = '#ffffff';
            targetCtx.lineWidth = 3.6;
            targetCtx.beginPath();
            targetCtx.moveTo(8, -1);
            targetCtx.quadraticCurveTo(15, -7, 20, -6);
            targetCtx.stroke();
            targetCtx.fillStyle = '#dc2626';
            targetCtx.beginPath();
            targetCtx.arc(19.5, -8, 2.1, 0, Math.PI * 2);
            targetCtx.fill();
          } else {
            targetCtx.fillStyle = '#09090b';
            targetCtx.beginPath();
            targetCtx.arc(9.5, -3, 4.8, 0, Math.PI * 2);
            targetCtx.fill();
            if (ani.id === 'tw_pheasant') {
              targetCtx.fillStyle = '#dc2626';
              targetCtx.beginPath();
              targetCtx.arc(10.5, -3.5, 2.5, 0, Math.PI * 2);
              targetCtx.fill();
            }
          }

          targetCtx.fillStyle = ani.id === 'tw_magpie' ? '#ef4444' : '#eab308';
          targetCtx.beginPath();
          const bx = ani.id === 'crane' ? 21 : 13.5;
          const by = ani.id === 'crane' ? -6 : -3.5;
          targetCtx.moveTo(bx, by - 1.7);
          targetCtx.lineTo(bx + 7.5, by);
          targetCtx.lineTo(bx, by + 1.7);
          targetCtx.closePath();
          targetCtx.fill();

          targetCtx.fillStyle = ani.cLight;
          targetCtx.beginPath();
          targetCtx.moveTo(3, -1);
          targetCtx.quadraticCurveTo(-5, -20 + flap, -20, -15 + flap);
          targetCtx.lineTo(-13, -1 + flap * 0.4);
          targetCtx.lineTo(-2, 3);
          targetCtx.closePath();
          targetCtx.fill();
          targetCtx.strokeStyle = ani.id === 'tw_magpie' ? '#ffffff' : '#09090b';
          targetCtx.lineWidth = 1.4;
          targetCtx.stroke();

          targetCtx.restore();
          return;
        }

        // ------------------------------------------------------------------
        // 姿態 3：巨獸重裝級姿態 (亞洲巨象 / 巨型河馬 / 台灣野豬)
        // ------------------------------------------------------------------
        if (ani.posture === 'colossal') {
          if (ani.id === 'elephant') {
            targetCtx.fillStyle = ani.cDark;
            targetCtx.fillRect(-13 + stride * 3, 2, 6, 12);
            targetCtx.fillRect(5 - stride * 3, 2, 6, 12);

            targetCtx.fillStyle = bodyGrad;
            targetCtx.beginPath();
            targetCtx.ellipse(-2, -3, 15.5, 12, 0, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.fillStyle = ani.cMid;
            targetCtx.fillRect(-10 - stride * 3, 3, 6.2, 12);
            targetCtx.fillRect(8 + stride * 3, 3, 6.2, 12);

            targetCtx.fillStyle = ani.cDark;
            targetCtx.beginPath();
            targetCtx.ellipse(6, -5, 6.2, 9, -0.2, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.fillStyle = bodyGrad;
            targetCtx.beginPath();
            targetCtx.arc(12, -5, 8, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.strokeStyle = ani.cMid;
            targetCtx.lineWidth = 4.8;
            targetCtx.lineCap = 'round';
            targetCtx.beginPath();
            targetCtx.moveTo(17, -3);
            targetCtx.quadraticCurveTo(22, 5, 18.5, 12.5 + cosStride * 2);
            targetCtx.stroke();

            targetCtx.strokeStyle = '#ffffff';
            targetCtx.lineWidth = 2.6;
            targetCtx.beginPath();
            targetCtx.moveTo(14, 0);
            targetCtx.quadraticCurveTo(21, 4, 27, -2);
            targetCtx.stroke();

            targetCtx.restore();
            return;
          }

          if (ani.id === 'hippo') {
            targetCtx.fillStyle = ani.cDark;
            targetCtx.fillRect(-13 + stride * 2.5, 4, 5.5, 10);
            targetCtx.fillRect(4 - stride * 2.5, 4, 5.5, 10);

            targetCtx.fillStyle = bodyGrad;
            targetCtx.beginPath();
            targetCtx.ellipse(-2, 0, 15, 10, 0, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.fillStyle = ani.cMid;
            targetCtx.fillRect(-10 - stride * 2.5, 5, 5.5, 10);
            targetCtx.fillRect(7 + stride * 2.5, 5, 5.5, 10);

            targetCtx.fillStyle = ani.cMid;
            targetCtx.beginPath();
            targetCtx.ellipse(12.5, -5, 6.8, 4.8, -0.35, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.fillStyle = '#be123c';
            targetCtx.beginPath();
            targetCtx.moveTo(9, -3);
            targetCtx.lineTo(19.5, -6);
            targetCtx.lineTo(18.5, 5);
            targetCtx.lineTo(9, 3);
            targetCtx.closePath();
            targetCtx.fill();
            targetCtx.fillStyle = '#ffffff';
            targetCtx.fillRect(15.5, -5, 2, 3.2);
            targetCtx.fillRect(15.5, 1, 2.2, 3.8);

            targetCtx.restore();
            return;
          }

          // 台灣野豬
          targetCtx.strokeStyle = ani.cDark;
          targetCtx.lineWidth = 3.8;
          targetCtx.beginPath();
          targetCtx.moveTo(-10, 3); targetCtx.lineTo(-13 - stride * 5, 12.5);
          targetCtx.moveTo(8, 3); targetCtx.lineTo(12 + stride * 5, 12.5);
          targetCtx.stroke();

          targetCtx.fillStyle = bodyGrad;
          targetCtx.beginPath();
          targetCtx.moveTo(-13, 2);
          targetCtx.quadraticCurveTo(-2, -11.5, 11, -5);
          targetCtx.lineTo(15.5, 2);
          targetCtx.lineTo(-12, 6);
          targetCtx.closePath();
          targetCtx.fill();

          targetCtx.strokeStyle = '#f8fafc';
          targetCtx.lineWidth = 2;
          targetCtx.beginPath();
          targetCtx.moveTo(7, 1); targetCtx.lineTo(12.5, 0);
          targetCtx.moveTo(12.5, 1); targetCtx.lineTo(16.5, -5);
          targetCtx.stroke();

          targetCtx.restore();
          return;
        }

        // ------------------------------------------------------------------
        // 姿態 4：穿山甲拱背鱗甲姿 (台灣穿山甲)
        // ------------------------------------------------------------------
        if (ani.posture === 'armored_pangolin') {
          targetCtx.fillStyle = ani.cDark;
          targetCtx.beginPath();
          targetCtx.moveTo(-8, 2);
          targetCtx.quadraticCurveTo(-19, 4, -26, 9 + stride * 2);
          targetCtx.lineTo(-17, 10);
          targetCtx.closePath();
          targetCtx.fill();

          targetCtx.fillStyle = bodyGrad;
          targetCtx.beginPath();
          targetCtx.arc(0, 4, 11.5, Math.PI, 0, false);
          targetCtx.closePath();
          targetCtx.fill();

          targetCtx.strokeStyle = '#fde68a';
          targetCtx.lineWidth = 1;
          for (let rx = -8; rx <= 6; rx += 4.5) {
            targetCtx.beginPath();
            targetCtx.arc(rx, -1, 2.8, -Math.PI * 0.8, 0.2);
            targetCtx.stroke();
            targetCtx.beginPath();
            targetCtx.arc(rx + 2, 2.5, 2.8, -Math.PI * 0.8, 0.2);
            targetCtx.stroke();
          }

          targetCtx.fillStyle = ani.cMid;
          targetCtx.beginPath();
          targetCtx.moveTo(10, -1);
          targetCtx.lineTo(18.5, 3);
          targetCtx.lineTo(10, 5);
          targetCtx.closePath();
          targetCtx.fill();

          targetCtx.strokeStyle = '#fde68a';
          targetCtx.lineWidth = 1.8;
          targetCtx.beginPath();
          targetCtx.moveTo(8, 6);
          targetCtx.quadraticCurveTo(12.5, 10, 9, 12.5);
          targetCtx.stroke();

          targetCtx.restore();
          return;
        }

        // ------------------------------------------------------------------
        // 姿態 5：掠食飛撲姿 & 高昂蹄躍姿
        // ------------------------------------------------------------------
        const legExt = stride * 7.2;
        const torsoLen = 12.5;
        const torsoThick = 6.8;

        targetCtx.strokeStyle = ani.id === 'pomeranian' ? ani.cLight : ani.cDark;
        targetCtx.lineWidth = ani.id === 'pomeranian' ? 4.5 : 2.5;
        targetCtx.lineCap = 'round';
        targetCtx.beginPath();
        if (ani.id === 'pomeranian') {
          targetCtx.moveTo(-8.5, -2);
          targetCtx.quadraticCurveTo(-14.5, -11.5, -7.5, -10.5);
        } else {
          targetCtx.moveTo(-torsoLen, -1);
          targetCtx.quadraticCurveTo(-torsoLen - 8.5, -5 + cosStride * 4, -torsoLen - 13.5, -8.5 - stride * 3);
        }
        targetCtx.stroke();

        targetCtx.strokeStyle = ani.cDark;
        targetCtx.lineWidth = 3.1;
        targetCtx.beginPath();
        targetCtx.moveTo(-torsoLen + 3, 2); targetCtx.lineTo(-torsoLen - 4.5 - legExt, 11.5);
        targetCtx.moveTo(torsoLen - 3, 2); targetCtx.lineTo(torsoLen + 5.5 + legExt, 10.5);
        targetCtx.stroke();

        targetCtx.fillStyle = bodyGrad;
        targetCtx.beginPath();
        targetCtx.moveTo(-torsoLen, -torsoThick * 0.7);
        targetCtx.quadraticCurveTo(0, -torsoThick * 1.15, torsoLen, -torsoThick * 0.85);
        targetCtx.quadraticCurveTo(torsoLen + 4, 0, torsoLen - 1, torsoThick * 0.85);
        targetCtx.quadraticCurveTo(0, torsoThick * 0.55, -torsoLen, torsoThick * 0.75);
        targetCtx.closePath();
        targetCtx.fill();

        targetCtx.fillStyle = ani.cBelly;
        targetCtx.beginPath();
        targetCtx.ellipse(0, torsoThick * 0.55, torsoLen * 0.7, torsoThick * 0.3, 0, 0, Math.PI);
        targetCtx.fill();

        if (ani.id === 'tiger') {
          targetCtx.strokeStyle = '#140b04';
          targetCtx.lineWidth = 1.7;
          for (let tx = -8.5; tx <= 8.5; tx += 3.4) {
            targetCtx.beginPath();
            targetCtx.moveTo(tx, -5.8); targetCtx.lineTo(tx - 1.5, 2.8);
            targetCtx.stroke();
          }
        } else if (ani.id === 'tw_leopard_cat') {
          targetCtx.fillStyle = '#271507';
          for (let sx = -7.5; sx <= 5.5; sx += 4.2) {
            targetCtx.beginPath();
            targetCtx.arc(sx, -2, 1.5, 0, Math.PI * 2);
            targetCtx.arc(sx + 2, 1.4, 1.3, 0, Math.PI * 2);
            targetCtx.fill();
          }
        } else if (ani.id === 'tw_deer') {
          targetCtx.fillStyle = '#ffffff';
          for (let dx = -7.5; dx <= 5.5; dx += 4.2) {
            targetCtx.beginPath();
            targetCtx.arc(dx, -2, 1.3, 0, Math.PI * 2);
            targetCtx.arc(dx + 2, 1, 1.1, 0, Math.PI * 2);
            targetCtx.fill();
          }
        } else if (ani.id === 'beagle') {
          targetCtx.fillStyle = '#1c1917';
          targetCtx.beginPath();
          targetCtx.ellipse(-2, -2, 6, 3.8, 0, 0, Math.PI * 2);
          targetCtx.fill();
        }

        targetCtx.strokeStyle = ani.cMid;
        targetCtx.lineWidth = 3.4;
        targetCtx.beginPath();
        targetCtx.moveTo(-torsoLen + 4, 2); targetCtx.lineTo(-torsoLen - 2 + legExt, 12.5);
        targetCtx.moveTo(torsoLen - 2, 2); targetCtx.lineTo(torsoLen + 6.5 - legExt, 11.5);
        targetCtx.stroke();

        if (ani.id === 'lion') {
          targetCtx.fillStyle = '#451a03';
          targetCtx.beginPath();
          targetCtx.ellipse(torsoLen - 1, -2, 8.2, 9, 0.2, 0, Math.PI * 2);
          targetCtx.fill();
        } else if (ani.id === 'pomeranian') {
          targetCtx.fillStyle = ani.cLight;
          targetCtx.beginPath();
          targetCtx.arc(torsoLen - 3, -1, 7.6, 0, Math.PI * 2);
          targetCtx.fill();
        }

        targetCtx.fillStyle = bodyGrad;
        targetCtx.beginPath();
        targetCtx.ellipse(torsoLen + 4, -5, 5.8, 4.8, -0.1, 0, Math.PI * 2);
        targetCtx.fill();

        if (ani.id === 'tw_deer') {
          targetCtx.strokeStyle = '#fef3c7';
          targetCtx.lineWidth = 1.9;
          targetCtx.beginPath();
          targetCtx.moveTo(torsoLen + 3, -9);
          targetCtx.lineTo(torsoLen - 1, -18.5);
          targetCtx.moveTo(torsoLen + 1, -13.5);
          targetCtx.lineTo(torsoLen + 5.5, -16.5);
          targetCtx.moveTo(torsoLen, -16.5);
          targetCtx.lineTo(torsoLen - 4.5, -17.5);
          targetCtx.stroke();
        } else if (ani.id === 'tw_serow') {
          targetCtx.strokeStyle = '#09090b';
          targetCtx.lineWidth = 2.1;
          targetCtx.beginPath();
          targetCtx.moveTo(torsoLen + 3, -8.5);
          targetCtx.quadraticCurveTo(torsoLen - 1, -14.5, torsoLen - 5, -12.5);
          targetCtx.stroke();
        } else if (ani.id === 'hare') {
          targetCtx.fillStyle = ani.cMid;
          targetCtx.beginPath();
          targetCtx.ellipse(torsoLen, -12.5, 2.1, 6.2, -0.45, 0, Math.PI * 2);
          targetCtx.fill();
        } else if (ani.id === 'beagle') {
          targetCtx.fillStyle = '#7c2d12';
          targetCtx.beginPath();
          targetCtx.ellipse(torsoLen + 2, 0, 3, 6.2, 0.35, 0, Math.PI * 2);
          targetCtx.fill();
        } else if (ani.id === 'tw_leopard_cat') {
          targetCtx.fillStyle = '#09090b';
          targetCtx.beginPath();
          targetCtx.arc(torsoLen + 2, -9.5, 2.6, 0, Math.PI * 2);
          targetCtx.fill();
          targetCtx.fillStyle = '#ffffff';
          targetCtx.fillRect(torsoLen + 1.2, -10.2, 1.5, 1.5);
          targetCtx.fillRect(torsoLen + 5.5, -7.8, 2.4, 1.1);
        }

        targetCtx.fillStyle = '#fef08a';
        targetCtx.beginPath();
        targetCtx.arc(torsoLen + 6.2, -5.8, 1.2, 0, Math.PI * 2);
        targetCtx.fill();

        targetCtx.restore();
      }

      // ================== 建立兩小排 (2×9 = 18隻) 選角網格 + 選中放大預覽 ==================
      const miniCanvases = new Map();
      let previewLeapImpulse = 0;

      function buildAnimalSelectRows() {
        animalGrid.innerHTML = '';
        ANIMALS.forEach((a) => {
          const cell = document.createElement('div');
          cell.className = 'animal-cell' + (a.id === myAnimalId ? ' selected' : '');
          cell.dataset.id = a.id;

          if (a.isTW) {
            const twDot = document.createElement('div');
            twDot.className = 'animal-cell-tw';
            twDot.title = '台灣原生特有種';
            cell.appendChild(twDot);
          }

          const miniCv = document.createElement('canvas');
          miniCv.width = 104;
          miniCv.height = 80;
          miniCanvases.set(a.id, miniCv);

          const label = document.createElement('div');
          label.className = 'animal-cell-name';
          label.textContent = a.name;

          cell.appendChild(miniCv);
          cell.appendChild(label);

          cell.addEventListener('click', () => {
            myAnimalId = a.id;
            localStorage.setItem(ANIMAL_KEY, myAnimalId);
            previewLeapImpulse = 1.0;
            playSound('bump');
            updateAnimalSelectionUI();
            cell.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            broadcastHeartbeat();
            renderRoster();
          });

          animalGrid.appendChild(cell);
        });
      }

      showcaseStage.addEventListener('click', () => {
        previewLeapImpulse = 1.0;
        playSound('bump');
      });

      function updateAnimalSelectionUI() {
        const a = ANIMAL_MAP[myAnimalId] || ANIMALS[0];
        showcaseNum.textContent = a.num;
        posturePill.textContent = a.postureName;
        twPill.style.display = a.isTW ? 'block' : 'none';
        detailTitle.textContent = a.name;
        detailEn.textContent = `${a.en} · ${a.weight}t (${a.sizeScale}x)`;
        barWeight.style.width = `${a.wPct}%`;
        barSpeed.style.width = `${a.sPct}%`;
        barPush.style.width = `${a.pPct}%`;
        detailDesc.textContent = a.desc;
        hudAnimalLabel.textContent = a.name;

        document.querySelectorAll('.animal-cell').forEach((el) => {
          el.classList.toggle('selected', el.dataset.id === myAnimalId);
        });
      }

      function renderSelectScreenPortraits(now) {
        if (overlay.classList.contains('hidden')) return;

        for (const [id, miniCv] of miniCanvases.entries()) {
          const mCtx = miniCv.getContext('2d');
          mCtx.clearRect(0, 0, miniCv.width, miniCv.height);
          const isSel = id === myAnimalId;
          const phase = isSel ? now * 0.01 : 0.75;
          drawAuthenticAnimal(mCtx, id, 52, 46, isSel ? 1.25 : 1.05, 1, phase, 0);
        }

        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

        // 繪製體型高度比例尺格線 (1m / 2m / 3m)，直觀感受巨象與博美的體型差異！
        previewCtx.strokeStyle = 'rgba(15, 23, 42, 0.1)';
        previewCtx.lineWidth = 1;
        previewCtx.setLineDash([4, 4]);
        for (let y = 75; y <= 235; y += 52) {
          previewCtx.beginPath();
          previewCtx.moveTo(15, y);
          previewCtx.lineTo(395, y);
          previewCtx.stroke();
        }
        previewCtx.setLineDash([]);

        const jumpY = Math.sin(previewLeapImpulse * Math.PI) * -26;
        const pitch = -Math.sin(previewLeapImpulse * Math.PI) * 0.14;
        drawAuthenticAnimal(
          previewCtx,
          myAnimalId,
          205,
          182 + jumpY,
          3.45,
          1,
          now * 0.01,
          pitch
        );
      }

      buildAnimalSelectRows();
      updateAnimalSelectionUI();

      nameInput.addEventListener('change', () => {
        myName = nameInput.value.trim() || myName;
        nameInput.value = myName;
        localStorage.setItem(NAME_KEY, myName);
        broadcastHeartbeat();
        renderRoster();
      });

      const hpUnits = [];
      for (let i = 0; i < MAX_HP; i++) {
        const div = document.createElement('div');
        div.className = 'hp-unit active';
        hpBarEl.appendChild(div);
        hpUnits.push(div);
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2200);
      }

      // Seeded PRNG
      let rngState = 987654321;
      function seedRandom(seed) {
        rngState = seed >>> 0;
      }
      function nextRandom() {
        let t = (rngState += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      // 合成音效系統
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSound(type, weight = 1) {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'land') {
          osc.type = 'triangle';
          const baseFreq = Math.max(95, 270 - weight * 62);
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.28, now + 0.07);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'stomp') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(92, now);
          osc.frequency.linearRampToValueAtTime(40, now + 0.22);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
          if (navigator.vibrate) navigator.vibrate(45);
        } else if (type === 'spring') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.setValueAtTime(420, now + 0.05);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.15);
          gain.gain.setValueAtTime(0.13, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'bump') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(290, now + 0.08);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'hurt') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(165, now);
          osc.frequency.linearRampToValueAtTime(60, now + 0.24);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.24);
          if (navigator.vibrate) navigator.vibrate(80);
        } else if (type === 'shock') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.setValueAtTime(180, now + 0.04);
          osc.frequency.setValueAtTime(640, now + 0.08);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.14);
        } else if (type === 'supply') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.06);
          osc.frequency.setValueAtTime(783.99, now + 0.12);
          osc.frequency.setValueAtTime(1046.5, now + 0.18);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.start(now);
          osc.stop(now + 0.32);
        } else if (type === 'gameover') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(70, now + 0.45);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        }
      }

      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? '音' : '靜';
      });

      function resizeCanvas() {
        const rect = canvasWrap.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        viewScale = (rect.width || 380) / LOGIC_W;
        W = LOGIC_W;
        H = (rect.height || 540) / viewScale;
        canvas.width = (rect.width || 380) * dpr;
        canvas.height = (rect.height || 540) * dpr;
        ctx.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      const mistClouds = Array.from({ length: 14 }, () => ({
        x: Math.random() * LOGIC_W,
        y: Math.random() * 600,
        r: 45 + Math.random() * 65,
        vy: -14 - Math.random() * 18,
        vx: (Math.random() - 0.5) * 12,
        alpha: 0.12 + Math.random() * 0.18
      }));

      let state = 'MENU';
      let hp = MAX_HP;
      let floor = 0;
      let scrollDistance = 0;
      let scrollSpeed = 112;
      let nextSpawnWorldY = 0;
      let shakeTime = 0;
      let wallOffset = 0;
      let conveyorAnim = 0;
      let currentSeed = Date.now();

      const player = {
        x: 180,
        y: 120,
        w: 30,
        h: 28,
        vx: 0,
        vy: 0,
        pushVx: 0,
        baseSpeed: 225,
        onPlatform: null,
        facing: 1,
        walkFrame: 0,
        runTime: 0,
        canDoubleJump: true,
        stunTimer: 0,
        adrenalineTimer: 0,
        invulnerable: 0
      };

      let platforms = [];
      let particles = [];
      let popups = [];
      let shockwaves = [];

      const peers = new Map();

      // ============== MQTT 多人連線系統 ==============
      const urlParams = new URLSearchParams(window.location.search);
      let currentRoom = (urlParams.get('room') || '8888').toUpperCase().slice(0, 8);
      roomInput.value = currentRoom;
      roomLabel.textContent = `區域: ${currentRoom}`;

      let mqttClient = null;
      let currentTopic = '';
      const BROKERS = [
        'wss://broker.emqx.io:8084/mqtt',
        'wss://broker.hivemq.com:8884/mqtt'
      ];
      let brokerIdx = 0;

      function getTopic(room) {
        return `tokyo-jungle-v4/room/${room}`;
      }

      function connectMultiplayer() {
        if (typeof mqtt === 'undefined') {
          connStatusText.textContent = '離線單機模式';
          return;
        }
        const url = BROKERS[brokerIdx % BROKERS.length];
        connStatusText.textContent = '正在連線東京伺服器...';
        netDot.classList.remove('online');

        if (mqttClient) {
          try { mqttClient.end(true); } catch (_) {}
        }

        mqttClient = mqtt.connect(url, {
          clientId: 'tkj4_' + myId + '_' + Math.floor(Math.random() * 999),
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 3000
        });

        mqttClient.on('connect', () => {
          netDot.classList.add('online');
          connStatusText.textContent = `已連線 (區域 ${currentRoom})`;
          subscribeRoom(currentRoom);
          broadcastHeartbeat();
        });

        mqttClient.on('error', () => { brokerIdx++; });
        mqttClient.on('offline', () => {
          netDot.classList.remove('online');
          connStatusText.textContent = '重新連線中...';
        });

        mqttClient.on('message', (topic, payload) => {
          if (topic !== currentTopic) return;
          try {
            const msg = JSON.parse(payload.toString());
            if (!msg || msg.id === myId) return;
            handleNetworkMessage(msg);
          } catch (_) {}
        });
      }

      function subscribeRoom(newRoom) {
        const cleanRoom = (newRoom || '8888').trim().toUpperCase().slice(0, 8) || '8888';
        if (mqttClient && currentTopic) {
          try { mqttClient.unsubscribe(currentTopic); } catch (_) {}
        }
        currentRoom = cleanRoom;
        roomInput.value = currentRoom;
        roomLabel.textContent = `區域: ${currentRoom}`;
        currentTopic = getTopic(currentRoom);
        peers.clear();
        renderRoster();

        if (mqttClient && mqttClient.connected) {
          mqttClient.subscribe(currentTopic, { qos: 0 });
          connStatusText.textContent = `已連線 (區域 ${currentRoom})`;
          broadcastHeartbeat();
        }
      }

      function publishMsg(data) {
        if (!mqttClient || !mqttClient.connected || !currentTopic) return;
        data.id = myId;
        try {
          mqttClient.publish(currentTopic, JSON.stringify(data), { qos: 0 });
        } catch (_) {}
      }

      function broadcastHeartbeat() {
        publishMsg({
          t: 'hb',
          name: myName,
          ani: myAnimalId,
          floor,
          hp,
          alive: state === 'PLAYING' && hp > 0
        });
      }

      function broadcastPos() {
        if (state !== 'PLAYING') return;
        publishMsg({
          t: 'pos',
          name: myName,
          ani: myAnimalId,
          x: Math.round(player.x),
          wy: Math.round(player.y + scrollDistance),
          vx: Math.round(player.vx),
          vy: Math.round(player.vy),
          f: player.facing,
          hp,
          fl: floor,
          alive: hp > 0
        });
      }

      function handleNetworkMessage(msg) {
        const now = performance.now();
        let p = peers.get(msg.id);
        if (!p) {
          p = {
            id: msg.id,
            name: msg.name || '生存者',
            animalId: ANIMAL_MAP[msg.ani] ? msg.ani : 'tw_bear',
            x: LOGIC_W / 2,
            worldY: 200,
            vx: 0,
            vy: 0,
            facing: 1,
            hp: MAX_HP,
            floor: 1,
            alive: false,
            lastSeen: now
          };
          peers.set(msg.id, p);
          renderRoster();
        }

        p.lastSeen = now;
        if (msg.name) p.name = msg.name;
        if (msg.ani && ANIMAL_MAP[msg.ani]) p.animalId = msg.ani;

        if (msg.t === 'hb') {
          p.floor = msg.floor || p.floor;
          p.hp = msg.hp !== undefined ? msg.hp : p.hp;
          p.alive = !!msg.alive;
          renderRoster();
        } else if (msg.t === 'pos') {
          p.x = msg.x;
          p.worldY = msg.wy;
          p.vx = msg.vx || 0;
          p.vy = msg.vy || 0;
          p.facing = msg.f || 1;
          p.hp = msg.hp;
          p.floor = msg.fl;
          p.alive = !!msg.alive;
        } else if (msg.t === 'start') {
          showToast(`${p.name} 發起了全房同步狩獵！`);
          startGame(msg.seed, false);
        } else if (msg.t === 'stomp') {
          const myWorldY = player.y + scrollDistance;
          if (Math.abs(myWorldY - msg.wy) < 30 && Math.abs(player.x - msg.x) < 110) {
            player.onPlatform = null;
            player.vy = -275;
            player.pushVx = (player.x >= msg.x ? 1 : -1) * 195;
            shakeTime = 0.25;
            playSound('stomp');
            addPopup(player.x + 15, player.y, '巨象震波！', '#b45309');
          }
        } else if (msg.t === 'emote') {
          addPopup(p.x + 15, p.worldY - scrollDistance - 16, msg.emoji, '#18181b');
        } else if (msg.t === 'dead') {
          p.alive = false;
          p.hp = 0;
          p.floor = msg.fl || p.floor;
          const ani = ANIMAL_MAP[p.animalId] || ANIMALS[0];
          addPopup(LOGIC_W / 2, 86, `${ani.name} (${p.name}) 於 B${p.floor} 倒下`, '#991b1b');
          renderRoster();
        }
      }

      setInterval(() => {
        const now = performance.now();
        let changed = false;
        for (const [id, p] of peers.entries()) {
          if (now - p.lastSeen > 8000) {
            peers.delete(id);
            changed = true;
          }
        }
        if (changed) renderRoster();
        broadcastHeartbeat();
        renderMpStrip();
      }, 1500);

      setInterval(() => {
        if (state === 'PLAYING') broadcastPos();
      }, 60);

      function renderRoster() {
        playerCountLabel.textContent = `同場 ${1 + peers.size} 獸`;
        rosterList.innerHTML = '';
        const myAni = ANIMAL_MAP[myAnimalId] || ANIMALS[0];
        const meTag = document.createElement('div');
        meTag.className = 'roster-tag';
        meTag.innerHTML = `<span style="color:#fbbf24;">[${myAni.name}]</span><span>${escapeHtml(myName)}</span>`;
        rosterList.appendChild(meTag);

        for (const p of peers.values()) {
          const ani = ANIMAL_MAP[p.animalId] || ANIMALS[0];
          const tag = document.createElement('div');
          tag.className = 'roster-tag';
          tag.innerHTML = `<span style="color:#a1a1aa;">[${ani.name}]</span><span>${escapeHtml(p.name)}</span>`;
          rosterList.appendChild(tag);
        }
        renderMpStrip();
      }

      function renderMpStrip() {
        const myAni = ANIMAL_MAP[myAnimalId] || ANIMALS[0];
        const list = [
          { name: myName, aniName: myAni.name, floor, alive: state === 'PLAYING' && hp > 0 },
          ...Array.from(peers.values()).map(p => ({
            name: p.name,
            aniName: (ANIMAL_MAP[p.animalId] || ANIMALS[0]).name,
            floor: p.floor,
            alive: p.alive
          }))
        ];
        list.sort((a, b) => b.floor - a.floor);

        mpStrip.innerHTML = list.map(u => {
          const deadClass = (!u.alive && u.floor > 0 && state === 'PLAYING') ? ' dead' : '';
          return `<div class="mp-chip${deadClass}">
            <span style="color:#fbbf24;">${u.aniName.slice(0, 2)}</span>
            <span>${escapeHtml(u.name.slice(0, 4))}</span>
            <span style="color:#f59e0b;">B${u.floor || 0}</span>
          </div>`;
        }).join('');
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      joinRoomBtn.addEventListener('click', () => {
        myName = nameInput.value.trim() || myName;
        localStorage.setItem(NAME_KEY, myName);
        subscribeRoom(roomInput.value);
        showToast(`已切換至區域 ${currentRoom}`);
      });

      shareBtn.addEventListener('click', async () => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(currentRoom)}`;
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'TOKYO JUNGLE × 台灣原生猛獸 多人連線',
              text: `快選一隻台灣特有種或猛獸加入區域【${currentRoom}】，一起連線生存對戰！`,
              url: shareUrl
            });
            return;
          } catch (_) {}
        }
        try {
          await navigator.clipboard.writeText(shareUrl);
          showToast(`已複製區域【${currentRoom}】邀請連結！`);
        } catch (_) {
