              label = `${ani.name} +2 HP`;
            }
            healPlayer(bonus, cx, cy, label);
            playSound('land', ani.weight);
            spawnParticles(cx, plat.y, '#52525b', 5);
            if (ani.id === 'woodpecker' && plat.type === 'steel') {
              plat.brittle = true;
            }
            if (ani.id === 'spider' && plat.type === 'steel') {
              spiderWebs.push({ x: plat.x, worldY: plat.worldY, w: plat.w, life: 2.5 });
              publishMsg({ t: 'hazard', kind: 'web', x: Math.round(plat.x), wy: Math.round(plat.worldY), w: Math.round(plat.w) });
            }
          }
        }
      }

      function getWallPushPx() {
        if (fieldEvents.wallTimer <= 0) return 0;
        const t = fieldEvents.wallTimer; // 5.0 -> 0
        // 0.7s 內推，3.3s 維持，1.0s 退回（推到畫面中心附近，剩餘 55% 空間）
        let p = 1;
        if (t > 4.3) p = (5.0 - t) / 0.7;
        else if (t < 1.0) p = t / 1.0;
        const maxPush = Math.round((LOGIC_W - 26) * 0.45);
        return Math.round(maxPush * Math.max(0, Math.min(1, p)));
      }
      function getLeftWallWidth() {
        return 13 + (fieldEvents.wallSide < 0 ? getWallPushPx() : 0);
      }
      function getRightWallWidth() {
        return 13 + (fieldEvents.wallSide >= 0 ? getWallPushPx() : 0);
      }

      function getCeilingSpikeH() {
        if (fieldEvents.ceilingTimer <= 0) return 22;
        const t = fieldEvents.ceilingTimer; // 5.0 -> 0
        const progress = 1 - Math.max(0, Math.min(1, t / 5.0)); // 0 -> 1
        const depth = Math.sin(progress * Math.PI); // 0 -> 1 -> 0 平滑下壓再退回
        return 22 + depth * (H * 0.42);
      }

      function getFloodTopY() {
        if (fieldEvents.floodTimer <= 0) return H + 20;
        const t = fieldEvents.floodTimer; // 5.0 -> 0
        let p = 1;
        if (t > 4.2) p = (5.0 - t) / 0.8;
        else if (t < 1.0) p = t / 1.0;
        return H - Math.round(H * 0.28 * Math.max(0, Math.min(1, p)));
      }

      function update(dt) {
        if (previewLeapImpulse > 0) {
          previewLeapImpulse = Math.max(0, previewLeapImpulse - dt * 2.2);
        }

        for (const mc of mistClouds) {
          mc.y += mc.vy * dt;
          mc.x += mc.vx * dt;
          if (mc.y < -60) { mc.y = H + 60; mc.x = Math.random() * LOGIC_W; }
          if (mc.x < -60) mc.x = LOGIC_W + 60;
          if (mc.x > LOGIC_W + 60) mc.x = -60;
        }

        if (state !== 'PLAYING' && state !== 'SPECTATING') return;

        // 60fps 對手位置平滑內插與速度推算（解決連線畫面頓挫感）
        const nowMs = performance.now();
        const smoothAlpha = 1 - Math.exp(-20 * dt);
        let spectateTarget = null;
        for (const rp of peers.values()) {
          if (rp.alive && !spectateTarget) spectateTarget = rp;
          if (!rp.alive || !rp.hasPos) continue;
          const extrap = Math.min(0.14, Math.max(0, (nowMs - (rp.lastPosTime || nowMs)) / 1000));
          const predX = Math.max(13, Math.min(LOGIC_W - 43, rp.targetX + (rp.vx || 0) * extrap));
          const predY = rp.targetWorldY + (rp.vy || 0) * extrap;
          rp.x += (predX - rp.x) * smoothAlpha;
          rp.worldY += (predY - rp.worldY) * smoothAlpha;
        }

        if (state === 'SPECTATING') {
          if (spectateTarget) {
            const targetScroll = Math.max(scrollDistance, spectateTarget.worldY - H * 0.45);
            scrollDistance += (targetScroll - scrollDistance) * Math.min(1, dt * 6);
            while (nextSpawnWorldY < scrollDistance + H + 80) {
              platforms.push(createPlatformAtWorldY(nextSpawnWorldY, false));
              nextSpawnWorldY += 76;
            }
            for (let i = platforms.length - 1; i >= 0; i--) {
              platforms[i].y = platforms[i].worldY - scrollDistance;
              if (platforms[i].y < -50) platforms.splice(i, 1);
            }
          }
          checkAllDeadAndShowResult();
          return;
        }

        if (countdownTimer > 0) {
          countdownTimer = Math.max(0, countdownTimer - dt);
          const sec = Math.ceil(countdownTimer);
          if (sec > 0 && sec !== lastCountdownSec) {
            lastCountdownSec = sec;
            playSound('bump');
          }
          if (countdownTimer <= 0) {
            for (const p of platforms) {
              if (p.isStartPlat && !p.broken) {
                p.broken = true;
                for (let k = 0; k < 6; k++) {
                  spawnParticles(p.x + (p.w * (k + 0.5)) / 6, p.y + p.h / 2, '#d97706', 4);
                }
              }
            }
            if (player.onPlatform && player.onPlatform.isStartPlat) {
              player.onPlatform = null;
            }
            playSound('stomp');
            playSound('spring');
            addPopup(LOGIC_W / 2, H * 0.38, '出發！GO! (2秒免碰撞)', '#16a34a');
          }
          player.walkFrame += dt * 3;
          return;
        }

        if (startGraceTimer > 0) startGraceTimer = Math.max(0, startGraceTimer - dt);

        const ani = ANIMAL_MAP[myAnimalId] || ANIMALS[0];

        // 1 秒準備時間倒數，時間到正式生效
        for (let i = pendingFieldEvents.length - 1; i >= 0; i--) {
          const ev = pendingFieldEvents[i];
          ev.delay -= dt;
          if (ev.delay <= 0) {
            pendingFieldEvents.splice(i, 1);
            activatePickupEvent(ev.kind, ev.isMine, ev.extraDir);
          }
        }

        if (fieldEvents.freezeTimer > 0) fieldEvents.freezeTimer = Math.max(0, fieldEvents.freezeTimer - dt);
        if (fieldEvents.ceilingTimer > 0) fieldEvents.ceilingTimer = Math.max(0, fieldEvents.ceilingTimer - dt);
        if (fieldEvents.wallTimer > 0) fieldEvents.wallTimer = Math.max(0, fieldEvents.wallTimer - dt);
        if (fieldEvents.windTimer > 0) fieldEvents.windTimer = Math.max(0, fieldEvents.windTimer - dt);
        if (fieldEvents.rushTimer > 0) fieldEvents.rushTimer = Math.max(0, fieldEvents.rushTimer - dt);
        if (fieldEvents.brittleTimer > 0) fieldEvents.brittleTimer = Math.max(0, fieldEvents.brittleTimer - dt);
        if (fieldEvents.rockslideTimer > 0) fieldEvents.rockslideTimer = Math.max(0, fieldEvents.rockslideTimer - dt);
        if (fieldEvents.floodTimer > 0) fieldEvents.floodTimer = Math.max(0, fieldEvents.floodTimer - dt);
        if (fieldBanner.timer > 0) fieldBanner.timer = Math.max(0, fieldBanner.timer - dt);

        // 土石流隨機落石生成與掉落碰撞
        if (fieldEvents.rockslideTimer > 0) {
          rockSpawnCd -= dt;
          if (rockSpawnCd <= 0) {
            rockSpawnCd = 0.34;
            const lw = getLeftWallWidth();
            const rw = getRightWallWidth();
            const span = Math.max(40, LOGIC_W - lw - rw - 24);
            rockslideRocks.push({
              x: lw + 12 + Math.random() * span,
              y: -18,
              r: 11 + Math.random() * 5,
              vy: 330 + Math.random() * 60,
              warn: 0.42
            });
          }
        }
        for (let ri = rockslideRocks.length - 1; ri >= 0; ri--) {
          const rk = rockslideRocks[ri];
          if (rk.warn > 0) {
            rk.warn -= dt;
            continue;
          }
          rk.y += rk.vy * dt;
          const pcx = player.x + player.w / 2;
          const pcy = player.y + player.h / 2;
          if (Math.hypot(rk.x - pcx, rk.y - pcy) < rk.r + 14) {
            rockslideRocks.splice(ri, 1);
            spawnParticles(rk.x, rk.y, '#78350f', 10);
            if (player.invulnerable <= 0) {
              const rockDmg = getBodyDamage('rockslide', 3, ani);
              if (rockDmg > 0) {
                hurtPlayer(rockDmg, pcx, pcy, '落石砸中 ');
                const immuneDrop = player.giantTimer > 0 || ani.weight >= 1.6 || ani.id === 'pangolin';
                if (!immuneDrop) {
                  player.onPlatform = null;
                  player.vy = 180;
                  player.stunTimer = 0.25;
                }
              }
            }
            continue;
          }
          if (rk.y > H + 30) rockslideRocks.splice(ri, 1);
        }

        const isFrozenTarget = fieldEvents.freezeTimer > 0 && !fieldEvents.freezeByMe;
        // 每 20 層速度增加 10%
        const speedTier = Math.floor(floor / 20);
        scrollSpeed = Math.min(360, (112 + floor * 1.15) * (1 + speedTier * 0.10));
        if (fieldEvents.rushTimer > 0) scrollSpeed *= 1.6;
        const dy = scrollSpeed * dt;

        scrollDistance += dy;
        survivalTime += dt;
        const distM = Math.floor(scrollDistance / 35);
        const mins = Math.floor(survivalTime / 60);
        const secs = survivalTime % 60;
        distTextEl.textContent = `📏 ${distM} m`;
        timeTextEl.textContent = `⏱️ ${String(mins).padStart(2, '0')}:${secs.toFixed(1).padStart(4, '0')}`;
        wallOffset = (wallOffset + dy) % 36;
        conveyorAnim = (conveyorAnim + dt * 45) % 16;

        const newFloor = 1 + Math.floor(scrollDistance / 260);
        if (newFloor > floor) {
          floor = newFloor;
          if (floor % 20 === 0) {
            fieldBanner.text = `⚡ 第 ${floor} 層！下潛速度增加 10%！`;
            fieldBanner.color = '#ea580c';
            fieldBanner.timer = 3.0;
            addPopup(LOGIC_W / 2, 92, `⚡ 第 ${floor} 層！速度 +10%`, '#ea580c');
          }
          if (ani.id === 'mole' && player.moleCharges === 0 && (floor - player.lastMoleFloor) >= 10) {
            player.moleCharges = 1;
            addPopup(player.x + 15, player.y, '鼴鼠鑽地就緒!', '#92400e');
          }
          if (ani.id === 'bat' && player.batCharges === 0 && (floor - player.lastBatFloor) >= 10) {
            player.batCharges = 1;
            addPopup(player.x + 15, player.y, '蝙蝠吊掛就緒!', '#7e22ce');
          }
          if (ani.id === 'condor' && player.condorCharges === 0 && player.condorFlyTimer <= 0 && (floor - player.lastCondorFloor) >= 10) {
            player.condorCharges = 1;
            addPopup(player.x + 15, player.y, '神鷹飛行就緒!', '#d97706');
          }
          if (ani.id === 'chameleon' && player.chamCharges === 0 && player.phaseTimer <= 0 && (floor - player.lastChamFloor) >= 10) {
            player.chamCharges = 1;
            addPopup(player.x + 15, player.y, '變色龍隱身就緒!', '#16a34a');
          }
          updateHUD();
        }

        if (player.moleDropCd > 0) player.moleDropCd = Math.max(0, player.moleDropCd - dt);

        // 更新臭氣雲與蜘蛛絲網並檢查緩速（含食物鏈彩蛋）
        for (let i = skunkClouds.length - 1; i >= 0; i--) {
          const sc = skunkClouds[i];
          sc.life -= dt;
          if (ani.id !== 'skunk' && ani.id !== 'sloth' && Math.hypot((player.x + 15) - sc.x, (player.y + scrollDistance) - sc.worldY) < 48) {
            player.slowTimer = Math.max(player.slowTimer, 0.6);
            if (Math.random() < 0.25) spawnParticles(player.x + 15, player.y - 6, '#84cc16', 1);
          }
          if (sc.life <= 0) skunkClouds.splice(i, 1);
        }
        for (let i = spiderWebs.length - 1; i >= 0; i--) {
          const wb = spiderWebs[i];
          wb.life -= dt;
          const sy = wb.worldY - scrollDistance;
          if (ani.id !== 'spider' && player.onPlatform && Math.abs((player.y + player.h) - sy) < 16 &&
              player.x + player.w > wb.x && player.x < wb.x + wb.w) {
            if (ani.id === 'treefrog' || ani.id === 'chameleon') {
              spiderWebs.splice(i, 1);
              addPopup(player.x + 15, player.y - 10, '吃掉蛛網!', '#22c55e');
              spawnParticles(player.x + 15, player.y + 18, '#22c55e', 6);
              continue;
            }
            player.slowTimer = Math.max(player.slowTimer, 0.5);
          }
          if (wb.life <= 0) spiderWebs.splice(i, 1);
        }

        if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);
        if (player.invulnerable > 0) player.invulnerable = Math.max(0, player.invulnerable - dt);
        if (player.stunTimer > 0) player.stunTimer = Math.max(0, player.stunTimer - dt);
        if (player.adrenalineTimer > 0) player.adrenalineTimer = Math.max(0, player.adrenalineTimer - dt);
        if (player.hurtTimer > 0) player.hurtTimer = Math.max(0, player.hurtTimer - dt);
        if (player.shockTimer > 0) player.shockTimer = Math.max(0, player.shockTimer - dt);
        if (player.jumpTimer > 0) player.jumpTimer = Math.max(0, player.jumpTimer - dt);
        if (player.skillCooldown > 0) player.skillCooldown = Math.max(0, player.skillCooldown - dt);
        if (player.wallEffectCd > 0) player.wallEffectCd = Math.max(0, player.wallEffectCd - dt);
        if (player.wallWaveCd > 0) player.wallWaveCd = Math.max(0, player.wallWaveCd - dt);
        if (player.wallStickTimer > 0) player.wallStickTimer = Math.max(0, player.wallStickTimer - dt);
        if (player.pangolinRollTimer > 0) player.pangolinRollTimer = Math.max(0, player.pangolinRollTimer - dt);
        if (player.phaseTimer > 0) {
          player.phaseTimer = Math.max(0, player.phaseTimer - dt);
          if (ani.id === 'chameleon' && player.phaseTimer <= 0) {
            player.lastChamFloor = floor;
          }
        }
        if (player.condorFlyTimer > 0) {
          player.condorFlyTimer = Math.max(0, player.condorFlyTimer - dt);
          if (player.condorFlyTimer <= 0) {
            player.lastCondorFloor = floor;
          }
          updateHUD();
        } else if (ani.id === 'chameleon' && player.phaseTimer > 0) {
          updateHUD();
        }
        if (player.reverseTimer > 0) player.reverseTimer = Math.max(0, player.reverseTimer - dt);
        if (player.slowTimer > 0) player.slowTimer = Math.max(0, player.slowTimer - dt);
        if (player.featherTimer > 0) player.featherTimer = Math.max(0, player.featherTimer - dt);
        if (player.giantTimer > 0) player.giantTimer = Math.max(0, player.giantTimer - dt);

        if (isFrozenTarget) {
          for (let i = popups.length - 1; i >= 0; i--) {
            popups[i].y -= 36 * dt;
            popups[i].life -= dt;
            if (popups[i].life <= 0) popups.splice(i, 1);
          }
          return;
        }

        while (nextSpawnWorldY < scrollDistance + H + 80) {
          platforms.push(createPlatformAtWorldY(nextSpawnWorldY, false));
          nextSpawnWorldY += 76;
        }

        const electricCycle = (Date.now() % 1800) < 480;

        for (let i = platforms.length - 1; i >= 0; i--) {
          const p = platforms[i];

          p.sagVy += (-p.sagY * 160 - p.sagVy * 12) * dt;
          p.sagY = Math.max(-4, Math.min(14, p.sagY + p.sagVy * dt));

          if (p.springCompress > 0) {
            p.springCompress = Math.max(0, p.springCompress - dt * 5);
          }

          let load = 0;
          let torque = 0;
          const pCenter = p.x + p.w / 2;

          if (player.onPlatform === p) {
            load += ani.weight;
            const offset = ((player.x + player.w / 2) - pCenter) / (p.w / 2);
            torque += offset * ani.weight;
          }

          for (const rp of peers.values()) {
            if (!rp.alive) continue;
            const rpAni = ANIMAL_MAP[rp.animalId] || ANIMALS[0];
            const onThisPlat = Math.abs((rp.worldY + 28) - p.worldY) < 18 &&
                               (rp.x + 24 > p.x) && (rp.x + 4 < p.x + p.w);
            if (onThisPlat) {
              load += rpAni.weight;
              const offset = ((rp.x + 15) - pCenter) / (p.w / 2);
              torque += offset * rpAni.weight;
            }
          }

          p.totalLoad = load;

          const heavyOnBoard = load >= 1.6 || (player.onPlatform === p && ani.weight >= 1.6);
          const tiltSensitivity = p.type === 'seesaw' ? (heavyOnBoard ? 0.38 : 0.24) : (p.type === 'slanted_l' || p.type === 'slanted_r' ? 0.05 : 0.085);
          const targetTilt = Math.max(-0.42, Math.min(0.42, p.baseTilt + torque * tiltSensitivity));
          p.tilt += (targetTilt - p.tilt) * Math.min(1, dt * 10);

          // 腐朽木板或脆化階梯（依體型差異：重型加快至 0.65 倍時間斷裂）
          if ((p.type === 'wood' || p.brittle) && p.touched && !p.broken) {
            const tier = getBodyTier(ani);
            const brittleLimit = tier === 'heavy' ? 0.125 : (tier === 'light' ? 0.29 : 0.20);
            const heavyBreakRate = (player.onPlatform === p && ani.weight >= 1.6) ? 1.54 : 1.0;
            const weightRate = (p.brittle ? 1.0 : ((ani.id === 'octopus' || ani.id === 'sandcat') ? 0.42 : Math.max(0.45, Math.max(load, ani.weight)))) * heavyBreakRate;
            p.breakTimer += dt * weightRate;
            if (p.breakTimer >= (p.brittle ? brittleLimit : 0.21)) {
              p.broken = true;
              spawnParticles(p.x + p.w / 2, p.y, '#78350f', 12);
              if (player.onPlatform === p) player.onPlatform = null;
            }
          }

          if (p.type === 'steel' && load > 2.75 && !p.broken) {
            p.overloadTimer += dt;
            if (p.overloadTimer >= 1.0) {
              p.broken = true;
              shakeTime = 0.2;
              playSound('stomp');
              spawnParticles(p.x + p.w / 2, p.y, '#9a3412', 16);
              addPopup(p.x + p.w / 2, p.y, '超載崩塌！', '#9a3412');
              if (player.onPlatform === p) player.onPlatform = null;
            }
          } else {
            p.overloadTimer = Math.max(0, p.overloadTimer - dt);
          }

          if (p.broken) {
            p.worldY += 310 * dt;
          }
          p.y = p.worldY - scrollDistance;

          if (p.y < -50) {
            platforms.splice(i, 1);
          }
        }

        // 水平移動與 24 動物專長
        let moveDir = 0;
        if (player.stunTimer <= 0) {
          if (input.left) moveDir -= 1;
          if (input.right) moveDir += 1;
          if (player.reverseTimer > 0 && ani.id !== 'chameleon') moveDir = -moveDir;
        }

        if (moveDir !== 0 && moveDir === player.facing) {
          player.runTime += dt;
          player.stillTimer = 0;
        } else {
          player.runTime = 0;
          if (player.onPlatform && moveDir === 0) {
            player.stillTimer = (player.stillTimer || 0) + dt;
          } else {
            player.stillTimer = 0;
          }
        }

        if (player.capyHealCd > 0) player.capyHealCd = Math.max(0, player.capyHealCd - dt);
        if (ani.id === 'capybara' && player.onPlatform && player.stillTimer >= 0.8 && player.capyHealCd <= 0) {
          player.capyHealCd = 1.8;
          healPlayer(1, player.x + 15, player.y - 8, '+1 HP');
          spawnParticles(player.x + 15, player.y, '#fb923c', 5);
        }
        if (ani.id === 'panda' && player.onPlatform && player.stillTimer >= 1.2 && player.capyHealCd <= 0) {
          player.capyHealCd = 2.2;
          healPlayer(1, player.x + 15, player.y - 8, '+1 HP');
          spawnParticles(player.x + 15, player.y, '#22c55e', 5);
        }

        // 象龜縮殼（站定往下拉或靜止 0.5s）與鼴鼠往下拉鑽地穿板
        if (ani.id === 'tortoise') {
          player.tortoiseShell = (moveDir === 0 && (input.down || player.stillTimer >= 0.5));
        } else {
          player.tortoiseShell = false;
        }
        if (ani.id === 'mole' && player.onPlatform && !player.onPlatform.broken &&
            input.down && player.moleCharges > 0 && player.moleDropCd <= 0) {
          player.moleCharges = 0;
          player.lastMoleFloor = floor;
          player.moleDropCd = 0.5;
          player.onPlatform = null;
          player.y += 16;
          player.vy = 220;
          playSound('stomp');
          spawnParticles(player.x + 15, player.y, '#78350f', 10);
          addPopup(player.x + 15, player.y - 8, '鼴鼠穿板!', '#92400e');
          updateHUD();
        }

        let speedMultiplier = ani.speedMul;
        if (player.slowTimer > 0) speedMultiplier *= 0.55;
        let boarCharging = false;
        if (ani.id === 'bison' && player.runTime > 0.32) {
          speedMultiplier *= 1.32;
          boarCharging = true;
          if (Math.random() < 0.35) {
            spawnParticles(player.x + 15, player.y + 24, '#78350f', 1);
          }
        }
        // 北極熊冷凍期間主場加速 +30%
        if (ani.id === 'polarbear' && fieldEvents.freezeTimer > 0) {
          speedMultiplier *= 1.30;
        }
        // 原始人天災求生本能加速 +18%
        const hasDisaster = fieldEvents.windTimer > 0 || fieldEvents.floodTimer > 0 ||
          fieldEvents.rockslideTimer > 0 || fieldEvents.rushTimer > 0 || fieldEvents.wallTimer > 0;
        if (ani.id === 'caveman' && hasDisaster) {
          speedMultiplier *= 1.18;
        }
        // 國王企鵝在青苔或斜坡上觸發肚皮滑行加速
        const penguinSliding = ani.id === 'penguin' && player.onPlatform && (
          player.onPlatform.type === 'moss' ||
          player.onPlatform.type === 'slanted_l' ||
          player.onPlatform.type === 'slanted_r'
        );
        if (penguinSliding) {
          speedMultiplier *= 1.35;
        }
        if (player.adrenalineTimer > 0 || player.featherTimer > 0) {
          const featherBoost = (player.featherTimer > 0 && ani.posture === 'soaring_bird') ? 1.4 : 1.25;
          speedMultiplier *= featherBoost;
        }
        if (player.giantTimer > 0) {
          speedMultiplier *= 1.1;
        }

        const targetVx = moveDir * player.baseSpeed * speedMultiplier;
        const onMoss = player.onPlatform && player.onPlatform.type === 'moss' && ani.id !== 'hippo' && ani.id !== 'treefrog' && ani.id !== 'penguin';
        const accel = onMoss ? 4.2 : 18.0;
        player.vx += (targetVx - player.vx) * Math.min(1, accel * dt);

        player.pushVx *= Math.pow(0.005 / Math.sqrt(ani.weight), dt);

        if (moveDir !== 0) {
          player.facing = moveDir;
          player.walkFrame += dt * 15 * speedMultiplier;
        } else {
          player.walkFrame += dt * 3;
        }

        let totalVx = player.vx + player.pushVx;
        const bodyTier = getBodyTier(ani);
        const windFlyActive = fieldEvents.windTimer > 0 && ani.posture === 'soaring_bird' && input.up;
        if (windFlyActive && player.onPlatform) {
          player.onPlatform = null;
          player.vy = -150;
        }
        const isWindImmune = player.giantTimer > 0 || (bodyTier === 'heavy' && ani.posture !== 'soaring_bird') || ani.id === 'octopus' || ani.id === 'sloth' || ani.id === 'chameleon';
        if (fieldEvents.windTimer > 0 && !isWindImmune) {
          if (windFlyActive) {
            // 強風飛行系啟動多方向飛行：僅能順風飛行，逆風方向推力抑制
            if (moveDir !== 0 && moveDir !== fieldEvents.windDir) {
              totalVx = player.pushVx;
            } else if (moveDir === fieldEvents.windDir) {
              totalVx += fieldEvents.windDir * 110;
            }
            totalVx += fieldEvents.windDir * 125;
          } else {
            const windMult = ani.posture === 'soaring_bird' ? 1.65 : (bodyTier === 'light' ? 1.45 : 0.85);
            totalVx += fieldEvents.windDir * (player.onPlatform ? 85 : 135) * windMult;
          }
        }

        if (player.onPlatform) {
          const p = player.onPlatform;
          let convFactor = ani.id === 'hippo' ? 0.2 : (1 / Math.pow(ani.weight, 0.35));
          if (ani.weight >= 1.6 && ani.id !== 'hippo') convFactor *= 0.7; // 重型減 30% 輸送帶推力
          if (p.type === 'conveyor_l') totalVx -= 125 * convFactor;
          if (p.type === 'conveyor_r') totalVx += 125 * convFactor;

          const noSlide = ani.id === 'condor' || ani.id === 'springbok' || ani.id === 'treefrog' || ani.id === 'hippo' || ani.id === 'octopus' || ani.id === 'penguin';
          if (!noSlide) {
            const slideMul = onMoss ? 410 : 275;
            totalVx += Math.sin(p.tilt) * slideMul;
          } else if (penguinSliding && Math.abs(p.tilt) > 0.05) {
            totalVx += Math.sign(p.tilt) * 95;
          }

          // 漏電地板隨時漏電：每塊僅觸發一次 1 秒麻痺、扣 1 HP（水母完全免疫）
          if (p.type === 'electric' && !p.shockedUsed && player.invulnerable <= 0 && ani.id !== 'jellyfish') {
            p.shockedUsed = true;
            player.shockTimer = 1.0;
            hurtPlayer(getBodyDamage('electric', 1, ani), player.x + 15, player.y, '觸電 ');
            playSound('shock');
            if (ani.id !== 'hippo') {
              player.stunTimer = Math.max(player.stunTimer, 1.0);
            }
          }
        }

        // 決定動物目前動作表情狀態
        const onConveyorOrSlide = player.onPlatform && (
          player.onPlatform.type === 'conveyor_l' ||
          player.onPlatform.type === 'conveyor_r' ||
          onMoss ||
          Math.abs(player.onPlatform.tilt) > 0.12
        );
        if (player.shockTimer > 0) player.actionState = 'shocked';
        else if (player.hurtTimer > 0) player.actionState = 'hurt';
        else if (player.jumpTimer > 0 || (!player.onPlatform && player.vy < -60)) player.actionState = 'jumping';
        else if (!player.onPlatform) player.actionState = 'airborne';
        else if (onConveyorOrSlide) player.actionState = 'slipping';
        else if (moveDir !== 0) player.actionState = 'run';
        else player.actionState = 'idle';

        // 同一塊階梯上自動觸發動物專屬技能（開局 2 秒保護期內不觸發）
        if (startGraceTimer <= 0 && player.onPlatform && player.skillCooldown <= 0) {
          const curP = player.onPlatform;
          let hasSamePlatPeer = false;
          for (const rp of peers.values()) {
            if (!rp.alive) continue;
            const onSame = Math.abs((rp.worldY + 28) - curP.worldY) < 22 &&
                           (rp.x + 26 > curP.x) && (rp.x + 2 < curP.x + curP.w);
            if (onSame) { hasSamePlatPeer = true; break; }
          }
          if (hasSamePlatPeer) {
            player.skillCooldown = 3.6;
            const cx = player.x + 15;
            publishMsg({ t: 'skill', ani: ani.id, wy: Math.round(curP.worldY), x: Math.round(cx) });
            if (ani.id === 'sandcat') {
              player.phaseTimer = 2.0;
            } else if (ani.id === 'chameleon' && player.chamCharges > 0 && player.phaseTimer <= 0) {
              player.chamCharges = 0;
              player.phaseTimer = 1.8;
              player.lastChamFloor = floor;
              addPopup(cx, player.y - 10, '擬態隱身!', '#22c55e');
              updateHUD();
            }
            playSound('bump');
          }
        }

        // 多人猛獸碰撞（幽靈無相期間與開局 2 秒保護期內無視實體碰撞）
        const myWorldY = player.y + scrollDistance;
        for (const rp of peers.values()) {
          if (startGraceTimer > 0 || !rp.alive || player.phaseTimer > 0) continue;
          const rpAni = ANIMAL_MAP[rp.animalId] || ANIMALS[0];
          const dx = (player.x + player.w / 2) - (rp.x + 15);
          const dyWorld = myWorldY - rp.worldY;

          const hitW = Math.max(36, 18 * (ani.sizeScale + rpAni.sizeScale));
          if (Math.abs(dx) < hitW && Math.abs(dyWorld) < 34) {
            // 變色龍與別人碰撞接觸時觸發 1.8s 隱身（消耗充能，用後重算）
            if (ani.id === 'chameleon' && player.chamCharges > 0 && player.phaseTimer <= 0) {
              player.chamCharges = 0;
              player.phaseTimer = 1.8;
              player.lastChamFloor = floor;
              addPopup(player.x + 15, player.y - 10, '擬態隱身!', '#22c55e');
              updateHUD();
              continue;
            }
            // 臭鼬被撞或擦碰時噴出 2 秒臭氣雲（僅緩速不擊飛）
            if (ani.id === 'skunk' && player.skillCooldown <= 0) {
              player.skillCooldown = 2.5;
              const sx = Math.round(player.x + 15);
              const swy = Math.round(myWorldY + 14);
              skunkClouds.push({ x: sx, worldY: swy, life: 2.0 });
              publishMsg({ t: 'hazard', kind: 'skunk_cloud', x: sx, wy: swy });
              addPopup(sx, player.y - 10, '臭氣噴霧!', '#84cc16');
            }

            // 龜殼防禦或樹懶：完全免疫對手推開與控場
            if (ani.id === 'sloth' || (ani.id === 'tortoise' && player.tortoiseShell)) {
              continue;
            }

            // 燈塔水母：任何時候觸碰對手皆讓對手原地麻痺 0.5 秒（水母本身因較輕會稍微被彈開）
            if (rpAni.id === 'jellyfish' && player.stunTimer <= 0.1) {
              player.stunTimer = Math.max(player.stunTimer, 0.5);
              playSound('shock');
              addPopup(player.x + 15, player.y - 12, '麻痺 0.5s!', '#38bdf8');
              spawnParticles(player.x + 15, player.y + 15, '#38bdf8', 8);
            }

            // 原始人木棒敲暈：重型 (>=1.6)、巨大化、龜殼防禦、穿山甲、刺蝟、水母、北極熊免疫
            if (rpAni.id === 'caveman' && player.stunTimer <= 0.1) {
              const immuneCaveman = ani.weight >= 1.6 || player.giantTimer > 0 || ani.id === 'pangolin' || ani.id === 'hedgehog' || ani.id === 'jellyfish' || ani.id === 'polarbear';
              if (!immuneCaveman) {
                player.stunTimer = Math.max(player.stunTimer, 0.3);
                player.hurtTimer = 0.25;
                playSound('stomp');
                addPopup(player.x + 15, player.y - 12, '敲暈 0.3s!', '#f59e0b');
              }
            }

            const pushSign = dx >= 0 ? 1 : -1;
            let incomingForce = 215 * (rpAni.pushMul / Math.pow(ani.weight, 0.65));
            if (ani.id === 'jellyfish') {
              incomingForce *= 0.45;
            }
            if (rpAni.id === 'pangolin' || rpAni.id === 'penguin') {
              incomingForce *= 1.55;
            }
            if (rpAni.id === 'kangaroo') {
              incomingForce *= 1.65;
            }
            if (rpAni.id === 'hedgehog') {
              incomingForce *= 1.8;
            }
            if (rp.rolling) {
              incomingForce *= 2.2;
            }
            if (rpAni.id === 'capybara' || rpAni.id === 'platypus') {
              player.slowTimer = Math.max(player.slowTimer, 1.2);
            }
            if (rpAni.id === 'mastiff') {
              player.slowTimer = Math.max(player.slowTimer, 0.8);
            }
            if (ani.id === 'panda') {
              incomingForce *= 0.5;
            }
            if (boarCharging) incomingForce *= 0.4;
            player.pushVx = pushSign * incomingForce;
            playSound('bump');
            spawnParticles(player.x + 15, player.y + 15, '#78350f', 5);
          }
        }

        player.x += totalVx * dt;

        // 撿取階梯上的隨機觸發道具
        if (player.onPlatform && player.onPlatform.pickup && !player.onPlatform.pickup.taken) {
          const pk = player.onPlatform.pickup;
          const pkX = player.onPlatform.x + player.onPlatform.w / 2 + pk.xOff;
          if (Math.abs((player.x + player.w / 2) - pkX) < 28) {
            pk.taken = true;
            const wDir = Math.random() < 0.5 ? -1 : 1;
            triggerPickupEvent(pk.type, true, wDir, myName);
            publishMsg({ t: 'pickup', wy: Math.round(player.onPlatform.worldY), kind: pk.type, dir: wDir });
            spawnParticles(pkX, player.onPlatform.y - 10, pk.color, 12);
          }
        }

        // 左右岩壁邊界與各動物牆壁專屬互動
        const leftWallW = getLeftWallWidth();
        const rightWallW = getRightWallWidth();
        const lPushedWall = fieldEvents.wallTimer > 0 && fieldEvents.wallSide < 0;
        const rPushedWall = fieldEvents.wallTimer > 0 && fieldEvents.wallSide >= 0;

        const handleSideWallHit = (side, wallEdgeX, isPushedFlameWall) => {
          const pushDir = -side; // 撞左牆(-1)往右(+1)推；撞右牆(+1)往左(-1)推
          if (isPushedFlameWall) {
            if (player.invulnerable <= 0) {
              hurtPlayer(getBodyDamage('flame', 2, ani), player.x + 15, player.y, '火牆燙傷 ');
              player.pushVx = pushDir * 210;
            }
            return;
          }

          const towardWall = moveDir === side || (totalVx * side) > 35;

          // 變色龍：碰到牆壁瞬間從另一邊牆壁出來（每次落地限一次）
          if (ani.id === 'chameleon' && player.canWallTrigger && player.wallEffectCd <= 0 && towardWall) {
            player.canWallTrigger = false;
            player.x = side < 0 ? (LOGIC_W - rightWallW - player.w - 6) : (leftWallW + 6);
            player.wallEffectCd = 0.45;
            player.phaseTimer = Math.max(player.phaseTimer, 0.45);
            spawnParticles(wallEdgeX, player.y + 15, '#22c55e', 10);
            spawnParticles(player.x + player.w / 2, player.y + 15, '#22c55e', 10);
            playSound('spring');
            return;
          }

          // 跳羚／紅袋鼠：空中貼牆蹬牆躍（每次落地限一次）
          if ((ani.id === 'springbok' || ani.id === 'kangaroo') && !player.onPlatform && player.canWallTrigger && player.wallEffectCd <= 0 && towardWall) {
            player.canDoubleJump = false;
            player.canWallTrigger = false;
            player.vy = ani.id === 'kangaroo' ? -275 : -295;
            player.pushVx = pushDir * (ani.id === 'kangaroo' ? 310 : 165);
            player.facing = pushDir;
            player.wallEffectCd = 0.38;
            playSound('spring');
            return;
          }

          // 刺蝟：觸牆縮刺微反彈（每次落地限一次）
          if (ani.id === 'hedgehog' && !player.onPlatform && player.canWallTrigger && player.wallEffectCd <= 0 && towardWall) {
            player.canWallTrigger = false;
            player.pushVx = pushDir * 220;
            player.vy = -170;
            player.facing = pushDir;
            player.wallEffectCd = 0.38;
            playSound('spring');
            spawnParticles(wallEdgeX, player.y + 15, '#a16207', 6);
            return;
          }

          // 啄木鳥：空中觸牆短暫釘牆停駐 0.8 秒（每次落地限一次）
          if (ani.id === 'woodpecker' && !player.onPlatform && player.canWallTrigger && player.wallEffectCd <= 0 && towardWall) {
            player.canWallTrigger = false;
            player.wallStickTimer = 0.8;
            player.vy = 0;
            player.vx = 0;
            player.wallEffectCd = 0.45;
            playSound('bump');
            spawnParticles(wallEdgeX, player.y + 12, '#ef4444', 6);
            return;
          }

          // 樹蛙：空中觸牆蹬牆向上小躍（每次落地限一次）
          if (ani.id === 'treefrog' && !player.onPlatform && player.canWallTrigger && player.wallEffectCd <= 0 && towardWall) {
            player.canWallTrigger = false;
            player.pushVx = pushDir * 190;
            player.vy = -310;
            player.facing = pushDir;
            player.wallEffectCd = 0.38;
            playSound('spring');
            spawnParticles(wallEdgeX, player.y + 15, '#22c55e', 7);
            return;
          }

          // 貓科蹬牆反彈跳（依體型/種類區分反彈遠近，每次落地限一次）
          const felineBounce = { sandcat: [420, -265] };
          if (felineBounce[ani.id] && !player.onPlatform && player.canWallTrigger && player.wallEffectCd <= 0 && towardWall) {
            const [bx, by] = felineBounce[ani.id];
            player.canWallTrigger = false;
            player.pushVx = pushDir * bx;
            player.vy = by;
            player.facing = pushDir;
            player.jumpTimer = 0.35;
            player.wallEffectCd = 0.38;
            playSound('spring');
            spawnParticles(wallEdgeX, player.y + 16, '#fbbf24', 8);
            return;
          }

          // 台灣穿山甲：縮球撞牆如彈珠高速彈射並可撞飛對手（每次落地限一次）
          if (ani.id === 'pangolin' && player.canWallTrigger && player.wallEffectCd <= 0 && towardWall) {
            player.canWallTrigger = false;
            player.pushVx = pushDir * 440;
            player.vy = Math.min(player.vy, -210);
            player.facing = pushDir;
            player.wallEffectCd = 0.45;
            player.pangolinRollTimer = 0.7;
            playSound('spring');
            spawnParticles(wallEdgeX, player.y + 16, '#d97706', 10);
            return;
          }

          // 滑翔類（蜜袋鼯／大角鴞／安第斯神鷹）：借力反向滑翔推進（每次落地限一次，不可連續貼牆往上飛）
          if (ani.posture === 'soaring_bird' && !player.onPlatform && player.canWallTrigger && player.wallEffectCd <= 0 && towardWall) {
            player.canWallTrigger = false;
            player.pushVx = pushDir * 255;
            player.vy = Math.min(player.vy, -155);
            player.facing = pushDir;
            player.wallEffectCd = 0.45;
            playSound('spring');
            spawnParticles(wallEdgeX, player.y + 14, '#fef3c7', 7);
            return;
          }

          // 重型（歐亞野牛／非洲象／河馬／藏獒）：不反彈，撞牆產生震波震暈附近同高度對手
          if ((ani.id === 'bison' || ani.id === 'elephant' || ani.id === 'hippo' || ani.id === 'mastiff') && player.wallWaveCd <= 0 && towardWall) {
            const isMastiff = ani.id === 'mastiff';
            player.wallWaveCd = 1.25;
            shakeTime = Math.max(shakeTime, isMastiff ? 0.18 : 0.25);
            playSound('stomp');
            shockwaves.push({ x: wallEdgeX, y: player.y + 15, r: 10, maxR: isMastiff ? 105 : 135, life: 0.42, color: '#f59e0b' });
            spawnParticles(wallEdgeX, player.y + 15, '#f59e0b', 12);
            publishMsg({ t: 'wall_stun', wy: Math.round(player.y + scrollDistance), x: Math.round(wallEdgeX), r: isMastiff ? 110 : 145, stun: isMastiff ? 0.35 : 0.4 });
          }
        };

        if (player.x <= leftWallW) {
          player.x = leftWallW;
          handleSideWallHit(-1, leftWallW, lPushedWall);
        } else if (player.x + player.w >= LOGIC_W - rightWallW) {
          player.x = LOGIC_W - rightWallW - player.w;
          handleSideWallHit(1, LOGIC_W - rightWallW, rPushedWall);
        }

        const prevFootY = player.y + player.h;

        if (player.onPlatform && ani.id === 'condor' && player.condorCharges > 0 && player.condorFlyTimer <= 0 && input.up) {
          player.onPlatform = null;
          player.y -= 4;
        }
        if (player.onPlatform) {
          const p = player.onPlatform;
          const relX = (player.x + player.w / 2) - (p.x + p.w / 2);
          const tiltOffsetY = Math.sin(p.tilt) * relX;
          player.y = p.y + p.sagY + tiltOffsetY - player.h;

          const overlap = (player.x + player.w - 4 > p.x) && (player.x + 4 < p.x + p.w);
          if (!overlap || p.broken) {
            player.onPlatform = null;
            const ledgeBoosts = {
              glider: [145, -125],
              condor: [165, -95],
              owl: [140, -135],
              woodpecker: [185, -90],
              bat: [155, -110]
            };
            if (ledgeBoosts[ani.id] && moveDir !== 0 && !p.broken) {
              const [lx, ly] = ledgeBoosts[ani.id];
              player.pushVx = moveDir * lx;
              player.vy = ly;
              if (ani.posture === 'soaring_bird') {
                spawnParticles(player.x + 15, player.y + 20, '#fef3c7', 4);
              }
            } else {
              player.vy = 0;
            }
          }
        }

        if (!player.onPlatform) {
          const nearLeftWall = player.x <= leftWallW + 3 && !lPushedWall;
          const nearRightWall = player.x + player.w >= LOGIC_W - rightWallW - 3 && !rPushedWall;
          if (player.wallStickTimer > 0 && ((!nearLeftWall && !nearRightWall) || (nearLeftWall && moveDir > 0) || (nearRightWall && moveDir < 0))) {
            player.wallStickTimer = 0;
          }
          const isGlider = ani.posture === 'soaring_bird' || player.featherTimer > 0;
          const isWallClinger = (ani.id === 'octopus' || ani.id === 'sloth' || ani.id === 'spider') && (nearLeftWall || nearRightWall);
          // 安第斯神鷹：空中往上推動即啟動 3 秒多方向飛行
          if (ani.id === 'condor' && player.condorCharges > 0 && player.condorFlyTimer <= 0 && input.up) {
            player.condorCharges = 0;
            player.condorFlyTimer = 3.0;
            player.lastCondorFloor = floor;
            addPopup(player.x + 15, player.y - 10, '神鷹翱翔 3s!', '#f59e0b');
            playSound('spring');
            updateHUD();
          }
          let gravity = (isGlider && player.vy > 0) ? 500 : 980;
          let maxFall = isGlider ? 290 : 580;
          if (ani.id === 'condor' && player.condorFlyTimer > 0) {
            // 神鷹 3 秒多方向自由飛行
            gravity = 0;
            maxFall = 260;
            if (input.up) player.vy = -210;
            else if (input.down) player.vy = 220;
            else player.vy *= Math.pow(0.05, dt);
            if (Math.random() < 0.35) spawnParticles(player.x + 15, player.y + 24, '#fef08a', 1);
          } else if (windFlyActive) {
            // 強風期間飛行系可啟動多方向飛行（受風吹影響，僅順風方向飛行）
            gravity = 0;
            maxFall = 240;
            if (input.up) player.vy = -175;
            else if (input.down) player.vy = 200;
            else player.vy *= Math.pow(0.1, dt);
            if (Math.random() < 0.3) spawnParticles(player.x + 15, player.y + 20, '#bae6fd', 1);
          } else if (isGlider && input.down && player.wallStickTimer <= 0) {
            gravity = 1650;
            maxFall = 760;
            if (Math.random() < 0.35) {
              spawnParticles(player.x + 15, player.y + 8, '#fef3c7', 1);
            }
          }
          if (player.wallStickTimer > 0) {
            gravity = 0;
            maxFall = 0;
            player.vy = 0;
          } else if (isWallClinger && player.vy > 0) {
            gravity = 320;
            maxFall = 120;
          }
          if (!(ani.id === 'condor' && player.condorFlyTimer > 0) && !windFlyActive) {
            player.vy = Math.min(maxFall, player.vy + gravity * dt);
          }

          // 環尾狐猴空中翻身二段跳
          if (ani.id === 'lemur' && player.canDoubleJump && player.vy > 210 && (input.left || input.right)) {
            player.canDoubleJump = false;
            player.vy = -275;
            player.jumpTimer = 0.35;
            playSound('spring');
            spawnParticles(player.x + 15, player.y + 26, '#ffffff', 6);
          }

          player.y += (player.vy * dt) - dy;
          const newFootY = player.y + player.h;

          if (player.vy >= 0) {
            for (const p of platforms) {
              if (p.broken) continue;
              const horizOverlap = (player.x + player.w - 4 > p.x) && (player.x + 4 < p.x + p.w);
              const relX = (player.x + player.w / 2) - (p.x + p.w / 2);
              const surfY = p.y + p.sagY + Math.sin(p.tilt) * relX;
              if (horizOverlap && prevFootY <= surfY + 14 && newFootY >= surfY - 2) {
                handleLanding(p, player.vy);
                break;
              }
            }
          }
        }

        // 底部淹水：親水物種可游泳漂浮在水面上，其餘物種碰水扣血
        if (fieldEvents.floodTimer > 0) {
          const floodTop = getFloodTopY();
          if (player.y + player.h >= floodTop + 2) {
            if (AQUATIC_IDS.has(ani.id)) {
              player.onPlatform = null;
              player.canDoubleJump = true;
              player.canWallTrigger = true;
              const bobY = Math.sin(Date.now() * 0.008) * 2.5;
              player.y = floodTop - player.h + 4 + bobY;
              if (player.vy > 0) player.vy = 0;
              if (Math.random() < 0.25) {
                spawnParticles(player.x + 15, floodTop + 2, '#38bdf8', 1);
              }
            } else if (player.y + player.h > floodTop + 6 && player.invulnerable <= 0) {
              const floodDmg = Math.max(1, getBodyDamage('flood', 2, ani));
              hurtPlayer(floodDmg, player.x + 15, player.y, '溺水扣血 ');
              if (ani.posture === 'soaring_bird') player.vy = -140;
            }
          }
        }

        const ceilingSpikeH = getCeilingSpikeH();
        if (player.y <= ceilingSpikeH) {
          if (ani.id === 'bat' && player.batCharges > 0) {
            player.batCharges = 0;
            player.lastBatFloor = floor;
            player.invulnerable = 0.55;
            player.onPlatform = null;
            player.y = ceilingSpikeH + 6;
            player.vy = 210;
            playSound('spring');
            addPopup(player.x + player.w / 2, ceilingSpikeH + 18, '蝙蝠吊掛免傷!', '#a855f7');
            spawnParticles(player.x + player.w / 2, ceilingSpikeH + 8, '#a855f7', 10);
            updateHUD();
          } else {
            const dmg = getBodyDamage('ceiling', 5, ani);
            hurtPlayer(dmg, player.x + player.w / 2, ceilingSpikeH + 10, '頂部鋼筋 ');
            player.onPlatform = null;
            player.y = ceilingSpikeH + 5;
            player.vy = 190;
          }
        }

        if (player.y > H + 35) {
          hp = 0;
          updateHUD();
          triggerGameOver();
        }

        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.r += (sw.maxR - sw.r) * 10 * dt;
          sw.life -= dt;
          if (sw.life <= 0) shockwaves.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.vy += 300 * dt;
          pt.life -= dt;
          if (pt.life <= 0) particles.splice(i, 1);
        }

        for (let i = popups.length - 1; i >= 0; i--) {
          const pp = popups[i];
          pp.y -= 36 * dt;
          pp.life -= dt;
          if (pp.life <= 0) popups.splice(i, 1);
        }
      }

      // ================== 蒼白迷霧 × 高反差廢墟背景渲染 ==================
      let cachedBgTier = -1, cachedBgH = -1, cachedBgGrad = null;
      function drawAtmosphericBackground() {
        const bgTier = floor < 30 ? 0 : (floor < 60 ? 1 : 2);
        if (!cachedBgGrad || cachedBgTier !== bgTier || cachedBgH !== H) {
          cachedBgTier = bgTier;
          cachedBgH = H;
          const grad = ctx.createLinearGradient(0, 0, 0, H);
          if (bgTier === 0) {
            grad.addColorStop(0, '#fffbeb');
            grad.addColorStop(0.5, '#fef3c7');
            grad.addColorStop(1, '#dcfce7');
          } else if (bgTier === 1) {
            grad.addColorStop(0, '#faf5ff');
            grad.addColorStop(0.55, '#ede9fe');
            grad.addColorStop(1, '#dbeafe');
          } else {
            grad.addColorStop(0, '#fff7ed');
            grad.addColorStop(0.55, '#ffedd5');
            grad.addColorStop(1, '#fed7aa');
          }
          cachedBgGrad = grad;
        }
        ctx.fillStyle = cachedBgGrad;
        ctx.fillRect(0, 0, LOGIC_W, H);

        // 柔和手繪樹枝與遠景層次
        const bgScroll = (scrollDistance * 0.25) % 210;
        ctx.fillStyle = bgTier === 0 ? 'rgba(134, 239, 172, 0.26)' : (bgTier === 1 ? 'rgba(196, 181, 253, 0.22)' : 'rgba(253, 186, 116, 0.26)');
        for (let y = -bgScroll; y < H + 210; y += 210) {
          ctx.beginPath();
          ctx.ellipse(LOGIC_W * 0.25, y + 60, 75, 22, -0.1, 0, Math.PI * 2);
          ctx.ellipse(LOGIC_W * 0.78, y + 145, 68, 20, 0.12, 0, Math.PI * 2);
          ctx.fill();
        }

        // 繪本柔白小雲朵
        ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
        for (const mc of mistClouds) {
          ctx.beginPath();
          ctx.arc(mc.x, mc.y, mc.r * 0.55, 0, Math.PI * 2);
          ctx.arc(mc.x - mc.r * 0.35, mc.y + 4, mc.r * 0.38, 0, Math.PI * 2);
          ctx.arc(mc.x + mc.r * 0.35, mc.y + 4, mc.r * 0.38, 0, Math.PI * 2);
          ctx.fill();
        }

        // 繪本圓木岩壁（單側推擠事件時推到畫面中心，剩餘 55% 空間）
        const lw = getLeftWallWidth();
        const rw = getRightWallWidth();
        const lPushed = fieldEvents.wallTimer > 0 && fieldEvents.wallSide < 0;
        const rPushed = fieldEvents.wallTimer > 0 && fieldEvents.wallSide >= 0;

        ctx.fillStyle = lPushed ? '#c2410c' : '#854d0e';
        ctx.fillRect(0, 0, lw, H);
        ctx.fillStyle = rPushed ? '#c2410c' : '#854d0e';
        ctx.fillRect(LOGIC_W - rw, 0, rw, H);

        ctx.fillStyle = lPushed ? '#ea580c' : '#a16207';
        ctx.fillRect(0, 0, Math.max(2, lw - 4), H);
        ctx.fillStyle = rPushed ? '#ea580c' : '#a16207';
        ctx.fillRect(LOGIC_W - rw + 4, 0, Math.max(2, rw - 4), H);

        // 深棕手繪邊線
        ctx.fillStyle = lPushed ? '#fde047' : '#451a03';
        ctx.fillRect(lw - 2.5, 0, 2.5, H);
        ctx.fillStyle = rPushed ? '#fde047' : '#451a03';
        ctx.fillRect(LOGIC_W - rw, 0, 2.5, H);

        // 手繪原木石塊圓角紋理
        ctx.strokeStyle = '#5c3a21';
        ctx.lineWidth = 1.6;
        for (let y = -wallOffset; y < H; y += 22) {
          ctx.beginPath();
          ctx.roundRect(1, y + 1, Math.max(4, lw - 4), 19, 4);
          ctx.roundRect(LOGIC_W - rw + 3, y + 1, Math.max(4, rw - 4), 19, 4);
          ctx.stroke();
        }

        // 推擠那側牆壁邊緣跳動熊熊火焰
        if (lPushed || rPushed) {
          ctx.save();
          const nowT = Date.now() * 0.012;
          const fx = lPushed ? lw : (LOGIC_W - rw);
          const dirF = lPushed ? 1 : -1;
          for (let fy = 18; fy < H - 10; fy += 24) {
            const flicker = Math.sin(nowT + fy * 0.25) * 4;
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(fx, fy - 10);
            ctx.quadraticCurveTo(fx + dirF * (18 + flicker), fy, fx, fy + 10);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.moveTo(fx, fy - 5);
            ctx.quadraticCurveTo(fx + dirF * (10 + flicker * 0.6), fy, fx, fy + 5);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        }
      }

      function drawCeilingSpikes() {
        const spikeH = getCeilingSpikeH();
        const baseTop = spikeH - 22;

        // 0.8s 下壓前紅色警示線
        if (fieldEvents.ceilingTimer > 5.0) {
          ctx.save();
          ctx.fillStyle = `rgba(239, 68, 68, ${0.22 + Math.sin(Date.now() * 0.03) * 0.16})`;
          ctx.fillRect(0, 0, LOGIC_W, 40);
          ctx.strokeStyle = '#dc2626';
          ctx.lineWidth = 2.5;
          ctx.setLineDash([8, 6]);
          ctx.beginPath();
          ctx.moveTo(0, 40); ctx.lineTo(LOGIC_W, 40);
          ctx.stroke();
          ctx.restore();
        }

        // 手繪深棕木橫樑
        ctx.fillStyle = '#5c3a21';
        ctx.fillRect(0, 0, LOGIC_W, Math.max(8, baseTop + 8));
        ctx.fillStyle = '#92400e';
        ctx.fillRect(0, Math.max(2, baseTop + 2), LOGIC_W, 4);

        const spikeW = 18;
        const spikeGrad = ctx.createLinearGradient(0, baseTop + 6, 0, spikeH);
        spikeGrad.addColorStop(0, '#fef2f2');
        spikeGrad.addColorStop(0.55, '#fca5a5');
        spikeGrad.addColorStop(1, '#ef4444');
        ctx.fillStyle = spikeGrad;
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 1.6;
        for (let x = 12; x < LOGIC_W - 12; x += spikeW) {
          ctx.beginPath();
          ctx.moveTo(x + 1, baseTop + 6);
          ctx.lineTo(x + spikeW / 2, spikeH);
          ctx.lineTo(x + spikeW - 1, baseTop + 6);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      }

      let PLAT_GRADS = null;
      function getPlatGrads() {
        if (PLAT_GRADS) return PLAT_GRADS;
        const mk = (c1, c2) => {
          const g = ctx.createLinearGradient(0, -8, 0, 8);
          g.addColorStop(0, c1);
          g.addColorStop(1, c2);
          return g;
        };
        PLAT_GRADS = {
          steel: mk('#d97706', '#92400e'),
          steelOver: mk('#fb923c', '#9a3412'),
          seesaw: mk('#fcd34d', '#d97706'),
          wood: mk('#fde68a', '#d97706')
        };
        return PLAT_GRADS;
      }

      function drawPlatforms() {
        const electricCycle = (Date.now() % 1800) < 480;
        const grads = getPlatGrads();

        for (const p of platforms) {
          if (p.y < -35 || p.y > H + 35) continue;
          ctx.save();

          const cx = p.x + p.w / 2;
          const cy = p.y + p.sagY + p.h / 2;

          if (p.type === 'seesaw') {
            ctx.strokeStyle = '#3f3f46';
            ctx.lineWidth = 2;
            ctx.setLineDash([3, 2]);
            ctx.beginPath();
            ctx.moveTo(cx, cy - 26);
            ctx.lineTo(cx, cy);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          ctx.translate(cx, cy);
          ctx.rotate(p.tilt);

          const hw = p.w / 2;
          const hh = p.h / 2;

          ctx.fillStyle = 'rgba(92, 58, 33, 0.16)';
          ctx.beginPath();
          ctx.roundRect(-hw + 2, hh, p.w, 5, 4);
          ctx.fill();

          if (p.type === 'steel') {
            // 繪本穩固草皮木頭踏板
            const overloadShake = p.overloadTimer > 0 ? (Math.random() - 0.5) * 4 : 0;
            ctx.fillStyle = p.overloadTimer > 0 ? grads.steelOver : grads.steel;
            ctx.beginPath();
            ctx.roundRect(-hw + overloadShake, -hh, p.w, p.h, 6);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 2;
            ctx.stroke();
            // 綠草頂飾
            ctx.fillStyle = p.overloadTimer > 0 ? '#fdba74' : '#4ade80';
            ctx.beginPath();
            ctx.roundRect(-hw + 2 + overloadShake, -hh + 1, p.w - 4, 5, 4);
            ctx.fill();
          } else if (p.type === 'seesaw') {
            // 繪本平衡木翹翹板
            ctx.fillStyle = grads.seesaw;
            ctx.beginPath();
            ctx.roundRect(-hw, -hh, p.w, p.h, 6);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          } else if (p.type === 'wood') {
            // 繪本酥脆餅乾裂紋木板
            const shakeX = p.touched && !p.broken ? (Math.random() - 0.5) * 4 : 0;
            ctx.fillStyle = grads.wood;
            ctx.beginPath();
            ctx.roundRect(-hw + shakeX, -hh, p.w, p.h, 5);
            ctx.fill();
            ctx.strokeStyle = '#78350f';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-18 + shakeX, -hh); ctx.lineTo(-10 + shakeX, 1); ctx.lineTo(-15 + shakeX, hh);
            ctx.moveTo(14 + shakeX, -hh); ctx.lineTo(6 + shakeX, 0); ctx.lineTo(12 + shakeX, hh);
            ctx.stroke();
          } else if (p.type === 'taxi') {
            // 繪本馬戲團紅白彈簧墊
            const comp = p.springCompress * 6;
            ctx.fillStyle = '#991b1b';
            ctx.beginPath();
            ctx.roundRect(-hw, hh - 4, p.w, 5, 3);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 2.8;
            ctx.beginPath();
            for (let sx = -18; sx <= 18; sx += 9) {
              ctx.moveTo(sx, hh - 4);
              ctx.lineTo(sx + 4.5, -hh + 3 + comp);
              ctx.lineTo(sx + 9, hh - 4);
            }
            ctx.stroke();
            const rg = ctx.createLinearGradient(0, -hh + comp, 0, -hh + 8 + comp);
            rg.addColorStop(0, '#fca5a5');
            rg.addColorStop(0.4, '#ef4444');
            rg.addColorStop(1, '#b91c1c');
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.roundRect(-hw, -hh - 2 + comp, p.w, 8, 5);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 1.8;
            ctx.stroke();
          } else if (p.type === 'moss') {
            // 繪本水光苔癬石板
            ctx.fillStyle = '#a8a29e';
            ctx.beginPath();
            ctx.roundRect(-hw, -hh, p.w, p.h, 6);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            const mg = ctx.createLinearGradient(0, -hh, 0, -hh + 7);
            mg.addColorStop(0, '#bef264');
            mg.addColorStop(1, '#65a30d');
            ctx.fillStyle = mg;
            ctx.beginPath();
            ctx.roundRect(-hw - 1, -hh - 1, p.w + 2, 7, 5);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.beginPath();
            ctx.arc(-20, -hh + 2, 2, 0, Math.PI * 2);
            ctx.arc(14, -hh + 2, 1.6, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.type === 'conveyor_l' || p.type === 'conveyor_r') {
            // 繪本橘黃齒輪輸送帶
            ctx.fillStyle = '#fb923c';
            ctx.beginPath();
            ctx.roundRect(-hw, -hh, p.w, p.h, 7);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#fef3c7';
            ctx.beginPath();
            ctx.arc(-hw + 7, 0, 4.5, 0, Math.PI * 2);
            ctx.arc(hw - 7, 0, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.4;
            const dir = p.type === 'conveyor_r' ? 1 : -1;
            const shift = dir * (conveyorAnim - 8);
            for (let ax = -hw + 20; ax <= hw - 20; ax += 14) {
              const drawX = ax + shift * 0.5;
              ctx.beginPath();
              ctx.moveTo(drawX - 4 * dir, -4);
              ctx.lineTo(drawX + 3 * dir, 0);
              ctx.lineTo(drawX - 4 * dir, 4);
              ctx.stroke();
            }
          } else if (p.type === 'barbed') {
            // 繪本紅白警告尖刺木條
            ctx.fillStyle = '#78350f';
            ctx.beginPath();
            ctx.roundRect(-hw, -hh + 5, p.w, p.h - 4, 4);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 1.6;
            ctx.stroke();
            for (let sx = -hw + 2; sx < hw - 6; sx += 10) {
              const spg = ctx.createLinearGradient(sx, -hh - 8, sx, -hh + 5);
              spg.addColorStop(0, '#ef4444');
              spg.addColorStop(0.55, '#fecaca');
              spg.addColorStop(1, '#ffffff');
              ctx.fillStyle = spg;
              ctx.beginPath();
              ctx.moveTo(sx, -hh + 5);
              ctx.lineTo(sx + 5, -hh - 8);
              ctx.lineTo(sx + 10, -hh + 5);
              ctx.closePath();
              ctx.fill();
              ctx.strokeStyle = '#451a03';
              ctx.lineWidth = 1.2;
              ctx.stroke();
            }
          } else if (p.type === 'electric') {
            // 繪本電擊亮藍雲朵板（隨時漏電，持續冒電弧）
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.roundRect(-hw, -hh, p.w, p.h, 6);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.fillStyle = '#fde047';
            ctx.fillRect(-hw + 2, -hh + 1, 9, p.h - 2);
            ctx.fillRect(hw - 11, -hh + 1, 9, p.h - 2);
            ctx.strokeStyle = electricCycle ? '#fef08a' : 'rgba(254, 240, 138, 0.75)';
            ctx.lineWidth = electricCycle ? 2.6 : 1.8;
            ctx.beginPath();
            ctx.moveTo(-hw + 10, -hh - 3);
            for (let ex = -hw + 20; ex <= hw - 10; ex += 10) {
              ctx.lineTo(ex, -hh - 3 + (Math.random() - 0.5) * 11);
            }
            ctx.stroke();
          } else if (p.type === 'slanted_l' || p.type === 'slanted_r') {
            // 繪本滑梯木板
            const slg = ctx.createLinearGradient(0, -hh, 0, hh);
            slg.addColorStop(0, '#f59e0b');
            slg.addColorStop(1, '#b45309');
            ctx.fillStyle = slg;
            ctx.beginPath();
            ctx.roundRect(-hw, -hh, p.w, p.h, 6);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.fillStyle = '#fef3c7';
            ctx.fillRect(-hw + 4, -hh + 2, p.w - 8, 3);
          } else if (p.type === 'supply') {
            // 繪本草地＋急救禮盒
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.roundRect(-hw, -hh, p.w, p.h, 6);
            ctx.fill();
            ctx.strokeStyle = '#14532d';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            if (p.crateIntact) {
              ctx.fillStyle = '#fffbeb';
              ctx.beginPath();
              ctx.roundRect(-12, -hh - 17, 24, 17, 5);
              ctx.fill();
              ctx.strokeStyle = '#451a03';
              ctx.lineWidth = 1.6;
              ctx.stroke();
              ctx.fillStyle = '#ef4444';
              ctx.fillRect(-2, -hh - 14, 4, 11);
              ctx.fillRect(-5.5, -hh - 10.5, 11, 4);
            }
          }

          // 脆化警示紅裂紋
          if (p.brittle && !p.broken) {
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(-24, -hh); ctx.lineTo(-16, 0); ctx.lineTo(-22, hh);
            ctx.moveTo(16, -hh); ctx.lineTo(10, 0); ctx.lineTo(18, hh);
            ctx.stroke();
          }

          // 階梯上發光懸浮隨機觸發道具球
          if (p.pickup && !p.pickup.taken && !p.broken) {
            const pk = p.pickup;
            const bobY = -hh - 17 + Math.sin(Date.now() * 0.006 + p.x) * 3;
            ctx.save();
            ctx.fillStyle = pk.color;
            ctx.globalAlpha = 0.28;
            ctx.beginPath();
            ctx.arc(pk.xOff, bobY, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(pk.xOff, bobY, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = pk.color;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(pk.icon, pk.xOff, bobY + 1);
            ctx.restore();
          }

          ctx.restore();
        }
      }

      function drawInGameAnimal(x, y, facing, walkFrame, animalId, name, hpVal, alpha = 1, isLocal = false, vy = 0, action = 'idle') {
        const ani = ANIMAL_MAP[animalId] || ANIMALS[0];
        ctx.save();
        ctx.globalAlpha = alpha;

        const giantBoost = (isLocal && player.giantTimer > 0) ? (ani.weight < 0.95 ? 1.65 : 1.4) : 1.0;
        const inGameBaseScale = 1.7 * giantBoost;
        const s = inGameBaseScale * ani.sizeScale;
        const cx = x + 15;
        // 腳底精準對齊 y + 28（階梯表面）
        const cy = (y + 28) - 15 * s;
        const headY = cy - 23 * s - 12;

        ctx.font = '900 11px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.strokeText(name, cx, headY);
        ctx.fillStyle = isLocal ? '#92400e' : '#451a03';
        ctx.fillText(name, cx, headY);

        const pitch = ani.posture === 'bipedal_bear' ? 0 : Math.max(-0.28, Math.min(0.28, vy * 0.0005));
        drawAuthenticAnimal(ctx, animalId, cx, cy, inGameBaseScale, facing, walkFrame, pitch, action);

        if (isLocal && animalId === 'tortoise' && player.tortoiseShell) {
          ctx.save();
          ctx.strokeStyle = 'rgba(245, 158, 11, 0.9)';
          ctx.fillStyle = 'rgba(251, 191, 36, 0.22)';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.arc(cx, cy + 2, 16 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
        if (isLocal && ((animalId === 'mole' && player.moleCharges > 0) || (animalId === 'bat' && player.batCharges > 0))) {
          ctx.save();
          ctx.fillStyle = animalId === 'mole' ? '#f59e0b' : '#a855f7';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(cx + 15 * s, cy - 12 * s, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        ctx.restore();
      }

      function drawRemotePlayers() {
        for (const rp of peers.values()) {
          if (!rp.alive) continue;
          const screenY = rp.worldY - scrollDistance;
          const ani = ANIMAL_MAP[rp.animalId] || ANIMALS[0];

          if (screenY > -40 && screenY < H + 40) {
            drawInGameAnimal(rp.x, screenY, rp.facing, Date.now() * 0.012, rp.animalId, rp.name, rp.hp, 0.88, false, rp.vy, rp.actionState || 'idle');
          } else {
            ctx.save();
            const clampedY = Math.max(30, Math.min(H - 22, screenY));
            const cx = Math.max(40, Math.min(LOGIC_W - 40, rp.x + 15));
            ctx.fillStyle = '#18181b';
            ctx.font = '900 11px system-ui, sans-serif';
            ctx.textAlign = 'center';
            const arrow = screenY < 0 ? '▲' : '▼';
            ctx.fillText(`${arrow} [${ani.name}] ${rp.name}`, cx, clampedY);
            ctx.restore();
          }
        }
      }

      function drawEffects() {
        // 全場事件視覺層（冷凍冰霜、狂風氣流、中央磁場）
        if (fieldEvents.freezeTimer > 0) {
          ctx.save();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.18)';
          ctx.fillRect(0, 0, LOGIC_W, H);
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 6;
          ctx.strokeRect(3, 3, LOGIC_W - 6, H - 6);
          ctx.restore();
        }
        if (fieldEvents.windTimer > 0) {
          ctx.save();
          const dir = fieldEvents.windDir >= 0 ? 1 : -1;
          const now = Date.now();
          const tShift = (now * 0.52 * dir) % LOGIC_W;
          // 高對比黑色波浪線條與大方向箭頭
          for (let wy = 56; wy < H - 36; wy += 44) {
            const wx = ((wy * 4 + tShift) % LOGIC_W + LOGIC_W) % LOGIC_W;
            const len = 62;
            const endX = wx + len * dir;
            ctx.strokeStyle = 'rgba(24, 24, 27, 0.82)';
            ctx.lineWidth = 3.2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(wx, wy);
            for (let step = 1; step <= 6; step++) {
              const sx = wx + (len * (step / 6)) * dir;
              const sy = wy + Math.sin(step * 1.4 + now * 0.014) * 5.5;
              ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            const tipY = wy + Math.sin(6 * 1.4 + now * 0.014) * 5.5;
            ctx.beginPath();
            ctx.moveTo(endX - 8 * dir, tipY - 6);
            ctx.lineTo(endX, tipY);
            ctx.lineTo(endX - 8 * dir, tipY + 6);
            ctx.stroke();
          }
          // 醒目風向提示牌
          ctx.fillStyle = 'rgba(24, 24, 27, 0.86)';
          ctx.beginPath();
          ctx.roundRect(LOGIC_W / 2 - 98, H - 96, 196, 26, 13);
          ctx.fill();
          ctx.strokeStyle = '#fde047';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = '#fef9c3';
          ctx.font = '900 12px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(dir > 0 ? '💨 強風向右吹襲中 >>>' : '<<< 強風向左吹襲中 💨', LOGIC_W / 2, H - 83);
          ctx.restore();
        }

        // 底部向上淹水（5 秒）波浪特效
        if (fieldEvents.floodTimer > 0) {
          ctx.save();
          const topY = getFloodTopY();
          const nowW = Date.now() * 0.008;
          ctx.beginPath();
          ctx.moveTo(0, H);
          ctx.lineTo(0, topY);
          for (let wx = 0; wx <= LOGIC_W; wx += 14) {
            ctx.lineTo(wx, topY + Math.sin(wx * 0.06 + nowW) * 5);
          }
          ctx.lineTo(LOGIC_W, H);
          ctx.closePath();
          const wg = ctx.createLinearGradient(0, topY, 0, H);
          wg.addColorStop(0, 'rgba(56, 189, 248, 0.58)');
          wg.addColorStop(1, 'rgba(2, 132, 199, 0.82)');
          ctx.fillStyle = wg;
          ctx.fill();
          // 白色浪花頂線
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          for (let wx = 0; wx <= LOGIC_W; wx += 14) {
            const wy = topY + Math.sin(wx * 0.06 + nowW) * 5;
            if (wx === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
          }
          ctx.stroke();
          ctx.restore();
        }

        // 土石流落石與落點預警
        for (const rk of rockslideRocks) {
          ctx.save();
          if (rk.warn > 0) {
            ctx.fillStyle = 'rgba(220, 38, 38, 0.85)';
            ctx.beginPath();
            ctx.moveTo(rk.x, 36);
            ctx.lineTo(rk.x - 8, 22);
            ctx.lineTo(rk.x + 8, 22);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(220, 38, 38, 0.35)';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(rk.x, 36); ctx.lineTo(rk.x, H);
            ctx.stroke();
          } else {
            ctx.translate(rk.x, rk.y);
            ctx.fillStyle = '#78350f';
            ctx.beginPath();
            ctx.arc(0, 0, rk.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 2.2;
            ctx.stroke();
            ctx.fillStyle = '#a16207';
            ctx.beginPath();
            ctx.arc(-rk.r * 0.3, -rk.r * 0.3, rk.r * 0.35, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // 蜘蛛網陷阱與臭鼬臭氣雲
        for (const wb of spiderWebs) {
          const wy = wb.worldY - scrollDistance;
          if (wy < -30 || wy > H + 30) continue;
          ctx.save();
          ctx.globalAlpha = Math.min(1, wb.life * 0.9);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
          ctx.lineWidth = 1.5;
          for (let a = 0; a < 4; a++) {
            const ang = (a * Math.PI) / 4;
            ctx.beginPath();
            ctx.moveTo(wb.x - Math.cos(ang) * 24, wy - Math.sin(ang) * 10);
            ctx.lineTo(wb.x + Math.cos(ang) * 24, wy + Math.sin(ang) * 10);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.ellipse(wb.x, wy, 20, 8, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
        for (const cl of skunkClouds) {
          const cy = cl.worldY - scrollDistance;
          if (cy < -50 || cy > H + 50) continue;
          ctx.save();
          ctx.globalAlpha = Math.min(0.65, cl.life * 0.45);
          ctx.fillStyle = '#84cc16';
          ctx.beginPath();
          ctx.arc(cl.x - 12, cy, 18, 0, Math.PI * 2);
          ctx.arc(cl.x + 12, cy - 4, 20, 0, Math.PI * 2);
          ctx.arc(cl.x, cy + 6, 17, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        for (const sw of shockwaves) {
          ctx.save();
          ctx.strokeStyle = `rgba(180, 83, 9, ${sw.life * 2.5})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(sw.x, sw.y, sw.r, sw.r * 0.35, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        for (const pt of particles) {
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = Math.max(0, pt.life * 2);
          ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
        }
        ctx.globalAlpha = 1;

        for (const pp of popups) {
          ctx.save();
          ctx.font = '900 13px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.globalAlpha = Math.max(0, pp.life / pp.maxLife);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(pp.text, pp.x + 1, pp.y + 1);
          ctx.fillStyle = pp.color;
          ctx.fillText(pp.text, pp.x, pp.y);
          ctx.restore();
        }

        // 全場效果全員文字橫幅提醒
        if (fieldBanner.timer > 0 && fieldBanner.text) {
          ctx.save();
          const fade = Math.min(1, fieldBanner.timer * 2.2);
          ctx.globalAlpha = fade;
          const bw = Math.min(LOGIC_W - 24, 332);
          const bx = (LOGIC_W - bw) / 2;
          const by = 46;
          ctx.fillStyle = 'rgba(255, 251, 235, 0.95)';
          ctx.beginPath();
          ctx.roundRect(bx, by, bw, 30, 15);
          ctx.fill();
          ctx.strokeStyle = fieldBanner.color;
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.fillStyle = '#451a03';
          ctx.font = '900 13px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(fieldBanner.text, LOGIC_W / 2, by + 15);
          ctx.restore();
        }

        // 開局同步 3 秒倒數（清楚看到站位與下方階梯）
        if (state === 'PLAYING' && countdownTimer > 0) {
          const sec = Math.max(1, Math.ceil(countdownTimer));
          const frac = countdownTimer - Math.floor(countdownTimer);
          const pulse = 1 + Math.sin(frac * Math.PI) * 0.16;
          ctx.save();
          ctx.translate(LOGIC_W / 2, 108);
          ctx.scale(pulse, pulse);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
          ctx.beginPath();
          ctx.roundRect(-84, -38, 168, 76, 18);
          ctx.fill();
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = '900 40px Georgia, serif';
          ctx.fillStyle = '#fef08a';
          ctx.fillText(String(sec), 0, -6);

          ctx.font = '800 12px system-ui, sans-serif';
          ctx.fillStyle = '#f8fafc';
          ctx.fillText('準備起跑 · 觀察下方階梯', 0, 24);
          ctx.restore();
        }
      }

      function render(now) {
        renderSelectScreenPortraits(now);

        ctx.save();
        if (shakeTime > 0) {
          const dx = (Math.random() - 0.5) * 9;
          const dy = (Math.random() - 0.5) * 9;
          ctx.translate(dx, dy);
        }

        drawAtmosphericBackground();
        drawPlatforms();
        drawRemotePlayers();

        if (state === 'PLAYING' && !(player.invulnerable > 0 && Math.floor(player.invulnerable * 20) % 2 === 0)) {
          drawInGameAnimal(
            player.x,
            player.y,
            player.facing,
            player.walkFrame,
            myAnimalId,
            myName,
            hp,
            player.phaseTimer > 0 ? 0.42 : 1,
            true,
            player.vy,
            player.actionState
          );
        }

        drawCeilingSpikes();
        drawEffects();

        ctx.restore();
      }

      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        render(now);
        requestAnimationFrame(loop);
      }

      updateHUD();
      renderRoster();
      connectMultiplayer();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
